# cargo-nextest configuration for the Ferrosa workspace.
#
# Why nextest: libtest runs each test *binary* serially and threads within a
# binary, so the wall clock is the sum of every binary's slowest test. A single
# pathological test therefore stalls the whole run even on an 18-core machine.
# nextest runs every test in its own process and schedules across all cores,
# which is what makes per-test timing visible and the slow tail parallel.
#
# Usage:
#   cargo nextest run --all-features --workspace
#   cargo nextest run -p ferrosa-storage
#
# `cargo test` remains correct for anything nextest cannot express; both may be
# used. CI and scripts/pre-push-tests.sh prefer nextest when it is installed.

[store]
# Reuse the same target dir layout as cargo so nextest and cargo test share
# build artifacts instead of building the workspace twice.
dir = "target/nextest"

[test-groups]
# Tests that assert ABSOLUTE wall-clock or memory bounds measure the machine,
# not the code. Under nextest's default full parallelism they contend with other
# tests and flake; this group pins them to a single slot so their budgets stay
# meaningful while everything else still runs wide.
timing-sensitive = { max-threads = 1 }

[[profile.default.overrides]]
# The sidecar memory-bound tests arm a global-allocator hook and write 64k
# postings one at a time. They are correctness-critical (they police the
# "heap must not grow with the index" budget) but they are the single largest
# cost in the suite, so they get the serial slot and a generous timeout rather
# than being deleted or ignored.
filter = "binary(sidecar_memory_bound)"
test-group = "timing-sensitive"
# 900s: the observed cost is ~840s in a debug build. A regression that doubles
# it should fail loudly rather than hang the run.
slow-timeout = { period = "900s", terminate-after = 1 }

[[profile.default.overrides]]
# Tests asserting absolute wall-clock bounds (accord perf) measure contention.
# Keep them off the wide parallel run; they are already skipped on PR CI.
filter = "test(/accord::perf/)"
test-group = "timing-sensitive"
slow-timeout = { period = "300s", terminate-after = 1 }

[profile.default]
# A test that hangs must not hang CI. This is a backstop, not a budget: normal
# tests finish in milliseconds, and the overrides above carry the real limits.
slow-timeout = { period = "120s", terminate-after = 2 }
# Report the slowest tests so the next pathological one is found by data, not
# by someone noticing a 45-minute run.
final-status-level = "slow"
fail-fast = false
