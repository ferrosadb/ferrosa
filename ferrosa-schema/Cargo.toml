[package]
name = "ferrosa-schema"
description = "Schema management for Ferrosa: metadata, auth, audit, system keyspaces"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ferrosa-common = { path = "../ferrosa-common" }
ferrosa-index = { path = "../ferrosa-index" }
ferrosa-sstable = { path = "../ferrosa-sstable" }
arc-swap = "1.7"
bcrypt = "0.19"
argon2 = "0.6.0-rc.8"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
tracing = "0.1"
password-hash = { version = "0.6", features = ["rand_core", "getrandom"] }

[dev-dependencies]
proptest = "1"
serial_test = "3"
tracing-subscriber = { version = "0.3", features = ["json"] }
