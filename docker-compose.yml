##############################################################################
# LOCAL DEV ONLY — auth disabled                                             #
#                                                                            #
# This compose file is for local development and integration testing ONLY.  #
# All three ferrosa nodes run with FERROSA_AUTH_DISABLED=true because the   #
# binary does NOT support an env-var-injected initial admin password at      #
# startup. Auth is hardened after cluster formation via CQL:                 #
#                                                                            #
#   cqlsh -u ferrosa_admin -p ferrosa_admin <node-ip>                       #
#   ALTER ROLE ferrosa_admin WITH PASSWORD='<strong-password>';              #
#                                                                            #
# For a production-secure deployment, see docker-compose.secure.yml         #
# (side-by-side overlay) which starts from FERROSA_AUTH_ENABLED=true and    #
# documents the post-formation credential rotation procedure.                #
#                                                                            #
# NEVER expose these containers to public networks without rotating the      #
# default ferrosa_admin password.                                            #
##############################################################################

services:
  # Volume permissions — RustFS runs as UID 10001
  volume-permissions:
    image: alpine
    volumes:
      - rustfs-data:/data
    command: >
      sh -c "chown -R 10001:10001 /data && echo 'permissions fixed'"
    restart: "no"

  rustfs:
    image: rustfs/rustfs:latest
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin  # pragma: allowlist secret
      # Newer rustfs images reject default creds on non-loopback listeners;
      # this sample is local-dev only (see FERROSA_AUTH_DISABLED above).
      RUSTFS_ALLOW_INSECURE_DEFAULT_CREDENTIALS: "true"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rustfs-init:
    image: minio/mc
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://rustfs:9000 rustfsadmin rustfsadmin &&
             mc mb local/ferrosa-data --ignore-existing &&
             echo 'bucket created'"
    restart: "no"

  node1:
    image: ${FERROSA_SMOKE_IMAGE:-ferrosa-smoke:latest}
    build:
      context: ./tests
      dockerfile: Dockerfile.smoke
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "9042:9042"
      - "9090:9090"
    environment:
      FERROSA_DATA_DIR: /var/lib/ferrosa
      FERROSA_AUTH_DISABLED: "true"
      FERROSA_INTERNODE_BIND: "0.0.0.0:7000"
      FERROSA_INTERNODE_BROADCAST: "node1:7000"
      FERROSA_SEED: "node2:7000,node3:7000"
      FERROSA_CLUSTER_NAME: ferrosa-dev
      FERROSA_S3_ENDPOINT: "http://rustfs:9000"
      FERROSA_S3_BUCKET: ferrosa-data
      FERROSA_S3_ALLOW_HTTP: "true"
      FERROSA_S3_ACCESS_KEY_ID: rustfsadmin
      FERROSA_S3_SECRET_ACCESS_KEY: rustfsadmin  # pragma: allowlist secret
    volumes:
      - node1-data:/var/lib/ferrosa
    # Use /readyz (leader-aware readiness probe) instead of a bare TCP
    # check so that the container is only marked healthy once Raft has
    # elected a leader and the node is ready to serve CQL traffic.
    # Note: after a full-cluster restart, Raft leader election can take
    # up to several minutes — see docs/database/clustering.html for
    # the expected cold-start timeline.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9090/readyz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  node2:
    image: ferrosa-smoke:latest
    build:
      context: ./tests
      dockerfile: Dockerfile.smoke
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "9043:9042"
      - "9091:9090"
    environment:
      FERROSA_DATA_DIR: /var/lib/ferrosa
      FERROSA_AUTH_DISABLED: "true"
      FERROSA_INTERNODE_BIND: "0.0.0.0:7000"
      FERROSA_INTERNODE_BROADCAST: "node2:7000"
      FERROSA_SEED: "node1:7000,node3:7000"
      FERROSA_CLUSTER_NAME: ferrosa-dev
      FERROSA_S3_ENDPOINT: "http://rustfs:9000"
      FERROSA_S3_BUCKET: ferrosa-data
      FERROSA_S3_ALLOW_HTTP: "true"
      FERROSA_S3_ACCESS_KEY_ID: rustfsadmin
      FERROSA_S3_SECRET_ACCESS_KEY: rustfsadmin  # pragma: allowlist secret
    volumes:
      - node2-data:/var/lib/ferrosa
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9090/readyz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  node3:
    image: ferrosa-smoke:latest
    build:
      context: ./tests
      dockerfile: Dockerfile.smoke
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "9044:9042"
      - "9092:9090"
    environment:
      FERROSA_DATA_DIR: /var/lib/ferrosa
      FERROSA_AUTH_DISABLED: "true"
      FERROSA_INTERNODE_BIND: "0.0.0.0:7000"
      FERROSA_INTERNODE_BROADCAST: "node3:7000"
      FERROSA_SEED: "node1:7000,node2:7000"
      FERROSA_CLUSTER_NAME: ferrosa-dev
      FERROSA_S3_ENDPOINT: "http://rustfs:9000"
      FERROSA_S3_BUCKET: ferrosa-data
      FERROSA_S3_ALLOW_HTTP: "true"
      FERROSA_S3_ACCESS_KEY_ID: rustfsadmin
      FERROSA_S3_SECRET_ACCESS_KEY: rustfsadmin  # pragma: allowlist secret
    volumes:
      - node3-data:/var/lib/ferrosa
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9090/readyz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  rustfs-data:
  node1-data:
  node2-data:
  node3-data:
