services:
  rustfs:
    image: rustfs/rustfs:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ROOT_USER: rustfsadmin
      RUSTFS_ROOT_PASSWORD: rustfsadmin  # pragma: allowlist secret
    volumes:
      - rustfs-data:/data

  rustfs-init:
    image: rustfs/rustfs:latest
    depends_on:
      - rustfs
    entrypoint: >
      sh -c "sleep 3 &&
             rustfs-cli alias set local http://rustfs:9000 rustfsadmin rustfsadmin &&
             rustfs-cli mb local/ferrosa-data --ignore-existing"

  node1:
    build: .
    depends_on:
      - rustfs-init
    ports:
      - "9042:9042"
      - "9090:9090"
    environment:
      FERROSA_DATA_DIR: /var/lib/ferrosa
      FERROSA_AUTH_DISABLED: "true"
      FERROSA_INTERNODE_BIND: "0.0.0.0:7000"
      FERROSA_INTERNODE_BROADCAST: "node1:7000"
      FERROSA_SEED: "node2:7000"
      FERROSA_CLUSTER_NAME: ferrosa-dev
      FERROSA_S3_ENDPOINT: "http://rustfs:9000"
      FERROSA_S3_BUCKET: ferrosa-data
      FERROSA_S3_ALLOW_HTTP: "true"
      FERROSA_S3_ACCESS_KEY_ID: rustfsadmin
      FERROSA_S3_SECRET_ACCESS_KEY: rustfsadmin  # pragma: allowlist secret
    volumes:
      - node1-data:/var/lib/ferrosa

  node2:
    build: .
    depends_on:
      - rustfs-init
    ports:
      - "9043:9042"
    environment:
      FERROSA_DATA_DIR: /var/lib/ferrosa
      FERROSA_AUTH_DISABLED: "true"
      FERROSA_INTERNODE_BIND: "0.0.0.0:7000"
      FERROSA_INTERNODE_BROADCAST: "node2:7000"
      FERROSA_SEED: "node1:7000"
      FERROSA_CLUSTER_NAME: ferrosa-dev
      FERROSA_S3_ENDPOINT: "http://rustfs:9000"
      FERROSA_S3_BUCKET: ferrosa-data
      FERROSA_S3_ALLOW_HTTP: "true"
      FERROSA_S3_ACCESS_KEY_ID: rustfsadmin
      FERROSA_S3_SECRET_ACCESS_KEY: rustfsadmin  # pragma: allowlist secret
    volumes:
      - node2-data:/var/lib/ferrosa

volumes:
  rustfs-data:
  node1-data:
  node2-data:
