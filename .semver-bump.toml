# scripts/semver-bump configuration: every change to main carries the semver bump
# its Conventional Commits call for. See the "Versioning" section of CONTRIBUTING.md.

# Tags created on main by .github/workflows/semver.yml: semver-v<version>.
# NOT "v": release.yml builds and publishes on any pushed `v*` tag, and
# .github/scripts/release-version-from-main.sh takes the newest `vX.Y.Z` tag as the
# stable base. A `semver-v` tag matches neither, so it can never cut a release or
# move the stable version math.
tag_prefix = "semver-v"

# Every crate inherits `version.workspace = true`, so Cargo.lock records the
# version of each member; refresh it so `--locked` builds pass after a bump.
post_apply = [["cargo", "update", "--workspace", "--offline"]]
also_commit = ["Cargo.lock"]

[[file]]
path = "Cargo.toml"
kind = "cargo-workspace"
