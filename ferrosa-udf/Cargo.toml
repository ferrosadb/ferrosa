[package]
name = "ferrosa-udf"
version = "0.1.0"
edition = "2021"
description = "WASM-sandboxed User-Defined Function execution for Ferrosa"

[dependencies]
ferrosa-common = { path = "../ferrosa-common" }
wasmtime = { version = "29", features = ["component-model"] }
moka = { version = "0.12", features = ["sync"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
