[package]
name = "ferrosa-udf"
version.workspace = true
edition = "2021"
description = "WASM-sandboxed User-Defined Function execution for Ferrosa"

[dependencies]
ferrosa-common = { path = "../ferrosa-common" }
wasmtime = { version = "44", features = ["component-model"] }
slotmap = "1"
num-bigint = "0.4"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
bumpalo = { version = "3", features = ["collections"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
wat = "1.248"
