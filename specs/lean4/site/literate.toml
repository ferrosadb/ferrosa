# Page order and presentation for the literate site. No prose lives here: every sentence on the site
# comes from the corpus sources, as it does for the PDF.
#
# The order follows the PDF's parts (`Ferrosa/Docs/Book.lean`): the query surface a user meets
# first, then consistency and topology, what leaves the cluster, the write path and storage
# internals, foundations, evidence, and last the accounting of what is not yet proved.

hide_commands = ["import", "open", "set_option", "namespace", "end", "section", "variable"]
docstrings_as_text = true
extra_css = ["ferrosa.css"]
extra_js = ["a11y.js", "review.js"]
landing_page = "FerrosaProduct"
order = ["FerrosaProduct", "Ferrosa"]

# The book generator is tooling, not specification.
exclude = ["Ferrosa.Docs"]

[[targets]]
library = "FerrosaProduct"

[[targets]]
library = "Ferrosa"

# The product pages import the whole corpus; the list says nothing to a reader.
