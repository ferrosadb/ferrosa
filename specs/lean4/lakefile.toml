name = "ferrosaSpecs"
version = "0.1.0"
defaultTargets = ["Ferrosa"]

[[lean_lib]]
name = "Ferrosa"
globs = ["Ferrosa", "Ferrosa.*"]

[[lean_exe]]
name = "harness"
root = "Ferrosa.Harness"
supportInterpreter = true

# The site's data. Reads statements from the elaborator and prose from the sources, so the document
# cannot state a theorem the compiler does not hold. See `site/postprocess.py` and
# `site/gen_register.py`.
[[lean_exe]]
name = "export"
root = "Ferrosa.Export"
