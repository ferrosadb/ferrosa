(*
  Apalache config for `raft.tla`.

  N = 3 voters, max term 5, max log 10.  These bounds keep the
  state space < 10^7 states for ElectionSafety + LogMatching, which
  Apalache can finish in < 30 minutes on a developer laptop.

  Apalache is NOT installed in the agent environment that produced
  this file.  An operator with the Apalache binary should run:

      apalache-mc check --config=raft.cfg \
                        --inv=ElectionSafety \
                        --length=20 \
                        raft.tla

  See `specs/in-process/sprint-05-progress.md` W5.7 for the manual
  replay log once Apalache is available.
*)
CONSTANTS
    Server = {s1, s2, s3}
    Value  = {v1, v2}
    MaxTerm = 5
    MaxLogLen = 10

INIT  Init
NEXT  Next

INVARIANTS
    ElectionSafety
    LeaderAppendOnly
    LogMatching
    LeaderCompleteness
    StateMachineSafety
    JointConsensusSafety
