path = "ferrosa-cluster/src/write_path.rs"
rule = "returns-vec-partition-or-row"
symbol = "range_read_limited_rows"
reason = "t_15417b35: SELECT-arm streaming fix removes this materializing range_read_limited_rows."
owner = "storage"
expires = "2026-09-30"

