# P0 OOM Guard — static-audit allowlist
#
# See specs/p0-oom-guard/blueprint.md (§2 D3, §3 Layer 1).
#
# Each `[[allow]]` suppresses findings whose file path CONTAINS `path`, whose
# rule equals `rule`, and (optionally) whose fn/method symbol CONTAINS `symbol`.
# Every entry MUST carry `reason`, `owner`, and an `expires` (YYYY-MM-DD). An
# entry whose `expires` is in the past is itself reported as a finding
# (`expired-allow-entry`) so exemptions cannot silently rubber-stamp forever.
#
# Policy: the audit runs in WARN mode by default (prints everything, exits 0).
# `--enforce` exits non-zero on any un-suppressed finding. The entries below are
# the documented baseline so `--enforce` passes on the current tree while the
# underlying streaming fixes land. They fall into two groups:
#
#  1. The P0 SELECT-arm sites the streaming fix (forge t_15417b35) will remove.
#     Short expiry (2026-09-30) — these must be re-audited when t_15417b35 lands.
#  2. Pre-existing materialization across the read/storage stack predating the
#     guard. Tracked under the materialization epic (forge t_110dd8a5); longer
#     expiry while each path is migrated to streaming.

# ---------------------------------------------------------------------------
# Group 1 — P0 SELECT-arm materialization removed by t_15417b35 (expiry 2026-09-30)
# ---------------------------------------------------------------------------

