# What this package extracts, and why everything else is out of it.
#
# The extraction exists so that claims about ferrosa are claims about ferrosa's code. That purpose
# decides the scope, and it is narrower than "the workspace":
#
#   * every ferrosa crate is in scope -- it is the subject;
#   * a few dependencies are in scope by name, because their behaviour is part of what we reason
#     about (a wire format, an identity, a compression frame);
#   * every other dependency is out of scope, once, in [blanket];
#   * an individual item may be left out inside an included crate, and that is an assumption, not
#     a convenience: it is listed under [[item]] with the reason it is safe to leave unproved.
#
# The rules are checked by `scope-check.py` (run it: `python3 specs/lean4-rust/scope-check.py
# check`), which fails on four things -- an item opaque in the Lean that no entry explains, an
# entry that no longer matches anything, a workspace crate with no decision, an entry with no
# reason/owner/date. `extract.sh` reads this file, so there is no second place where a flag could
# be passed by hand: an exclusion that is not written here does not happen, and an exclusion that
# happens is visible in the emitted Lean as `def ... := sorry`.
#
# Every entry needs `reason`, `owner` and `date`. The date is when the decision was taken, not
# when the file was edited: an entry that has survived three regenerations unchanged is still the
# same decision and keeps its date.

schema = 1

