# --------------------------------------------------------------------------------------------------
# Critical dependencies. A dependency is `critical` when a rule inside it is a rule ferrosa relies
# on, so "out of scope" would be an assumption dressed as a boundary. Keep this list short: every
# entry is a promise to reason about somebody else's code.
# --------------------------------------------------------------------------------------------------

[[crate]]
name = "serde"
kind = "critical"
reason = "the serialized form of schema, view metadata and index definitions is a wire and on-disk contract; what serde accepts and rejects is part of that contract"
owner = "bkearns"
date = "2026-11-04"

[[crate]]
name = "serde_json"
kind = "critical"
reason = "the JSONB representation and the conformance corpus are JSON documents; number and duplicate-key handling decide equality"
owner = "bkearns"
date = "2026-11-04"

[[crate]]
name = "uuid"
kind = "critical"
reason = "table and view identities are UUIDs whose parsing and variant rules appear in stored keys"
owner = "bkearns"
date = "2026-11-04"

[[crate]]
name = "lz4_flex"
kind = "critical"
reason = "an SSTable compression frame is only readable by an implementation whose block format the reader agrees with"
owner = "bkearns"
date = "2026-11-04"

# --------------------------------------------------------------------------------------------------
# The blanket exclusion: everything else. One entry, because a second category-level exclusion is
# how a scope file stops meaning anything. Naming a dependency we have looked at and decided
# against is different from this: that is an explicit [[crate]] entry and it is welcome.
# --------------------------------------------------------------------------------------------------

[blanket]
reason = "every other dependency is out of scope: the extraction reasons about ferrosa and the four crates above, not about its dependency tree. Charon still needs a dependency's types to compile a crate, but nothing in it is extracted, so a dependency cannot be silently half-in-scope"
owner = "bkearns"
date = "2026-11-04"

# --------------------------------------------------------------------------------------------------
# Item exclusions inside included crates. Each one is a place where the Lean says `sorry` instead of
# a body, so a reader of the generated module sees it -- or, where the translator cannot carry the
# declaration, a row in `scope.lock` says so and `scope-check.py` refuses a row this file does not
# explain. `kind` must be `opaque`: an entry that asked for `--exclude` would delete the declaration
# instead, and silence is what this file prevents.
#
# There is no entry here yet, and that is a fact about the translator rather than a decision. The
# first one belongs to `ferrosa-view`, whose derived `Deserialize` visitors cannot be translated:
# `visit_map` for `ViewMetadata` reaches 8,192 exits and the run dies at the memory ceiling, and the
# other four derives fail their `visit_bytes`/`visit_enum` bodies. Excluding all five by
# `{impl serde_core::de::Deserialize<…>}` lets the crate translate in 28 s at 2.3 GiB peak instead
# of never, but the module still does not elaborate: aeneas reports `[Error] Unimplemented: found an
# occurrence of a lifetime constraint` on `ViewMetadata::primary_key` and `validate::base_pk_names`,
# both of which return `impl Iterator<Item = &'_ str>`. That is a translator gap, not a scope
# question, so the entries go in when the module does -- an entry here that no module can satisfy is
# the rot this file exists to prevent. See SYNC.md, "What the scope buys, measured".
# --------------------------------------------------------------------------------------------------
