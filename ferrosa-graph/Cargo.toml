[package]
name = "ferrosa-graph"
version.workspace = true
edition = "2021"
description = "Graph query engine for ferrosa — Cypher/GQL endpoint"

[dependencies]
ferrosa-common = { path = "../ferrosa-common" }
ferrosa-schema = { path = "../ferrosa-schema" }
ferrosa-sstable = { path = "../ferrosa-sstable" }
ferrosa-cluster = { path = "../ferrosa-cluster" }
ferrosa-storage = { path = "../ferrosa-storage" }
arc-swap = "1.7"
async-stream = "0.3"
hex = "0.4"
indexmap = { version = "2", features = ["serde"] }
phf = { version = "0.13", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
# `-no-provider`: every TLS config is built by ferrosa-net::tls with the one
# crypto provider the process uses; `RustlsConfig::from_config` never picks a
# provider on its own.
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
ferrosa-net = { path = "../ferrosa-net" }
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "io-util"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["catch-panic", "limit"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
blake3 = "1"
async-trait = "0.1"

[dev-dependencies]
bincode = "1"
base64 = "0.22"
bytes = "1"
proptest = "1"
rcgen = "0.14"
serde_json = "1"
tempfile = "3"
# Paused virtual time (`start_paused`) makes timer tests deterministic: time moves
# only when the test advances it, so CPU starvation cannot reorder two timers.
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
