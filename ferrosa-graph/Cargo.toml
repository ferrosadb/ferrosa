[package]
name = "ferrosa-graph"
version.workspace = true
publish.workspace = true
edition = "2021"
license.workspace = true
description = "Graph query engine for ferrosa — Cypher/GQL endpoint"

[dependencies]
ferrosa-common = { path = "../ferrosa-common" }
ferrosa-schema = { path = "../ferrosa-schema" }
ferrosa-sstable = { path = "../ferrosa-sstable" }
ferrosa-cluster = { path = "../ferrosa-cluster" }
ferrosa-storage = { path = "../ferrosa-storage" }
ferrosa-index = { path = "../ferrosa-index" }
arc-swap = "1.7"
async-stream = "0.3"
hex = "0.4"
indexmap = { version = "2", features = ["serde"] }
phf = { version = "0.13", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
# `-no-provider`: every TLS config is built by ferrosa-net::tls with the one
# crypto provider the process uses; `RustlsConfig::from_config` never picks a
# provider on its own.
# axum-server 0.9, and `tls-rustls-ring` not `tls-rustls-no-provider`.
#
# In 0.8, tls-rustls-no-provider declared `rustls` WITHOUT default-features =
# false, so rustls' defaults (which include aws_lc_rs) applied — the feature did
# not do what its name says, and every binary linked two C crypto libraries
# beside ferrosa's ring. 0.9 declares rustls with default-features = false and
# makes the provider an explicit choice.
axum-server = { version = "0.9", features = ["tls-rustls-ring"] }
ferrosa-net = { path = "../ferrosa-net" }
# default-features = false is the load-bearing part. rustls' defaults are
# ["aws_lc_rs", "logging", "std", "tls12"], so `features = ["ring"]` alone ADDS
# ring without removing the aws-lc-rs C library — and both end up linked.
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
base64 = "0.22"
futures = "0.3"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "io-util"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["catch-panic", "limit"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
blake3 = "1"
async-trait = "0.1"

[features]
# Slow tests live in `mod slow` behind this feature: PR CI skips `::slow::`,
# nightly-slow-tests.yml runs them (never `#[ignore]`).
slow-tests = []

[dev-dependencies]
# The counting `GlobalAlloc` this crate's unit tests install. Dev-only: its `unsafe impl` cannot
# live here, because this crate forbids `unsafe_code`.
ferrosa-alloc-count = { path = "../tools/alloc-count" }
bincode = "1"
base64 = "0.22"
bytes = "1"
proptest = "1"
rcgen = "0.14"
serde_json = "1"
tempfile = "3"
# Paused virtual time (`start_paused`) makes timer tests deterministic: time moves
# only when the test advances it, so CPU starvation cannot reorder two timers.
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
