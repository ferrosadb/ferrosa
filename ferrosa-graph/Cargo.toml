[package]
name = "ferrosa-graph"
version = "0.1.0"
edition = "2021"
description = "Graph query engine for ferrosa — Cypher/GQL endpoint"

[dependencies]
ferrosa-common = { path = "../ferrosa-common" }
ferrosa-schema = { path = "../ferrosa-schema" }
ferrosa-sstable = { path = "../ferrosa-sstable" }
ferrosa-storage = { path = "../ferrosa-storage" }
arc-swap = "1.7"
indexmap = { version = "2", features = ["serde"] }
phf = { version = "0.11", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
