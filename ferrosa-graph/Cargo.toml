[package]
name = "ferrosa-graph"
version.workspace = true
edition = "2021"
description = "Graph query engine for ferrosa — Cypher/GQL endpoint"

[dependencies]
ferrosa-common = { path = "../ferrosa-common" }
ferrosa-schema = { path = "../ferrosa-schema" }
ferrosa-sstable = { path = "../ferrosa-sstable" }
ferrosa-cluster = { path = "../ferrosa-cluster" }
ferrosa-storage = { path = "../ferrosa-storage" }
arc-swap = "1.7"
hex = "0.4"
indexmap = { version = "2", features = ["serde"] }
phf = { version = "0.13", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "io-util"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["catch-panic", "limit"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
blake3 = "1"

[dev-dependencies]
async-trait = "0.1"
bincode = "1"
base64 = "0.22"
bytes = "1"
ferrosa-net = { path = "../ferrosa-net" }
proptest = "1"
serde_json = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
