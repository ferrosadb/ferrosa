(*
  Apalache config for `multi-dc.tla` (Sprint 7 W7.9).

  N = 2 DCs × 3 voters per DC, max term 5, max log 15, max HLC 10,
  max 6 Accord txns.  These bounds match the W7.9 spec.

  Apalache is NOT installed in the agent environment that produced
  this file (Sprint 5 documented this; Sprint 7 inherits the gap).
  An operator with the Apalache binary should run:

      apalache-mc check --config=multi-dc.cfg \
                        --inv=MultiDcSafety \
                        --length=15 \
                        multi-dc.tla

  Then individually for each invariant:

      apalache-mc check --config=multi-dc.cfg \
                        --inv=AccordIdempotence \
                        multi-dc.tla
      apalache-mc check --config=multi-dc.cfg \
                        --inv=SwapDcDrainsAccord \
                        multi-dc.tla
      apalache-mc check --config=multi-dc.cfg \
                        --inv=NoMixedCommitAbort \
                        multi-dc.tla
      apalache-mc check --config=multi-dc.cfg \
                        --inv=WatermarkBounded \
                        multi-dc.tla

  See `specs/in-process/sprint-07-progress.md` W7.9 for the manual
  replay log once Apalache is available.
*)
CONSTANTS
    DCs           = {dc1, dc2}
    ServersPerDC  = {s1, s2, s3}
    AccordTxnIds  = {t1, t2, t3, t4, t5, t6}
    MaxTerm       = 5
    MaxLogLen     = 15
    MaxHlc        = 10

INIT Init
NEXT Next

INVARIANTS
    WatermarkBounded
    NoMixedCommitAbort
    AccordIdempotence
    SwapDcDrainsAccord
    MultiDcSafety
