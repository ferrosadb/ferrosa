# Unsafe allowlist — the enumeration docs/unsafe-policy.md enforces.
#
# The rule: no `unsafe` except where the platform or the language gives no safe alternative, and never
# for performance.
#
#   [[allow]]  a permitted site. `kind` must be one of
#              ffi | syscall | ioctl | mmap | allocator | layout | sync-primitive.
#              The site must also carry a `// SAFETY:` comment naming its mechanism.
#   [[debt]]   a recorded finding — `kind` is `perf` or `unknown`. These are NOT permitted; each one
#              names the safe alternative that removes it. Adding a debt entry is a reviewed change.
#
# Every entry needs `file`, `item`, `kind`, `reason`, `owner`, `since`; a `[[debt]]` entry also needs
# `fix`, the safe alternative to apply.
#
# `item` is the enclosing fn/impl name, never a line number, so entries survive code moving. When a
# site is converted, delete its entry in the SAME commit — the gate fails on an entry whose site is
# gone, because a stale allowlist is how this kind of gate rots.
#
# Counted 2026-11-04 at de3eeb2c: 59 production sites in 16 files, 35 permitted and 24 findings.

