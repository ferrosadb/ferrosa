[package]
name = "ferrosa-sstable"
description = "Cassandra-compatible BTI SSTable reader/writer for Ferrosa"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
crc32fast = "1"
ferrosa-common = { path = "../ferrosa-common" }
libc = "0.2"
lru = "0.12"
lz4_flex = "0.11"
memmap2 = "0.9"
rayon = "1"
tracing = "0.1"
zstd = "0.13"

[features]
# Live infrastructure tests are intentionally absent from the default test
# target. Opt in with `--features live-infra-tests` on a Linux host so a
# missing environment prerequisite (e.g. STATX_DIOALIGN support) cannot be
# reported as a passing test body.
live-infra-tests = []
# Compiles `pump::test_support` (RecordingSink, FaultySink, GateSink — T-032)
# outside `cfg(test)`, so it is part of the crate's compiled dev-support
# surface rather than only its unit-test binary. Always available to this
# crate's own tests regardless of this feature. The types are `pub(crate)`
# today (no cross-crate entry point exists yet — `AlignedPump`/`SegmentSink`
# are crate-internal); this feature is plumbing for T-033/T-038, which add
# both a `pub` seam and the visibility bump sibling crates (e.g.
# `ferrosa-storage`) need to actually inject faults through their
# dev-dependency on this crate.
test-support = []

[dev-dependencies]
# Enables `ferrosa_common::test_generators` (shared CellValue/DecoratedKey
# proptest strategies) for the T-035 writer oracle's Partition/Row
# generators (ferrosa-sstable/tests/support/generators.rs).
ferrosa-common = { path = "../ferrosa-common", features = ["test-generators"] }
proptest = "1"
sha2 = "0.10"
tempfile = "3"
