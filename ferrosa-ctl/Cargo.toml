[package]
name = "ferrosa-ctl"
description = "CLI administration and observability tool for Ferrosa"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ferrosa-ctl"
path = "src/main.rs"

[dependencies]
ferrosa-cql = { path = "../ferrosa-cql" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tabled = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"
rpassword = "7"
async-trait = "0.1"

[dev-dependencies]
arc-swap = "1.7"
ferrosa-cluster = { path = "../ferrosa-cluster" }
ferrosa-schema = { path = "../ferrosa-schema" }
ferrosa-storage = { path = "../ferrosa-storage" }
ferrosa-udf = { path = "../ferrosa-udf" }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
uuid = { version = "1", features = ["v4"] }
