[package]
name = "ferrosa-ctl"
description = "CLI administration and observability tool for Ferrosa"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ferrosa-ctl"
path = "src/main.rs"

[dependencies]
ferrosa-cql = { path = "../ferrosa-cql" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tabled = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ratatui = "0.29"
crossterm = "0.28"
# Argon2id password hashing for `auth set-password`.
# Output is wire-compatible with `ferrosa-schema::auth::password::PasswordHasher::verify_password_any`,
# which auto-detects the `$argon2id$` PHC prefix.
argon2 = "0.6.0-rc.8"
password-hash = { version = "0.6", features = ["rand_core", "getrandom"] }
rpassword = "7"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "2"

[dev-dependencies]
arc-swap = "1.7"
ferrosa-cluster = { path = "../ferrosa-cluster" }
ferrosa-schema = { path = "../ferrosa-schema" }
ferrosa-storage = { path = "../ferrosa-storage" }
ferrosa-udf = { path = "../ferrosa-udf" }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
uuid = { version = "1", features = ["v4"] }
