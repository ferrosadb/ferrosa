[package]
name = "ferrosa-jepsen"
version.workspace = true
publish.workspace = true
edition = "2021"
license.workspace = true

[lib]
name = "ferrosa_jepsen"
path = "src/lib.rs"

[features]
default = []
# Live infrastructure tests are intentionally absent from the default test
# target. Opt in with `--features live-infra-tests` plus the documented
# FERROSA_TEST_* environment prerequisites so missing infra cannot be reported
# as a passing test body.
live-infra-tests = []
# Native-driver PostgreSQL transaction history workload. Requires a live
# cluster and is deliberately separate from the default CQL Jepsen suites.
postgres-jepsen = ["live-infra-tests"]

[[bin]]
name = "ferrosa-jepsen"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# W8.9 — sim-equivalent endurance path (ADR-016).
ferrosa-sim = { path = "../ferrosa-sim" }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
russh = "0.62.7"
rand = "0.10"
dirs-next = "2"
scylla = "1.5.0"

[dev-dependencies]
# serde_yaml is unmaintained (RUSTSEC-2024-0449, via unsafe-libyaml);
# yaml-rust2 is pure Rust and maintained.
yaml-rust2 = "0.13"
tempfile = "3"
tokio-postgres = "0.7"
