[package]
name = "ferrosa-jepsen"
version.workspace = true
edition = "2021"

[lib]
name = "ferrosa_jepsen"
path = "src/lib.rs"

[[bin]]
name = "ferrosa-jepsen"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
russh = "0.60.2"
# russh 0.60.1 still depends on pre-release crypto crates (pkcs8 0.11.0-rc.11) that
# call pbes2::Parameters::recommended, renamed to generate_recommended in stable
# pkcs5 0.8.0. Cargo resolves `^0.8.0-rc.13` to 0.8.0, breaking the build.
# Pin pkcs5 to rc.13 until russh ships against stable crypto deps.
pkcs5 = "=0.8.0-rc.13"
rand = "0.10"
dirs-next = "2"
scylla = "1.5.0"

[dev-dependencies]
serde_yaml = "0.9"
tempfile = "3"
