# Jepsen 3-node Ferrosa cluster for orchestrator provisioning tests.
#
# Starts a 3-node Ferrosa cluster backed by RustFS (S3-compatible).
# Node CQL ports are mapped to localhost 49042/49043/49044 (4xxxx range
# reserved for jepsen integration tests; avoids colliding with any
# existing 9042 cluster or with ferrosa-memory's 19042 layout).
#
# Usage:
#   docker compose -f ferrosa-jepsen/tests/docker/jepsen-cluster.yml up -d --build
#   docker compose -f ferrosa-jepsen/tests/docker/jepsen-cluster.yml down -v
#
# The ferrosa image is built from the repo root Dockerfile.
# RustFS credentials: rustfsadmin / rustfsadmin (test-only).

services:

  # ---------------------------------------------------------------------------
  # Volume permissions — RustFS runs as UID 10001
  # ---------------------------------------------------------------------------
  volume-permissions:
    image: alpine
    volumes:
      - jepsen-rustfs-data:/data
    command: >
      sh -c "chown -R 10001:10001 /data && echo 'permissions fixed'"
    restart: "no"

  # ---------------------------------------------------------------------------
  # S3-compatible object store
  # ---------------------------------------------------------------------------
  rustfs:
    image: downloads.ferrosa.ai/rustfs@sha256:58c589bedfab28d001fc6176735872ac84323dddc6c5313cc95260600ed1ae8d
    container_name: ferrosa-jepsen-rustfs
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
    ports:
      - "49000:9000"
      - "49001:9001"
    environment:
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin  # pragma: allowlist secret
      RUSTFS_ALLOW_INSECURE_DEFAULT_CREDENTIALS: "true"
    volumes:
      - jepsen-rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Bucket bootstrap — creates ferrosa-jepsen bucket
  # ---------------------------------------------------------------------------
  rustfs-init:
    image: downloads.ferrosa.ai/aws-cli@sha256:e38214027df83cb6631adcf980a092a98d1d29788789bff2a0f424e87e3da8ed
    container_name: ferrosa-jepsen-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin  # pragma: allowlist secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      sh -c "aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket ferrosa-jepsen ||
             aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket ferrosa-jepsen &&
             echo 'bucket ferrosa-jepsen ready'"
    restart: "no"

  # ---------------------------------------------------------------------------
  # Node 1 — symmetric seed config (Sprint 2 W2.14): every node seeds every
  # other node so cluster bring-up does not depend on a single bootstrap host.
  # ---------------------------------------------------------------------------
  node1:
    image: ${FERROSA_NIGHTLY_IMAGE:-ferrosa-nightly:latest}
    build:
      context: ../../..
      dockerfile: Dockerfile
    container_name: ferrosa-jepsen-node1
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "49042:9042"   # CQL
      - "49090:9090"   # Admin / observability
    environment:
      FERROSA_HOST_ID: "11111111-1111-1111-1111-111111111111"
      FERROSA_INTERNODE_BIND: "0.0.0.0:7000"
      FERROSA_INTERNODE_BROADCAST: "node1:7000"
      FERROSA_SEED: "node2:7000,node3:7000"
      FERROSA_CQL_BIND: "0.0.0.0:9042"
      FERROSA_WEB_BIND: "0.0.0.0:9090"
      FERROSA_CLUSTER_NAME: "ferrosa-jepsen"
      FERROSA_DATA_DIR: "/var/lib/ferrosa"
      FERROSA_AUTH_DISABLED: "true"
      FERROSA_S3_ENDPOINT: "http://rustfs:9000"
      FERROSA_S3_BUCKET: "ferrosa-jepsen"
      FERROSA_S3_ALLOW_HTTP: "true"
      FERROSA_S3_ACCESS_KEY_ID: "rustfsadmin"
      FERROSA_S3_SECRET_ACCESS_KEY: "rustfsadmin"  # pragma: allowlist secret
    volumes:
      - jepsen-node1-data:/var/lib/ferrosa
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9090/health || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Node 2
  # ---------------------------------------------------------------------------
  node2:
    build:
      context: ../../..
      dockerfile: Dockerfile
    container_name: ferrosa-jepsen-node2
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "49043:9042"   # CQL
      - "49091:9090"   # Admin / observability
    environment:
      FERROSA_HOST_ID: "22222222-2222-2222-2222-222222222222"
      FERROSA_INTERNODE_BIND: "0.0.0.0:7000"
      FERROSA_INTERNODE_BROADCAST: "node2:7000"
      FERROSA_SEED: "node1:7000,node3:7000"
      FERROSA_CQL_BIND: "0.0.0.0:9042"
      FERROSA_WEB_BIND: "0.0.0.0:9090"
      FERROSA_CLUSTER_NAME: "ferrosa-jepsen"
      FERROSA_DATA_DIR: "/var/lib/ferrosa"
      FERROSA_AUTH_DISABLED: "true"
      FERROSA_S3_ENDPOINT: "http://rustfs:9000"
      FERROSA_S3_BUCKET: "ferrosa-jepsen"
      FERROSA_S3_ALLOW_HTTP: "true"
      FERROSA_S3_ACCESS_KEY_ID: "rustfsadmin"
      FERROSA_S3_SECRET_ACCESS_KEY: "rustfsadmin"  # pragma: allowlist secret
    volumes:
      - jepsen-node2-data:/var/lib/ferrosa
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9090/health || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Node 3
  # ---------------------------------------------------------------------------
  node3:
    build:
      context: ../../..
      dockerfile: Dockerfile
    container_name: ferrosa-jepsen-node3
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "49044:9042"   # CQL
      - "49092:9090"   # Admin / observability
    environment:
      FERROSA_HOST_ID: "33333333-3333-3333-3333-333333333333"
      FERROSA_INTERNODE_BIND: "0.0.0.0:7000"
      FERROSA_INTERNODE_BROADCAST: "node3:7000"
      FERROSA_SEED: "node1:7000,node2:7000"
      FERROSA_CQL_BIND: "0.0.0.0:9042"
      FERROSA_WEB_BIND: "0.0.0.0:9090"
      FERROSA_CLUSTER_NAME: "ferrosa-jepsen"
      FERROSA_DATA_DIR: "/var/lib/ferrosa"
      FERROSA_AUTH_DISABLED: "true"
      FERROSA_S3_ENDPOINT: "http://rustfs:9000"
      FERROSA_S3_BUCKET: "ferrosa-jepsen"
      FERROSA_S3_ALLOW_HTTP: "true"
      FERROSA_S3_ACCESS_KEY_ID: "rustfsadmin"
      FERROSA_S3_SECRET_ACCESS_KEY: "rustfsadmin"  # pragma: allowlist secret
    volumes:
      - jepsen-node3-data:/var/lib/ferrosa
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9090/health || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

volumes:
  jepsen-rustfs-data:
  jepsen-node1-data:
  jepsen-node2-data:
  jepsen-node3-data:
