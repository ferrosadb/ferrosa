# Jepsen 3-node Ferrosa cluster for orchestrator provisioning tests.
#
# Starts a 3-node Ferrosa cluster backed by RustFS (S3-compatible).
# Node CQL ports are mapped to localhost 19042/19043/19044 to avoid
# colliding with any existing cluster on 9042-9044.
#
# Usage:
#   docker compose -f ferrosa-jepsen/tests/docker/jepsen-cluster.yml up -d --build
#   docker compose -f ferrosa-jepsen/tests/docker/jepsen-cluster.yml down -v
#
# The ferrosa image is built from the repo root Dockerfile.
# RustFS credentials: rustfsadmin / rustfsadmin (test-only).

services:

  # ---------------------------------------------------------------------------
  # Volume permissions — RustFS runs as UID 10001
  # ---------------------------------------------------------------------------
  volume-permissions:
    image: alpine
    volumes:
      - jepsen-rustfs-data:/data
    command: >
      sh -c "chown -R 10001:10001 /data && echo 'permissions fixed'"
    restart: "no"

  # ---------------------------------------------------------------------------
  # S3-compatible object store
  # ---------------------------------------------------------------------------
  rustfs:
    image: rustfs/rustfs:latest
    container_name: ferrosa-jepsen-rustfs
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin  # pragma: allowlist secret
    volumes:
      - jepsen-rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Bucket bootstrap — creates ferrosa-jepsen bucket
  # ---------------------------------------------------------------------------
  rustfs-init:
    image: minio/mc
    container_name: ferrosa-jepsen-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://rustfs:9000 rustfsadmin rustfsadmin &&
             mc mb local/ferrosa-jepsen --ignore-existing &&
             echo 'bucket ferrosa-jepsen ready'"
    restart: "no"

  # ---------------------------------------------------------------------------
  # Node 1 — first seed; no FERROSA_SEED (it IS the seed)
  # ---------------------------------------------------------------------------
  node1:
    build:
      context: ../../..
      dockerfile: Dockerfile
    container_name: ferrosa-jepsen-node1
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "19042:9042"   # CQL
      - "19090:9090"   # Admin / observability
    environment:
      FERROSA_HOST_ID: "11111111-1111-1111-1111-111111111111"
      FERROSA_INTERNODE_BIND: "0.0.0.0:7000"
      FERROSA_INTERNODE_BROADCAST: "node1:7000"
      FERROSA_CQL_BIND: "0.0.0.0:9042"
      FERROSA_WEB_BIND: "0.0.0.0:9090"
      FERROSA_CLUSTER_NAME: "ferrosa-jepsen"
      FERROSA_DATA_DIR: "/var/lib/ferrosa"
      FERROSA_AUTH_DISABLED: "true"
      FERROSA_S3_ENDPOINT: "http://rustfs:9000"
      FERROSA_S3_BUCKET: "ferrosa-jepsen"
      FERROSA_S3_ALLOW_HTTP: "true"
      FERROSA_S3_ACCESS_KEY_ID: "rustfsadmin"
      FERROSA_S3_SECRET_ACCESS_KEY: "rustfsadmin"  # pragma: allowlist secret
    volumes:
      - jepsen-node1-data:/var/lib/ferrosa
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9090/health || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Node 2
  # ---------------------------------------------------------------------------
  node2:
    build:
      context: ../../..
      dockerfile: Dockerfile
    container_name: ferrosa-jepsen-node2
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "19043:9042"   # CQL
      - "19091:9090"   # Admin / observability
    environment:
      FERROSA_HOST_ID: "22222222-2222-2222-2222-222222222222"
      FERROSA_INTERNODE_BIND: "0.0.0.0:7000"
      FERROSA_INTERNODE_BROADCAST: "node2:7000"
      FERROSA_SEED: "node1:7000"
      FERROSA_CQL_BIND: "0.0.0.0:9042"
      FERROSA_WEB_BIND: "0.0.0.0:9090"
      FERROSA_CLUSTER_NAME: "ferrosa-jepsen"
      FERROSA_DATA_DIR: "/var/lib/ferrosa"
      FERROSA_AUTH_DISABLED: "true"
      FERROSA_S3_ENDPOINT: "http://rustfs:9000"
      FERROSA_S3_BUCKET: "ferrosa-jepsen"
      FERROSA_S3_ALLOW_HTTP: "true"
      FERROSA_S3_ACCESS_KEY_ID: "rustfsadmin"
      FERROSA_S3_SECRET_ACCESS_KEY: "rustfsadmin"  # pragma: allowlist secret
    volumes:
      - jepsen-node2-data:/var/lib/ferrosa
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9090/health || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Node 3
  # ---------------------------------------------------------------------------
  node3:
    build:
      context: ../../..
      dockerfile: Dockerfile
    container_name: ferrosa-jepsen-node3
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "19044:9042"   # CQL
      - "19092:9090"   # Admin / observability
    environment:
      FERROSA_HOST_ID: "33333333-3333-3333-3333-333333333333"
      FERROSA_INTERNODE_BIND: "0.0.0.0:7000"
      FERROSA_INTERNODE_BROADCAST: "node3:7000"
      FERROSA_SEED: "node1:7000"
      FERROSA_CQL_BIND: "0.0.0.0:9042"
      FERROSA_WEB_BIND: "0.0.0.0:9090"
      FERROSA_CLUSTER_NAME: "ferrosa-jepsen"
      FERROSA_DATA_DIR: "/var/lib/ferrosa"
      FERROSA_AUTH_DISABLED: "true"
      FERROSA_S3_ENDPOINT: "http://rustfs:9000"
      FERROSA_S3_BUCKET: "ferrosa-jepsen"
      FERROSA_S3_ALLOW_HTTP: "true"
      FERROSA_S3_ACCESS_KEY_ID: "rustfsadmin"
      FERROSA_S3_SECRET_ACCESS_KEY: "rustfsadmin"  # pragma: allowlist secret
    volumes:
      - jepsen-node3-data:/var/lib/ferrosa
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9090/health || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

volumes:
  jepsen-rustfs-data:
  jepsen-node1-data:
  jepsen-node2-data:
  jepsen-node3-data:
