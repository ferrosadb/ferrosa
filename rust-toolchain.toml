# Pin the exact toolchain so CI is deterministic and doesn't drift with the
# runner's "stable". 1.96.1 is a patch release over 1.96.0 (linker/codegen
# fixes, incl. the ld SIGBUS class seen in CI — t_9291a8dd) with no new lints,
# so pinning is safe mid-release. The dtolnay/rust-toolchain action reads this
# file when no explicit toolchain is passed.
[toolchain]
channel = "1.96.1"
components = ["rustfmt", "clippy"]
