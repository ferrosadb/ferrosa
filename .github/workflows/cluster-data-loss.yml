name: Cluster Data Loss Test

on:
  # Only run on main merges and manual dispatch — NOT on every PR push.
  # This workflow builds Docker images + runs a 3-node cluster test,
  # consuming ~15 min of CI per run. Running on every push to a PR
  # burned 1300+ minutes in one day.
  push:
    branches: [main]
    paths:
      - 'ferrosa-storage/**'
      - 'ferrosa-cluster/**'
      - 'ferrosa-cql/**'
      - 'ferrosa-sstable/**'
  workflow_dispatch:

jobs:
  cluster-data-loss:
    name: 3-Node Data Loss Regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      - name: Build Ferrosa image
        run: docker build -t ferrosa-test .

      - name: Start 3-node cluster
        run: |
          docker compose -f tests/docker-compose.cluster.yml --profile trio up -d
          echo "Waiting for cluster formation..."
          for i in $(seq 1 60); do
            if docker compose -f tests/docker-compose.cluster.yml exec -T node1 \
              bash -c 'echo > /dev/tcp/127.0.0.1/9042' 2>/dev/null; then
              echo "CQL port ready after ${i}s"
              break
            fi
            sleep 1
          done
          # Extra wait for cluster formation + Raft election
          sleep 15

      - name: Install Python test deps
        run: pip install cassandra-driver pytest

      - name: Run data loss reproduction test
        run: pytest tests/cluster/test_data_loss_reproduction.py -v -s

      - name: Collect logs on failure
        if: failure()
        run: |
          for node in node1 node2 node3; do
            echo "=== $node ==="
            docker compose -f tests/docker-compose.cluster.yml logs $node 2>&1 | tail -50
          done

      - name: Tear down
        if: always()
        run: docker compose -f tests/docker-compose.cluster.yml down -v --remove-orphans
