name: Cluster Data Loss Test

on:
  # Only run on main merges and manual dispatch — NOT on every PR push.
  # This workflow packages the nightly .deb into a runtime image and runs a
  # 3-node cluster test. Running it on every PR push burned 1300+ minutes in
  # one day.
  push:
    branches: [main]
    paths:
      - 'ferrosa-storage/**'
      - 'ferrosa-cluster/**'
      - 'ferrosa-cql/**'
      - 'ferrosa-sstable/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  cluster-data-loss:
    name: 3-Node Data Loss Regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Download nightly Ferrosa .deb
        id: nightly_deb
        uses: ./.github/actions/ferrosa-nightly-deb
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Ferrosa nightly runtime image
        run: |
          set -euo pipefail
          cp "${{ steps.nightly_deb.outputs.deb_path }}" tests/ferrosa.deb
          docker build -f tests/Dockerfile.nightly-deb -t ferrosa-nightly:latest tests/
          rm -f tests/ferrosa.deb

      - name: Start 3-node cluster
        env:
          FERROSA_NIGHTLY_IMAGE: ferrosa-nightly:latest
        run: |
          set -euo pipefail
          docker compose -f tests/docker-compose.cluster.yml --profile trio up -d --no-build
          echo "Waiting for cluster formation..."
          deadline=$((SECONDS + 120))
          ready=0
          while (( SECONDS < deadline )); do
            healthy=1
            for node in node1 node2 node3; do
              container_id="$(docker compose -f tests/docker-compose.cluster.yml ps -q "$node")"
              status="$(docker inspect --format='{{.State.Health.Status}}' "$container_id" 2>/dev/null || true)"
              if [[ "$status" != "healthy" ]]; then
                healthy=0
                break
              fi
            done
            if (( healthy )); then
              ready=1
              echo "All cluster nodes are healthy after $((120 - (deadline - SECONDS)))s"
              break
            fi
            sleep 2
          done
          if (( ! ready )); then
            echo "::error::Cluster did not become healthy within 120 seconds"
            docker compose -f tests/docker-compose.cluster.yml ps
            exit 1
          fi
          # Extra wait for cluster formation + Raft election
          sleep 15

      - name: Install Python test deps
        run: pip install cassandra-driver pytest

      - name: Run data loss reproduction test
        run: pytest tests/cluster/test_data_loss_reproduction.py -v -s

      - name: Collect logs on failure
        if: failure()
        run: |
          for node in node1 node2 node3; do
            echo "=== $node ==="
            docker compose -f tests/docker-compose.cluster.yml logs $node 2>&1 | tail -50
          done

      - name: Tear down
        if: always()
        run: docker compose -f tests/docker-compose.cluster.yml down -v --remove-orphans
