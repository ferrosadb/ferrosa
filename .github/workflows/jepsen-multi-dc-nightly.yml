name: Nightly Multi-DC Jepsen Tier

# Sprint 7 W7.11. Brings up the T3 (3+3 dual-DC) topology and runs
# the bank workload at QUORUM under `dc-partition + dc-slow` for
# 1 hour. Failure files a GitHub issue tagged sprint-7.
#
# 12-factor build/release/run separation: NOTHING is compiled in the job that
# runs Docker.
#   - the SERVER nodes run the nightly `.deb` (pre-built artifact);
#   - the `ferrosa-jepsen` DRIVER is compiled ONCE in the `build-driver` job and
#     passed to the run job as an artifact.
# The run job only downloads binaries and exercises them — no cargo, no
# `compose --build`. Compiling the workspace alongside 6 node containers on one
# hosted runner is what caused the chronic exit-143 (OOM) runner terminations.

on:
  schedule:
    - cron: '0 6 * * *' # 6 AM UTC daily — staggered against nightly-sim
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read
  issues: write

jobs:
  # ── Build phase: compile the jepsen driver ONCE (no Docker here) ─────────
  build-driver:
    name: Build ferrosa-jepsen driver (once)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Validate tier-multi-dc wiring (config-only)
        run: |
          set -o pipefail
          cargo test --release -p ferrosa-jepsen \
            --test tier_multi_dc \
            -- tier_multi_dc_resolves_to_t3 \
               dc_partition_plus_dc_slow_nemesis_registered \
            2>&1 | tee tier-config.log
      - name: Build the jepsen driver binary
        run: cargo build --release -p ferrosa-jepsen
      - name: Stage the driver artifact (flat layout)
        # Stage into one dir so the artifact has the binary + log at its ROOT
        # (uploading the two source paths directly would preserve
        # target/release/... relative to the repo root).
        run: |
          mkdir -p dist-driver
          cp target/release/ferrosa-jepsen dist-driver/
          cp tier-config.log dist-driver/
      - name: Upload the driver binary (+ config log) as an artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ferrosa-jepsen-driver
          path: dist-driver
          retention-days: 7

  # ── Run phase: Docker only. Download the .deb image + the driver, run. ───
  tier-multi-dc:
    name: tier-multi-dc bank workload (T3)
    needs: build-driver
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Free disk space
        # Bringing up the 3+3 dual-DC topology (6 Ferrosa containers + the nightly
        # runtime image + jepsen state) exhausted the runner disk ("No space left
        # on device" during topology bring-up). Reclaim the preinstalled SDK/tool
        # cache the same way ci.yml does; report before/after for diagnosis.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/.ghcup /usr/local/share/boost \
            /usr/share/swift || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Download the prebuilt jepsen driver
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ferrosa-jepsen-driver
          path: driver
      - name: Make the driver executable
        run: chmod +x driver/ferrosa-jepsen

      - name: Download nightly Ferrosa .deb
        id: nightly_deb
        uses: ./.github/actions/ferrosa-nightly-deb
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Ferrosa nightly runtime image (from the .deb, no source build)
        run: |
          set -euo pipefail
          cp "${{ steps.nightly_deb.outputs.deb_path }}" tests/ferrosa.deb
          docker build -f tests/Dockerfile.nightly-deb -t ferrosa-nightly:latest tests/
          rm -f tests/ferrosa.deb

      - name: Bring up T3 (3+3 dual-DC) topology
        env:
          FERROSA_NIGHTLY_IMAGE: ferrosa-nightly:latest
        run: |
          set -euo pipefail
          # --no-build (fail loud, never compile): the node services carry a
          # `build:` block (root Dockerfile, from source), so `up --build` would
          # RECOMPILE the whole ferrosa workspace and overwrite the .deb image.
          # Plain `up -d --no-build` runs the pre-built FERROSA_NIGHTLY_IMAGE.
          docker compose -f ferrosa-jepsen/tests/docker/jepsen-cluster-t3.yml \
            up -d --no-build

          # Probe each CQL socket directly, then validate process identity and
          # topology through its host-mapped HTTP port. Unlike cqlsh, neither
          # check can discover peers and load-balance the request onto another
          # node. Each row is cql-port|web-port|local-host-id|DC-ring.
          dc1_ring='11111111-1111-1111-1111-111111111111,11111111-1111-1111-1111-222222222222,11111111-1111-1111-1111-333333333333'
          dc2_ring='22222222-2222-2222-2222-111111111111,22222222-2222-2222-2222-222222222222,22222222-2222-2222-2222-333333333333'
          node_specs=(
            "29042|29090|11111111-1111-1111-1111-111111111111|$dc1_ring"
            "29043|29091|11111111-1111-1111-1111-222222222222|$dc1_ring"
            "29044|29092|11111111-1111-1111-1111-333333333333|$dc1_ring"
            "29142|29190|22222222-2222-2222-2222-111111111111|$dc2_ring"
            "29143|29191|22222222-2222-2222-2222-222222222222|$dc2_ring"
            "29144|29192|22222222-2222-2222-2222-333333333333|$dc2_ring"
          )
          preflight_deadline=$((SECONDS + 120))
          preflight_ready=0
          last_problem='HTTP endpoints have not responded yet'
          while (( SECONDS < preflight_deadline )); do
            topology_ready=1
            for node_spec in "${node_specs[@]}"; do
              IFS='|' read -r cql_port web_port expected_host_id expected_ring_ids <<< "$node_spec"
              base_url="http://localhost:${web_port}"

              if ! cql_error=$(python3 -c '
          import socket, struct, sys
          OPTIONS_OPCODE = 0x05
          SUPPORTED_OPCODE = 0x06
          cql_port = int(sys.argv[1])

          def recv_exact(sock, length):
              chunks = []
              remaining = length
              while remaining:
                  chunk = sock.recv(remaining)
                  if not chunk:
                      raise RuntimeError(f"socket closed with {remaining} response bytes remaining")
                  chunks.append(chunk)
                  remaining -= len(chunk)
              return b"".join(chunks)

          try:
              with socket.create_connection(("127.0.0.1", cql_port), timeout=5) as sock:
                  sock.settimeout(5)
                  sock.sendall(struct.pack(">BBhBI", 0x04, 0, 0, OPTIONS_OPCODE, 0))
                  response_header = recv_exact(sock, 9)
                  response_version, _, response_stream, response_opcode, response_length = struct.unpack(">BBhBI", response_header)
                  if response_version != 0x84 or response_stream != 0 or response_opcode != SUPPORTED_OPCODE:
                      raise RuntimeError(
                          f"expected v4 SUPPORTED on stream 0, got version=0x{response_version:02x} "
                          f"stream={response_stream} opcode=0x{response_opcode:02x}"
                      )
                  if response_length > 1048576:
                      raise RuntimeError(f"SUPPORTED body is unreasonably large: {response_length} bytes")
                  response_body = recv_exact(sock, response_length)
                  if response_length < 2:
                      raise RuntimeError("SUPPORTED body is missing its string-multimap header")
                  supported_key_count = struct.unpack(">H", response_body[:2])[0]
                  if supported_key_count < 1:
                      raise RuntimeError("SUPPORTED body advertises no capabilities")
          except Exception as error:
              print(error)
              raise SystemExit(1)
          ' "$cql_port" 2>&1); then
                topology_ready=0
                last_problem="CQL endpoint $cql_port failed OPTIONS/SUPPORTED: $cql_error"
                break
              fi

              if ! curl --connect-timeout 2 --max-time 5 -sf "${base_url}/health" >/dev/null; then
                topology_ready=0
                last_problem="HTTP endpoint $web_port is not healthy"
                break
              fi

              status=$(curl --connect-timeout 2 --max-time 5 -sf \
                "${base_url}/api/cluster/status") || status=''
              if ! status_error=$(printf '%s' "$status" | python3 -c '
          import json, sys
          expected_host_id = sys.argv[1]
          try:
              status = json.load(sys.stdin)
          except Exception as error:
              print(f"invalid JSON: {error}")
              raise SystemExit(1)
          if status.get("host_id") != expected_host_id or status.get("mode") != "cluster":
              print(f"expected host_id={expected_host_id} mode=cluster, got {status}")
              raise SystemExit(1)
          ' "$expected_host_id"); then
                topology_ready=0
                last_problem="HTTP endpoint $web_port status mismatch: $status_error"
                break
              fi

              ring=$(curl --connect-timeout 2 --max-time 5 -sf \
                "${base_url}/api/cluster/ring") || ring=''
              if ! ring_error=$(printf '%s' "$ring" | python3 -c '
          import json, sys
          expected_ring_ids = set(sys.argv[1].split(","))
          try:
              ring = json.load(sys.stdin)
          except Exception as error:
              print(f"invalid JSON: {error}")
              raise SystemExit(1)
          nodes = ring.get("nodes", [])
          actual_ring_ids = {node.get("host_id") for node in nodes}
          states = {node.get("host_id"): node.get("state") for node in nodes}
          if len(nodes) != 3 or actual_ring_ids != expected_ring_ids or any(state != "Normal" for state in states.values()):
              print(f"expected three Normal members {sorted(expected_ring_ids)}, got {states}")
              raise SystemExit(1)
          ' "$expected_ring_ids"); then
                topology_ready=0
                last_problem="HTTP endpoint $web_port ring mismatch: $ring_error"
                break
              fi
            done

            if [ "$topology_ready" -eq 1 ]; then
              preflight_ready=1
              break
            fi
            sleep 2
          done
          if [ "$preflight_ready" -ne 1 ]; then
            echo "::error::T3 topology did not converge within 120s: $last_problem"
            docker compose -f ferrosa-jepsen/tests/docker/jepsen-cluster-t3.yml ps
            exit 1
          fi
          echo "T3 preflight passed: six direct endpoints and two three-node Normal rings"

      - name: Run tier-multi-dc 1h bank workload
        env:
          FERROSA_TEST_CONTAINERS: '1'
          # The T3 stack is brought up in the preceding step. Supplying every
          # host-mapped CQL endpoint makes this a live workload rather than an
          # in-process MockCqlSession run.
          FERROSA_TEST_CLUSTER_NODES: 'localhost:29042,localhost:29043,localhost:29044,localhost:29142,localhost:29143,localhost:29144'
          # 10-min bank workload: 6 Docker containers on a 16 GB GitHub-hosted
          # runner OOM before the original 1-hour budget. The 10-min window
          # still exercises cross-DC Accord drift under nemesis injection.
          JEPSEN_RUN_DURATION_SECS: '600'
        run: |
          set -o pipefail
          # Live resource monitor streamed to the Actions log (captured
          # server-side, so it survives an exit-143 runner termination — the
          # on-runner "Diagnostics on failure" step does NOT run when the host
          # kills the runner). Prints host mem/disk + per-container mem every 5s.
          ( while true; do
              printf '[mon %s] ' "$(date +%T)"
              free -m | awk '/Mem:/{printf "host_mem=%d/%dMB ", $3, $2}'
              df -m / | awk 'NR==2{printf "disk_free=%dMB ", $4}'
              docker stats --no-stream --format '{{.Name}}:{{.MemUsage}}' 2>/dev/null | tr '\n' ' '
              echo
              sleep 5
            done ) &
          MON=$!
          trap 'kill "$MON" 2>/dev/null || true' EXIT
          ./driver/ferrosa-jepsen \
            run \
            --tier multi-dc \
            --pattern bank \
            --nemesis dc-partition+dc-slow \
            --output-dir ./jepsen-out \
            2>&1 | tee tier-multi-dc.log

      # Capture runner + container resource state on ANY failure so a red run
      # proves OOM-vs-other. Best-effort: never fails the job itself.
      - name: Diagnostics on failure (resource + container state)
        if: failure()
        run: |
          echo "=== free -m ==="; free -m || true
          echo "=== docker stats (snapshot) ==="
          docker stats --no-stream || true
          echo "=== docker compose ps ==="
          docker compose -f ferrosa-jepsen/tests/docker/jepsen-cluster-t3.yml ps || true
          echo "=== dmesg tail (OOM killer?) ==="
          sudo dmesg 2>/dev/null | tail -50 || dmesg 2>/dev/null | tail -50 || true
          echo "=== node + rustfs logs ==="
          docker compose -f ferrosa-jepsen/tests/docker/jepsen-cluster-t3.yml logs --tail 200 \
            > compose-logs.txt 2>&1 || true

      - name: Upload Jepsen logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tier-multi-dc-logs
          path: |
            driver/tier-config.log
            tier-multi-dc.log
            compose-logs.txt
            jepsen-out/
          retention-days: 30
          if-no-files-found: ignore

      - name: Tear down compose
        if: always()
        run: |
          docker compose -f ferrosa-jepsen/tests/docker/jepsen-cluster-t3.yml \
            down -v || true

      - name: File issue on failure
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let body = '## Nightly tier-multi-dc Jepsen run failed\n\n';
            for (const f of ['driver/tier-config.log', 'tier-multi-dc.log']) {
              if (fs.existsSync(f)) {
                const txt = fs.readFileSync(f, 'utf8').slice(-3000);
                body += '### ' + f + '\n```\n' + txt + '\n```\n';
              }
            }
            body += '\n[Workflow run](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ')\n';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Nightly tier-multi-dc Jepsen failed (' + new Date().toISOString().slice(0, 10) + ')',
              body,
              labels: ['bug', 'testing', 'sprint-7']
            });
