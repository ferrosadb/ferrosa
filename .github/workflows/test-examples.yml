name: Test Examples

on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - '.github/workflows/test-examples.yml'
  pull_request:
    branches: [main]
    paths:
      - 'examples/**'
      - '.github/workflows/test-examples.yml'
  schedule:
    # Nightly at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  COMPOSE_FILE: examples/cluster-setup/docker-compose.yml

jobs:
  test:
    name: Run Example CQL Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build Ferrosa Docker image
        run: docker compose build node1

      - name: Start 3-node cluster
        run: docker compose up -d node1

      - name: Install cqlsh
        run: pip install cqlsh

      - name: Wait for CQL port
        run: |
          echo "Waiting for Ferrosa CQL port (9042)..."
          for i in $(seq 1 120); do
            if cqlsh 127.0.0.1 9042 -e "SELECT cluster_name FROM system.local;" >/dev/null 2>&1; then
              echo "Ferrosa ready after ${i}s"
              break
            fi
            if [ "$i" -eq 120 ]; then
              echo "::error::Ferrosa did not become ready within 120s"
              docker compose logs node1 | tail -50
              exit 1
            fi
            sleep 1
          done

      - name: Run example tests
        run: |
          cd examples
          pass=0
          fail=0
          failed=()

          for dir in $(find . -mindepth 1 -maxdepth 1 -type d | sort); do
            name=$(basename "$dir")
            [ "$name" = "theme" ] && continue
            echo ""
            echo "=== $name ==="

            ok=true
            for f in schema.cql data.cql queries.cql; do
              if [ -f "$dir/$f" ]; then
                echo "  Running $f..."
                if ! cqlsh localhost 9042 -f "$dir/$f"; then
                  echo "  FAIL: $dir/$f"
                  ok=false
                  break
                fi
              fi
            done

            if [ -x "$dir/cypher-queries.sh" ]; then
              echo "  Running cypher-queries.sh..."
              if ! bash "$dir/cypher-queries.sh"; then
                echo "  FAIL: $dir/cypher-queries.sh"
                ok=false
              fi
            fi

            if $ok; then
              echo "  => $name: PASS"
              pass=$((pass + 1))
            else
              echo "  => $name: FAIL"
              fail=$((fail + 1))
              failed+=("$name")
            fi
          done

          echo ""
          echo "=============================="
          echo "Example tests: $pass passed, $fail failed"
          if [ ${#failed[@]} -gt 0 ]; then
            echo "Failed: ${failed[*]}"
          fi
          echo "=============================="
          [ "$fail" -eq 0 ]

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose logs node1 | tail -100
          docker compose logs node2 | tail -50
          docker compose logs node3 | tail -50

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans 2>/dev/null || true
