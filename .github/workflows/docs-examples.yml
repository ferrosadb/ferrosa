name: Generate Example Docs

on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - '.github/workflows/docs-examples.yml'
  pull_request:
    branches: [main]
    paths:
      - 'examples/**'
      - '.github/workflows/docs-examples.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: AsciiDoc → HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install asciidoctor
        run: sudo gem install asciidoctor --no-document

      - name: Generate HTML
        run: make -C examples html

      - name: Verify generated files
        run: |
          echo "Generated files:"
          ls -la docs/database/examples/*.html
          COUNT=$(ls docs/database/examples/*.html | wc -l)
          echo "Total: $COUNT HTML files"
          if [ "$COUNT" -lt 12 ]; then
            echo "::error::Expected at least 12 HTML files, got $COUNT"
            exit 1
          fi

      - name: Commit generated HTML (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/database/examples/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: regenerate example HTML from AsciiDoc sources"
            git push
          fi
