name: Nightly Fuzz + Smoke Test

on:
  schedule:
    - cron: '0 3 * * *' # 3 AM UTC daily
  workflow_dispatch: # manual trigger

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write
  pull-requests: write

jobs:
  fuzz:
    name: Property Test Fuzzing (45 min)
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25

      - name: Install Cap'n Proto compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends capnproto

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Run property tests (45-minute fuzz session)
        timeout-minutes: 45
        env:
          PROPTEST_CASES: 50000
        run: |
          set +e
          cargo test --workspace \
            --exclude ferrosa-jepsen \
            -- --skip batch_atomicity --skip pause_resume --skip recovery_coordinator \
               --skip cassandra_reads_compacted --skip compaction_end_to_end_pipeline \
               --skip dep_wait_ordering --skip disk_fail_no_phantom \
               --skip packet_reorder_linearizability --skip lwt_batch_atomicity_all \
               --skip clock_skew_large_preaccept \
            2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          echo "$status" > cargo-test-status
          exit 0
        continue-on-error: true

      - name: Check for regression files
        id: regressions
        run: |
          REGRESSION_FILES=$(find . -name '*.proptest-regressions' -not -path './target/*' 2>/dev/null)
          if [ -n "$REGRESSION_FILES" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "New regression files:"
            echo "$REGRESSION_FILES"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload regression files
        if: steps.regressions.outputs.found == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: proptest-regressions
          path: |
            **/*.proptest-regressions
            !target/**
          retention-days: 90

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-output
          path: test-output.log
          retention-days: 14

      - name: Create PR with regression files
        if: steps.regressions.outputs.found == 'true'
        continue-on-error: true
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: 'test: add proptest regression cases from nightly fuzz'
          title: 'Nightly fuzz: new proptest regression cases found'
          body: |
            The nightly fuzz session discovered new failing property test inputs.

            Regression files have been committed so these cases are replayed on every
            future `cargo test` run, preventing regressions.

            **Next steps:**
            1. Review the failing test output in the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            2. Fix the underlying bug
            3. Keep the regression files — they guard against the bug returning

            ---
            *Generated by nightly-fuzz workflow*
          branch: nightly-fuzz-regressions
          delete-branch: true
          add-paths: |
            **/*.proptest-regressions
          labels: bug,testing

      - name: Fail if tests failed
        run: |
          status=$(cat cargo-test-status 2>/dev/null || echo 1)
          if [ "$status" -ne 0 ]; then
            echo "::error::Property test command failed with exit status $status — check test-output artifact and regression files"
            exit "$status"
          fi

  smoke-test:
    name: Docker Smoke Test (Pair Mode)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Docker smoke test
        run: bash tests/docker-smoke.sh

      - name: Collect Docker logs on failure
        if: failure()
        run: |
          docker compose logs node1 > node1.log 2>&1 || true
          docker compose logs node2 > node2.log 2>&1 || true

      - name: Upload Docker logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-smoke-logs
          path: |
            node1.log
            node2.log
          retention-days: 14

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans 2>/dev/null || true
