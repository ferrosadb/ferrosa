name: Nightly Fuzz + Smoke Test

on:
  schedule:
    - cron: '0 3 * * *' # 3 AM UTC daily
  workflow_dispatch: # manual trigger

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # rust-cache is the only build cache and saves only from main (see ci.yml).
  # Incremental state is never reused from a fresh checkout.
  CARGO_INCREMENTAL: "0"

permissions:
  contents: write
  pull-requests: write
  # A red scheduled run must be VISIBLE. On 2026-09-30 this workflow failed and
  # nobody noticed for a day: the run's red dot is not a notification, and the
  # only escalation here (the regression-file PR) fires on a different
  # condition. The `fuzz` job therefore files a tracking issue when it fails,
  # the same mechanism nightly-sim and the Elle cert already use. `issues:
  # write` is the whole added surface — no new secret, no new service.
  issues: write

jobs:
  # T2b: ferrosa-jepsen's compose/topology tests run against the node image the
  # cluster runs, and that image must exist BEFORE those tests start. ci.yml
  # builds it LAST (after `test`), which is exactly why `test` excludes the two
  # crates; nightly-slow-tests.yml builds it FIRST and gates its test job on it.
  # This job reuses that proven shape so the comprehensive `fuzz` job can run
  # the two crates without an ordering hazard.
  build-node-image:
    name: Build node image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: node-image
          save-if: ${{ github.ref == 'refs/heads/main' && runner.environment == 'github-hosted' }}
      - name: Install capnproto
        run: sudo apt-get update && sudo apt-get install -y capnproto
      - name: Build the node image
        # Same thin runtime image ci.yml's build-node-image produces from
        # `cargo build --release`, so `docker load` below yields
        # ferrosa-test-node:latest for the cluster AND for the Jepsen compose
        # files (via FERROSA_NIGHTLY_IMAGE, see the run step).
        run: |
          set -euo pipefail
          cargo build --release -p ferrosa -p ferrosa-ctl
          mkdir -p node-bin
          cp target/release/ferrosa target/release/ferrosa-ctl node-bin/
          cat > node-bin/Dockerfile <<'DEOF'
          FROM downloads.ferrosa.ai/debian@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a
          RUN apt-get update && apt-get install -y --no-install-recommends \
                  ca-certificates gdb procps \
              && rm -rf /var/lib/apt/lists/*
          COPY ferrosa /usr/local/bin/ferrosa
          COPY ferrosa-ctl /usr/local/bin/ferrosa-ctl
          EXPOSE 9042 7000 9090 7474 7687
          ENV FERROSA_DATA_DIR=/var/lib/ferrosa
          CMD ["ferrosa"]
          DEOF
          for attempt in 1 2 3 4; do
            docker build -t ferrosa-test-node:latest node-bin && break
            [ "$attempt" = 4 ] && { echo "docker build failed after 4 attempts"; exit 1; }
            echo "docker build attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          docker save ferrosa-test-node:latest | gzip > ferrosa-node-image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ferrosa-node-image
          path: ferrosa-node-image.tar.gz
          retention-days: 1

  fuzz:
    name: Property Test Fuzzing (bounded)
    runs-on: ubuntu-latest
    # T2b: the node image must be loaded before the Jepsen compose tests run.
    needs: build-node-image
    # Sized so the WHOLE job (setup + both bounded fuzz steps + verdict) fits
    # under the cap and the run completes instead of being cancelled. Each fuzz
    # step is bounded by an inner `timeout` (wall-clock budget) BELOW its step
    # timeout, so it exits cleanly and the verdict step always runs.
    timeout-minutes: 45
    env:
      # Line-tables debuginfo, the same as ci.yml `test` and `integration`, so
      # this job restores their dependency cache instead of compiling cold
      # inside its fuzz budget. Backtraces keep file:line; nothing here runs a
      # debugger. Job-level so rust-cache hashes it into the key.
      CARGO_PROFILE_DEV_DEBUG: "1"
      # T2b: the container-runtime prerequisites the Jepsen/loadgen harnesses
      # read, set once for the whole job.
      #
      # Pin docker (ubuntu-latest also ships podman; a prior container job
      # silently picked it up from PATH — docker_provision.rs's
      # `select_container_runtime` honors this).
      FERROSA_CONTAINER_RUNTIME: docker
      # The node image the Jepsen compose files run, loaded from the
      # build-node-image artifact above. `jepsen-cluster.yml` /
      # `jepsen-cluster-t3.yml` / `docker-compose.compaction-test.yml` all name
      # their node service `${FERROSA_NIGHTLY_IMAGE:-ferrosa-nightly:latest}`,
      # so one image serves the orchestrator's own compose cluster (port 49042)
      # AND every in-test compose bring-up.
      FERROSA_NIGHTLY_IMAGE: ferrosa-test-node:latest
      # `cluster_topology_invariants.rs` shells out to `docker run ... cqlsh`;
      # redirect it to the digest-pinned mirror like ci.yml's `integration` job,
      # so a Docker Hub outage cannot turn the nightly red for the wrong reason.
      FERROSA_CASSANDRA_IMAGE: downloads.ferrosa.ai/cassandra@sha256:8819d1b7877ee6621751a761cc163332e9c3eaf671c8ef672f7c77a7c5bff05f

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25

      - name: Install Cap'n Proto compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends capnproto libunwind-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: workspace-test-all-features-debug1
          save-if: ${{ github.ref == 'refs/heads/main' && runner.environment == 'github-hosted' }}

      # ── T2b: provision the ferrosa-jepsen harness (ordering matters) ──────
      # The node image artifact built by the `build-node-image` job above. It
      # must be loaded BEFORE any step that brings up a compose cluster or runs
      # the Jepsen compose tests — that is the ordering constraint that kept
      # ferrosa-jepsen `--exclude`d everywhere.
      - name: Download prebuilt node image
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ferrosa-node-image
          path: .
      - name: Load node image into Docker
        run: docker load < ferrosa-node-image.tar.gz

      # Pull the digest-pinned service images once, with the repo's bounded
      # retry, so a transient registry blip names the image instead of surfacing
      # later as a confusing cluster/compose failure. These are the images the
      # Jepsen compose cluster (rustfs + bucket bootstrap) pulls.
      - name: Pre-pull Jepsen compose images
        run: |
          scripts/pull-images.sh \
            "downloads.ferrosa.ai/rustfs@sha256:58c589bedfab28d001fc6176735872ac84323dddc6c5313cc95260600ed1ae8d" \
            "downloads.ferrosa.ai/aws-cli@sha256:e38214027df83cb6631adcf980a092a98d1d29788789bff2a0f424e87e3da8ed" \
            "$FERROSA_CASSANDRA_IMAGE"

      # The orchestrator (`ferrosa-jepsen/src/orchestrator.rs`) with
      # FERROSA_TEST_CONTAINERS set provisions its OWN 3-node cluster from
      # `jepsen-cluster.yml` via `docker_provision.rs`, on host ports
      # 49042-49044. `docker_mini_jepsen.rs` and `rust_driver_connects_to_cluster`
      # also dial 49042 directly (`cql_session.rs:218`). Bring that stack up
      # here so those tests have live endpoints AND so the compose stack is warm
      # before the timed run step (a cold bring-up inside the fuzz budget would
      # eat the wall clock). Teardown mirrors it below.
      - name: Bring up the Jepsen compose cluster (49042-49044)
        env:
          FERROSA_TEST_CONTAINERS: "1"
        run: |
          set -euo pipefail
          # --no-build: the node services carry a `build:` block (root
          # Dockerfile, from source). `up --build` would RECOMPILE the whole
          # ferrosa workspace and overwrite the loaded image; plain
          # `up -d --no-build` runs FERROSA_NIGHTLY_IMAGE (ferrosa-test-node).
          docker compose -f ferrosa-jepsen/tests/docker/jepsen-cluster.yml \
            up -d --no-build
          deadline=$((SECONDS + 180))
          until python3 -c '
          import socket, sys
          for port in (49042, 49043, 49044):
              try:
                  socket.create_connection(("127.0.0.1", port), timeout=5).close()
              except OSError:
                  sys.exit(1)
          '; do
            if (( SECONDS >= deadline )); then
              echo "::error::Jepsen cluster CQL ports did not open within 180s"
              docker compose -f ferrosa-jepsen/tests/docker/jepsen-cluster.yml ps
              exit 1
            fi
            sleep 5
          done

      # `cluster_topology_invariants.rs` hardcodes the standard 3-node cluster on
      # host ports 9042-9044 (Gap 11 host_id/broadcast_address/token-ring
      # invariants), and `test-cluster-up-ci.sh` emits
      # FERROSA_TEST_CLUSTER_NODES=127.0.0.1:9042,9043,9044. Same bring-up
      # ci.yml's `integration` job uses; it reuses the ferrosa-test-node image
      # loaded above instead of rebuilding.
      - name: Bring up the standard 3-node test cluster (9042-9044)
        run: |
          ./scripts/test-cluster-up-ci.sh > /tmp/cluster-env
          cat /tmp/cluster-env >> "$GITHUB_ENV"

      # T2b: export the remaining harness prerequisites once, so every step that
      # needs them (the run step and the verdict step's `--list`) inherits them.
      #
      # FERROSA_TEST_CONTAINERS   — container-gated Jepsen + loadgen tests
      # FERROSA_TEST_LOADGEN      — ferrosa-loadgen/tests/binary_smoke.rs
      #   (FERROSA_TEST_CLUSTER_NODES came from the step above.)
      #
      # Blocked set — cannot pass on a GitHub-hosted ubuntu-latest runner even
      # with these harnesses, because they need a VM/host the runner cannot
      # provide (SSH or Firecracker). These belong in T3's asserted,
      # evidence-backed permitted-exclusion set; T2b names them, it does not
      # silently `--skip` them:
      #   * ssh_execute_command, ssh_upload_file — need a Lima/Firecracker VM with
      #     sshd on 127.0.0.1:2022 + rootfs/test_key
      #     (ferrosa-jepsen/src/ssh.rs:237-317).
      #   * provision_single_vm, provision_t1_cluster — Firecracker KVM
      #     (ferrosa-jepsen/src/firecracker.rs:328, ferrosa-jepsen/src/cluster.rs:222).
      #   * nemesis_correctness::{disk_fail_no_phantom_commits,
      #     packet_reorder_linearizability, lwt_batch_atomicity_all} — inject via
      #     SSH into the nodes, which the compose cluster does not expose
      #     (ferrosa-jepsen/tests/nemesis_correctness.rs:36,86,133).
      #   * tier_multi_dc_one_hour_bank_workload — panics unconditionally; the
      #     1-hour run is jepsen-multi-dc-nightly.yml
      #     (ferrosa-jepsen/tests/tier_multi_dc.rs:55-90).
      #   * docker_mini_jepsen — needs the ~/src/ferrosa-memory compose cluster on
      #     19042-19044 (ferrosa-jepsen/tests/docker_mini_jepsen.rs:8-13).
      #   * loadgen ucs_load_s3_test — needs RustFS S3 on 29000 outside the run
      #     (ferrosa-loadgen/tests/ucs_load_s3_test.rs:80-160).
      # FERROSA_TEST_TYPED_EDGES_DIR is deliberately NOT set: the captured
      #   typed_edges SSTables are explicitly NOT checked in
      #   (ferrosa-cluster/src/coordinator/range_read_stream.rs:3796), so
      #   real_typed_edges_paged_scan_* / count_range_metadata_merger_* stay
      #   blocked, not silently run without their input.
      - name: Export harness prerequisites
        run: |
          {
            echo "FERROSA_TEST_CONTAINERS=1"
            echo "FERROSA_TEST_LOADGEN=1"
          } >> "$GITHUB_ENV"

      - name: Build AssemblyScript UDF toolchain bundle
        # --all-features enables `asc-udf` + `live-infra-tests`, which run the
        # inline-AssemblyScript UDF tests for real against this bundle. Build it
        # (pinned asc version) so those tests run and pass rather than fail.
        run: bash ferrosa-udf/examples/asc-poc/build-bundle.sh /tmp/asc-host/asc-bundle.mjs

      - name: Run property tests (bounded 20-minute fuzz session)
        # Inner `timeout` (20 min) is the real bound; this step timeout is a
        # cushion above it so the step exits cleanly rather than being cancelled.
        timeout-minutes: 24
        env:
          # 5k cases is sized to finish within the 20-min budget on the runner
          # (so the session reports "all cases passed" rather than relying on the
          # timeout cutoff); the inner `timeout` below is the hard safety bound.
          PROPTEST_CASES: 5000
          FUZZ_BUDGET_SECS: 1200 # 20 min wall-clock fuzz budget (safety cap)
          FERROSA_ASC_BUNDLE: /tmp/asc-host/asc-bundle.mjs
          # Enables libtest's `--report-time` on the stable toolchain so the
          # uploaded test-output.log ranks every test by wall-clock duration
          # (`ok <1.234s>`). libtest reads RUSTC_BOOTSTRAP when the test binary
          # RUNS, so it is passed to the test binaries only, through the target
          # runner. Exported for the compile it WOULD change what is built:
          # anyhow's build script tracks RUSTC_BOOTSTRAP, which rebuilds most
          # of the graph and defeats the shared test cache.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "env RUSTC_BOOTSTRAP=1"
        run: |
          set +e
          # --all-features so feature-gated property tests (e.g. the whole
          # `repair_fuzz` harness behind `test-generators`) are actually fuzzed
          # — without it they were silently skipped here. The trailing skips
          # mirror ci.yml's heavy/live-infra exclusions (they would never finish
          # at 50000 cases) and exclude the file-IO-heavy repair fuzz
          # (`fuzz-fileio`), which gets its own bounded step below.
          # `--skip accord::perf` (matches accord::perf_regression too) keeps the
          # absolute wall-clock bounds out of this debug-profile fuzz session,
          # as ci.yml does; they ran here and failed at 56.7 ms on 2026-09-30.
          # The `perf-regression` job below enforces them unchanged.
          # Crate excludes removed by T2b: ferrosa-jepsen and ferrosa-loadgen are
          # no longer excluded here — the job now provisions their harnesses
          # (node image, compose cluster, FERROSA_TEST_CONTAINERS /
          # _CLUSTER_NODES / _LOADGEN above), so the run includes them.
          # NOTE (coordination): the `--skip` list below is owned by T2
          # (`t_112d82ee`), which deletes it entirely; T2b changes only the
          # `--exclude` flags. Merge this hunk onto T2's no-skip invocation.
          # Bound the fuzz to a wall-clock budget so the run COMPLETES (exit 0)
          # instead of being cancelled by the GH step/job timeout. `timeout`
          # returns 124 (SIGTERM at the budget) or 137 (SIGKILL after grace) —
          # both mean "fuzzed the full budget without a failing case" = success.
          # Any other non-zero is a real proptest failure and is surfaced.
          timeout --kill-after=30s "${FUZZ_BUDGET_SECS}" \
            cargo test --all-features --workspace --lib --tests \
              -- -Z unstable-options --report-time \
                 --skip batch_atomicity --skip pause_resume --skip recovery_coordinator \
                 --skip cassandra_reads_compacted --skip compaction_end_to_end_pipeline \
                 --skip dep_wait_ordering --skip disk_fail_no_phantom \
                 --skip packet_reorder_linearizability --skip lwt_batch_atomicity_all \
                 --skip clock_skew_large_preaccept \
                 --skip binary_ \
                 --skip concurrent_write --skip many_flushes \
                 --skip flush_2000 --skip single_writer --skip write_flush_compact \
                 --skip reads_never_panic_on_arbitrary_content \
                 --skip corrupt_sstable_bytes_never_panic_never_oom \
                 --skip peak_resident_readers_within_cap --skip streaming_equals_single_pass \
                 --skip bounded_fetch_reassembles_to_single_pass \
                 --skip read_merge_is_lww_no_data_loss --skip digest_walk_is_deterministic \
                 --skip differential_oracle_dml_agrees \
                 --skip differential_oracle_corpus_agrees \
                 --skip differential_oracle_jsonb \
                 --skip differential_oracle_rejects_unsupported_queries \
                 --skip real_typed_edges_paged_scan_delivers_every_distinct_row \
                 --skip count_range_metadata_merger_dedups_real_typed_edges_sstables \
                 --skip fly_multi_node_streaming_scan \
                 --skip orchestrator_cluster_teardown \
                 --skip orchestrator_docker_cluster_provision \
                 --skip provision_single_vm \
                 --skip provision_t1_cluster \
                 --skip rust_driver_connects_to_cluster \
                 --skip ssh_execute_command \
                 --skip ssh_upload_file \
                 --skip accord::perf \
            2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" = "124" ] || [ "$status" = "137" ]; then
            echo "::notice::fuzz budget (${FUZZ_BUDGET_SECS}s) elapsed with no failing case — treating as success"
            status=0
          fi
          echo "$status" > cargo-test-status
          exit 0
        continue-on-error: true

      - name: Run file-IO repair fuzz (bounded cases)
        # Inner `timeout` (5 min) is the real bound; this step timeout is a
        # cushion so the whole job stays under the job cap and the verdict runs.
        timeout-minutes: 8
        env:
          # Each case flushes many real on-disk SSTables, so this harness is
          # filesystem-bound — run it at a moderate case count, not 50000.
          PROPTEST_CASES: 256
          FILEIO_FUZZ_BUDGET_SECS: 300 # 5 min wall-clock budget
        run: |
          set +e
          timeout --kill-after=30s "${FILEIO_FUZZ_BUDGET_SECS}" \
            cargo test -p ferrosa-storage --all-features --test repair_fuzz \
            2>&1 | tee -a test-output.log
          status=${PIPESTATUS[0]}
          # Budget elapsed (124/137) = fuzzed without a failing case → success.
          if [ "$status" = "124" ] || [ "$status" = "137" ]; then
            echo "::notice::file-IO fuzz budget (${FILEIO_FUZZ_BUDGET_SECS}s) elapsed with no failing case — treating as success"
            status=0
          fi
          # Fold this run's status into the aggregate so a file-IO regression is
          # not lost; non-zero from either fuzz step marks the session failed.
          prev=$(cat cargo-test-status 2>/dev/null || echo 0)
          if [ "$status" != "0" ]; then echo "$status" > cargo-test-status; else echo "$prev" > cargo-test-status; fi
          exit 0
        continue-on-error: true

      # T2b: tear down both test clusters the run used. Mirror-images of the
      # bring-up steps above; `if: always()` so a failed run still cleans up.
      - name: Tear down the test clusters
        if: always()
        run: |
          docker compose -f ferrosa-jepsen/tests/docker/jepsen-cluster.yml \
            down -v --remove-orphans 2>/dev/null || true
          ./scripts/test-cluster-down.sh --ci 2>/dev/null || true

      - name: Check for regression files
        id: regressions
        run: |
          REGRESSION_FILES=$(find . -name '*.proptest-regressions' -not -path './target/*' 2>/dev/null)
          if [ -n "$REGRESSION_FILES" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "New regression files:"
            echo "$REGRESSION_FILES"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload regression files
        if: steps.regressions.outputs.found == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: proptest-regressions
          path: |
            **/*.proptest-regressions
            !target/**
          retention-days: 90

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-output
          path: test-output.log
          retention-days: 14

      - name: Create PR with regression files
        if: steps.regressions.outputs.found == 'true'
        continue-on-error: true
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: 'test: add proptest regression cases from nightly fuzz'
          title: 'Nightly fuzz: new proptest regression cases found'
          body: |
            The nightly fuzz session discovered new failing property test inputs.

            Regression files have been committed so these cases are replayed on every
            future `cargo test` run, preventing regressions.

            **Next steps:**
            1. Review the failing test output in the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            2. Fix the underlying bug
            3. Keep the regression files — they guard against the bug returning

            ---
            *Generated by nightly-fuzz workflow*
          branch: nightly-fuzz-regressions
          delete-branch: true
          add-paths: |
            **/*.proptest-regressions
          labels: bug,testing

      - name: Fail if tests failed
        # Unchanged verdict: this step is what makes the run red. The issue filer
        # below is a SIGNAL, never a replacement for the failing run.
        run: |
          status=$(cat cargo-test-status 2>/dev/null || echo 1)
          if [ "$status" -ne 0 ]; then
            echo "::error::Property test command failed with exit status $status — check test-output artifact and regression files"
            exit "$status"
          fi

      - name: File an issue on failure
        # The visible signal, on the path the verdict step above just failed.
        # A failed scheduled run otherwise announces itself only by a red dot
        # nobody is watching — which is how the 2026-09-30 failure went
        # unnoticed for a day. Same shape as nightly-sim's and the Elle cert's
        # escalation: a tracking issue naming the artifacts and the run.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue create \
            --title "Nightly fuzz FAILED ($(date -u +%F))" \
            --label bug \
            --body "The nightly property-fuzz session failed (see the 'Fail if tests failed' step for the exit status).

          Run: ${run_url}

          Artefacts on that run: \`test-output\` (ranked test log) and
          \`proptest-regressions\` if any regression files were found.

          This is the scheduled signal for \`nightly-fuzz.yml\`; it is not a
          per-PR gate. Investigate the named failing property test, fix it, and
          keep any regression files the run committed." \
            || echo "::warning::could not file the tracking issue (gh issue create failed); the red run itself stands"

  smoke-test:
    name: Docker Smoke Test (Pair Mode)
    runs-on: ubuntu-latest
    # Image build (cold cache) + rustfs bring-up + pair/cluster tests can exceed
    # 35 min on GitHub-hosted runners. Size this to the same cap as the fuzz job
    # so a slow build does not cancel the run before the smoke test completes.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install cqlsh
        run: pip install cqlsh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Download latest nightly .deb release
        id: nightly_deb
        uses: ./.github/actions/ferrosa-nightly-deb
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build smoke-test runtime image from nightly .deb
        run: |
          set -euo pipefail
          cp "${{ steps.nightly_deb.outputs.deb_path }}" tests/ferrosa.deb
          docker build -f tests/Dockerfile.nightly-deb -t ferrosa-smoke:latest tests/
          # Keep ferrosa.deb in place: docker-smoke.sh runs `docker compose up --build`
          # against docker-compose.yml, which uses tests/Dockerfile.smoke and needs
          # the .deb file as a build context. Deleting it here causes a cache miss and
          # "ferrosa.deb: not found" during the compose build.

      - name: Build x86_64 musl static ferrosa binary (fallback)
        # The smoke test needs a runtime image. We prefer the nightly .deb above.
        # This fallback is compiled only if the reusable download step somehow
        # misses; in normal scheduled runs the midnight build is always available.
        if: steps.nightly_deb.outputs.deb_path == ''
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl -p ferrosa
          cp target/x86_64-unknown-linux-musl/release/ferrosa tests/ferrosa
          strip tests/ferrosa
          docker build -f tests/Dockerfile.nightly-bin -t ferrosa-smoke:latest tests/
          # Keep the static binary in place for the same reason we keep the .deb.

      - name: Run Docker smoke test
        env:
          PAIR_CQL_TIMEOUT: 240
          COMPOSE_PARALLEL_LIMIT: 2
        run: |
          set -uo pipefail
          # Run with an explicit inner timeout so that if the smoke test hangs
          # we still reach the log-collection/upload steps and can diagnose why.
          timeout --kill-after=60s 3060 bash tests/docker-smoke.sh 2>&1 | tee docker-smoke-output.log
          status=${PIPESTATUS[0]}
          echo "$status" > docker-smoke-status
          exit 0
        continue-on-error: true

      - name: Collect Docker state and logs
        if: always()
        run: |
          # This step runs AFTER docker-smoke.sh's EXIT trap has already run
          # `docker compose down -v --remove-orphans`, so the containers are
          # gone and `compose logs` HERE returns nothing. The script captures
          # the real logs at failure time (collect_default_compose_logs, called
          # from fail() before the trap fires) — and this step used to TRUNCATE
          # those good captures to zero bytes with `>`. That is why every
          # "node1 CQL did not become ready" nightly shipped an empty
          # node1.log/node2.log and could never be diagnosed.
          #
          # Only write a file the script did not already fill.
          if [ ! -s docker-compose-ps.log ]; then
            docker compose ps > docker-compose-ps.log 2>&1 || true
          fi
          {
            echo "--- post-teardown snapshot (containers may already be removed) ---"
            docker compose ps -a 2>&1 || true
            docker system df 2>&1 || true
          } >> docker-compose-ps.log
          for service in node1 node2 node3 rustfs rustfs-init; do
            if [ -s "${service}.log" ]; then
              echo "preserving script-captured ${service}.log ($(wc -c < "${service}.log") bytes)"
            else
              docker compose logs --tail 500 "$service" > "${service}.log" 2>&1 || true
            fi
          done
          # An empty node1.log after a FAILED smoke run means the capture path
          # is broken again. Say so loudly — a silent empty artifact is exactly
          # what hid this for weeks.
          if [ ! -s node1.log ]; then
            echo "::warning::node1.log is EMPTY — if the smoke run failed, the capture path is broken (see collect_default_compose_logs in tests/docker-smoke.sh)"
          fi

      - name: Upload Docker logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-smoke-logs
          path: |
            docker-compose-ps.log
            docker-smoke-output.log
            node1.log
            node2.log
            node3.log
            rustfs.log
            rustfs-init.log
          retention-days: 14

      - name: Fail if smoke test failed
        if: always()
        run: |
          status=$(cat docker-smoke-status 2>/dev/null || echo 1)
          if [ "$status" -ne 0 ]; then
            echo "::error::Docker smoke test failed or timed out with exit status $status — check docker-smoke-logs artifact"
            exit "$status"
          fi

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans 2>/dev/null || true

  perf-regression:
    name: Accord perf regression (wall-clock thresholds)
    runs-on: ubuntu-latest
    # These assertions are ABSOLUTE wall-clock bounds, so they only mean
    # something when the machine is not competing with the rest of the PR gate.
    # They were moved out of the per-PR lane (ci.yml `--skip
    # accord::perf_regression`) after a contended merge-group build measured a
    # 1000-message ReorderBuffer drain at 52.8 ms against a 10 ms bound and
    # ejected a docs-only PR from the merge queue (forge t_430e21f7).
    #
    # HONEST LIMIT: a GitHub-hosted nightly runner is still shared hardware, so
    # this job catches GROSS regressions, not small ones. Precise measurement
    # belongs on the Fly perf-tier instances (see ~/ferrosa-perf-evidence and
    # the write-path A/B methodology). Do NOT widen a threshold to make this
    # green — investigate, or move the measurement to dedicated hardware.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25

      - name: Install Cap'n Proto compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends capnproto

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && runner.environment == 'github-hosted' }}

      - name: Run Accord perf regression suite
        # --all-features: the same build these bounds were set against when
        # they ran in ci.yml's --all-features `test` job.
        run: |
          # `accord::perf` matches both accord::perf and accord::perf_regression.
          cargo test -p ferrosa-cluster --all-features --lib accord::perf -- --nocapture
