name: Nightly Fuzz + Smoke Test

on:
  schedule:
    - cron: '0 3 * * *' # 3 AM UTC daily
  workflow_dispatch: # manual trigger

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Shared compilation cache (GitHub Actions backend). Every job that compiles
  # runs a sccache-action step (the smoke-test job's is gated on the rare musl
  # fallback). CARGO_INCREMENTAL=0 because incremental bypasses sccache.
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  CARGO_INCREMENTAL: "0"

permissions:
  contents: write
  pull-requests: write

jobs:
  fuzz:
    name: Property Test Fuzzing (bounded)
    runs-on: ubuntu-latest
    # Sized so the WHOLE job (setup + both bounded fuzz steps + verdict) fits
    # under the cap and the run completes instead of being cancelled. Each fuzz
    # step is bounded by an inner `timeout` (wall-clock budget) BELOW its step
    # timeout, so it exits cleanly and the verdict step always runs.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25

      - name: Install Cap'n Proto compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends capnproto

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Build AssemblyScript UDF toolchain bundle
        # --all-features enables `asc-udf` + `live-infra-tests`, which run the
        # inline-AssemblyScript UDF tests for real against this bundle. Build it
        # (pinned asc version) so those tests run and pass rather than fail.
        run: bash ferrosa-udf/examples/asc-poc/build-bundle.sh /tmp/asc-host/asc-bundle.mjs

      - name: Run property tests (bounded 20-minute fuzz session)
        # Inner `timeout` (20 min) is the real bound; this step timeout is a
        # cushion above it so the step exits cleanly rather than being cancelled.
        timeout-minutes: 24
        env:
          # 5k cases is sized to finish within the 20-min budget on the runner
          # (so the session reports "all cases passed" rather than relying on the
          # timeout cutoff); the inner `timeout` below is the hard safety bound.
          PROPTEST_CASES: 5000
          FUZZ_BUDGET_SECS: 1200 # 20 min wall-clock fuzz budget (safety cap)
          FERROSA_ASC_BUNDLE: /tmp/asc-host/asc-bundle.mjs
          # Enables libtest's `--report-time` on the stable toolchain so the
          # uploaded test-output.log ranks every test by wall-clock duration
          # (`ok <1.234s>`). Only permits the unstable libtest flag; the code
          # uses no nightly features, so this does not change what is compiled.
          RUSTC_BOOTSTRAP: 1
        run: |
          set +e
          # --all-features so feature-gated property tests (e.g. the whole
          # `repair_fuzz` harness behind `test-generators`) are actually fuzzed
          # — without it they were silently skipped here. The trailing skips
          # mirror ci.yml's heavy/live-infra exclusions (they would never finish
          # at 50000 cases) and exclude the file-IO-heavy repair fuzz
          # (`fuzz-fileio`), which gets its own bounded step below.
          # Crate excludes + skip list mirror ci.yml's proven --all-features run
          # (jepsen/loadgen excluded; live-infra + heavy tests skipped by name);
          # the file-IO repair fuzz is skipped here and run in the step below.
          # Bound the fuzz to a wall-clock budget so the run COMPLETES (exit 0)
          # instead of being cancelled by the GH step/job timeout. `timeout`
          # returns 124 (SIGTERM at the budget) or 137 (SIGKILL after grace) —
          # both mean "fuzzed the full budget without a failing case" = success.
          # Any other non-zero is a real proptest failure and is surfaced.
          timeout --kill-after=30s "${FUZZ_BUDGET_SECS}" \
            cargo test --all-features --workspace --lib --tests \
              --exclude ferrosa-jepsen --exclude ferrosa-loadgen \
              -- -Z unstable-options --report-time \
                 --skip batch_atomicity --skip pause_resume --skip recovery_coordinator \
                 --skip cassandra_reads_compacted --skip compaction_end_to_end_pipeline \
                 --skip dep_wait_ordering --skip disk_fail_no_phantom \
                 --skip packet_reorder_linearizability --skip lwt_batch_atomicity_all \
                 --skip clock_skew_large_preaccept \
                 --skip binary_ \
                 --skip concurrent_write --skip many_flushes \
                 --skip flush_2000 --skip single_writer --skip write_flush_compact \
                 --skip reads_never_panic_on_arbitrary_content \
                 --skip corrupt_sstable_bytes_never_panic_never_oom \
                 --skip peak_resident_readers_within_cap --skip streaming_equals_single_pass \
                 --skip bounded_fetch_reassembles_to_single_pass \
                 --skip read_merge_is_lww_no_data_loss --skip digest_walk_is_deterministic \
                 --skip differential_oracle_dml_agrees \
                 --skip differential_oracle_corpus_agrees \
                 --skip differential_oracle_rejects_unsupported_queries \
                 --skip real_typed_edges_paged_scan_delivers_every_distinct_row \
                 --skip count_range_metadata_merger_dedups_real_typed_edges_sstables \
                 --skip fly_multi_node_streaming_scan \
                 --skip orchestrator_cluster_teardown \
                 --skip orchestrator_docker_cluster_provision \
                 --skip provision_single_vm \
                 --skip provision_t1_cluster \
                 --skip rust_driver_connects_to_cluster \
                 --skip ssh_execute_command \
                 --skip ssh_upload_file \
            2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" = "124" ] || [ "$status" = "137" ]; then
            echo "::notice::fuzz budget (${FUZZ_BUDGET_SECS}s) elapsed with no failing case — treating as success"
            status=0
          fi
          echo "$status" > cargo-test-status
          exit 0
        continue-on-error: true

      - name: Run file-IO repair fuzz (bounded cases)
        # Inner `timeout` (5 min) is the real bound; this step timeout is a
        # cushion so the whole job stays under the job cap and the verdict runs.
        timeout-minutes: 8
        env:
          # Each case flushes many real on-disk SSTables, so this harness is
          # filesystem-bound — run it at a moderate case count, not 50000.
          PROPTEST_CASES: 256
          FILEIO_FUZZ_BUDGET_SECS: 300 # 5 min wall-clock budget
        run: |
          set +e
          timeout --kill-after=30s "${FILEIO_FUZZ_BUDGET_SECS}" \
            cargo test -p ferrosa-storage --features fuzz-fileio --test repair_fuzz \
            2>&1 | tee -a test-output.log
          status=${PIPESTATUS[0]}
          # Budget elapsed (124/137) = fuzzed without a failing case → success.
          if [ "$status" = "124" ] || [ "$status" = "137" ]; then
            echo "::notice::file-IO fuzz budget (${FILEIO_FUZZ_BUDGET_SECS}s) elapsed with no failing case — treating as success"
            status=0
          fi
          # Fold this run's status into the aggregate so a file-IO regression is
          # not lost; non-zero from either fuzz step marks the session failed.
          prev=$(cat cargo-test-status 2>/dev/null || echo 0)
          if [ "$status" != "0" ]; then echo "$status" > cargo-test-status; else echo "$prev" > cargo-test-status; fi
          exit 0
        continue-on-error: true

      - name: Check for regression files
        id: regressions
        run: |
          REGRESSION_FILES=$(find . -name '*.proptest-regressions' -not -path './target/*' 2>/dev/null)
          if [ -n "$REGRESSION_FILES" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "New regression files:"
            echo "$REGRESSION_FILES"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload regression files
        if: steps.regressions.outputs.found == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: proptest-regressions
          path: |
            **/*.proptest-regressions
            !target/**
          retention-days: 90

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-output
          path: test-output.log
          retention-days: 14

      - name: Create PR with regression files
        if: steps.regressions.outputs.found == 'true'
        continue-on-error: true
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: 'test: add proptest regression cases from nightly fuzz'
          title: 'Nightly fuzz: new proptest regression cases found'
          body: |
            The nightly fuzz session discovered new failing property test inputs.

            Regression files have been committed so these cases are replayed on every
            future `cargo test` run, preventing regressions.

            **Next steps:**
            1. Review the failing test output in the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            2. Fix the underlying bug
            3. Keep the regression files — they guard against the bug returning

            ---
            *Generated by nightly-fuzz workflow*
          branch: nightly-fuzz-regressions
          delete-branch: true
          add-paths: |
            **/*.proptest-regressions
          labels: bug,testing

      - name: Fail if tests failed
        run: |
          status=$(cat cargo-test-status 2>/dev/null || echo 1)
          if [ "$status" -ne 0 ]; then
            echo "::error::Property test command failed with exit status $status — check test-output artifact and regression files"
            exit "$status"
          fi

  smoke-test:
    name: Docker Smoke Test (Pair Mode)
    runs-on: ubuntu-latest
    # Image build (cold cache) + rustfs bring-up + pair/cluster tests can exceed
    # 35 min on GitHub-hosted runners. Size this to the same cap as the fuzz job
    # so a slow build does not cancel the run before the smoke test completes.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install cqlsh
        run: pip install cqlsh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Download latest nightly .deb release
        id: nightly_deb
        uses: ./.github/actions/ferrosa-nightly-deb
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build smoke-test runtime image from nightly .deb
        run: |
          set -euo pipefail
          cp "${{ steps.nightly_deb.outputs.deb_path }}" tests/ferrosa.deb
          docker build -f tests/Dockerfile.nightly-deb -t ferrosa-smoke:latest tests/
          # Keep ferrosa.deb in place: docker-smoke.sh runs `docker compose up --build`
          # against docker-compose.yml, which uses tests/Dockerfile.smoke and needs
          # the .deb file as a build context. Deleting it here causes a cache miss and
          # "ferrosa.deb: not found" during the compose build.

      - name: Set up sccache (only when the musl fallback compiles)
        if: steps.nightly_deb.outputs.deb_path == ''
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Build x86_64 musl static ferrosa binary (fallback)
        # The smoke test needs a runtime image. We prefer the nightly .deb above.
        # This fallback is compiled only if the reusable download step somehow
        # misses; in normal scheduled runs the midnight build is always available.
        if: steps.nightly_deb.outputs.deb_path == ''
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl -p ferrosa
          cp target/x86_64-unknown-linux-musl/release/ferrosa tests/ferrosa
          strip tests/ferrosa
          docker build -f tests/Dockerfile.nightly-bin -t ferrosa-smoke:latest tests/
          # Keep the static binary in place for the same reason we keep the .deb.

      - name: Run Docker smoke test
        env:
          PAIR_CQL_TIMEOUT: 240
          COMPOSE_PARALLEL_LIMIT: 2
        run: |
          set -uo pipefail
          # Run with an explicit inner timeout so that if the smoke test hangs
          # we still reach the log-collection/upload steps and can diagnose why.
          timeout --kill-after=60s 3060 bash tests/docker-smoke.sh 2>&1 | tee docker-smoke-output.log
          status=${PIPESTATUS[0]}
          echo "$status" > docker-smoke-status
          exit 0
        continue-on-error: true

      - name: Collect Docker state and logs
        if: always()
        run: |
          docker compose ps > docker-compose-ps.log 2>&1 || true
          docker compose ps -a >> docker-compose-ps.log 2>&1 || true
          docker system df >> docker-compose-ps.log 2>&1 || true
          for service in node1 node2 node3 rustfs rustfs-init; do
            docker compose logs --tail 500 "$service" > "${service}.log" 2>&1 || true
          done

      - name: Upload Docker logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-smoke-logs
          path: |
            docker-compose-ps.log
            docker-smoke-output.log
            node1.log
            node2.log
            node3.log
            rustfs.log
            rustfs-init.log
          retention-days: 14

      - name: Fail if smoke test failed
        if: always()
        run: |
          status=$(cat docker-smoke-status 2>/dev/null || echo 1)
          if [ "$status" -ne 0 ]; then
            echo "::error::Docker smoke test failed or timed out with exit status $status — check docker-smoke-logs artifact"
            exit "$status"
          fi

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans 2>/dev/null || true

  race-stress-fly:
    name: Read-vs-compaction stress (shared-cpu Fly)
    runs-on: ubuntu-latest
    # Best-effort perf baseline on a throwaway shared-cpu Fly machine: the run is
    # inherently noisy and has been hitting the 45-min budget without emitting an
    # RS_RESULT marker (infra/duration flake, tracked in board task t_dfbc14f3).
    # continue-on-error so a Fly timeout/flake does not gate the nightly — the job
    # still runs and surfaces results; the real duration fix lives in t_dfbc14f3.
    continue-on-error: true
    # The stress binary is cross-compiled on the fast GitHub runner, then copied
    # into a throwaway shared-cpu Fly machine. The starved baseline is what we
    # want to test; compiling on that same starved VM was consuming the entire
    # 75-minute job budget and the test never completed (no RS_RESULT marker).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25

      - name: Install Cap'n Proto compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends capnproto

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Build race-stress test binary
        id: build
        run: |
          set -euo pipefail
          cargo test -p ferrosa-storage --features race-stress --release --lib --no-run
          # Find the libtest binary that contains the race-stress test.
          binary=$(find target/release/deps -maxdepth 1 -type f -executable -name 'ferrosa_storage-*' | head -n 1)
          if [ -z "$binary" ]; then
            echo "::error::Could not locate ferrosa-storage race-stress test binary"
            exit 1
          fi
          ls -lh "$binary"
          file "$binary"
          echo "binary=$PWD/$binary" >> "$GITHUB_OUTPUT"

      - name: Read-vs-compaction stress on a starved shared-cpu Fly machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLY_ORG: ${{ vars.FLY_ORG || 'personal' }}
          # shared-cpu on purpose: the throttled baseline starves the compaction
          # executor — that starvation is what surfaces the read-vs-compaction
          # race. A performance VM would NOT reproduce it. Use the 2x size (4 GB)
          # so the in-VM test doesn't OOM (shared-cpu-1x caps at 2 GB).
          VM: shared-cpu-2x
          VM_MEMORY: '4096'
          RACE_KEYS: '1000'
          RACE_READERS: '4'
          RACE_SECS: '300'
          RACE_FLUSH_EVERY: '50'
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::notice::FLY_API_TOKEN not set — skipping nightly Fly race-stress (provision it; see board task t_dfbc14f3)"
            exit 0
          fi
          curl -fsSL https://fly.io/install.sh | sh
          export FLYCTL_INSTALL="$HOME/.fly"
          export PATH="$FLYCTL_INSTALL/bin:$PATH"
          bash ci/race-stress-fly.sh "${{ steps.build.outputs.binary }}"
