name: Nightly Fuzz + Smoke Test

on:
  schedule:
    - cron: '0 3 * * *' # 3 AM UTC daily
  workflow_dispatch: # manual trigger

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write
  pull-requests: write

jobs:
  fuzz:
    name: Property Test Fuzzing (bounded)
    runs-on: ubuntu-latest
    # Sized so the WHOLE job (setup + both bounded fuzz steps + verdict) fits
    # under the cap and the run completes instead of being cancelled. Each fuzz
    # step is bounded by an inner `timeout` (wall-clock budget) BELOW its step
    # timeout, so it exits cleanly and the verdict step always runs.
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25

      - name: Install Cap'n Proto compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends capnproto

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build AssemblyScript UDF toolchain bundle
        # --all-features enables `asc-udf` + `live-infra-tests`, which run the
        # inline-AssemblyScript UDF tests for real against this bundle. Build it
        # (pinned asc version) so those tests run and pass rather than fail.
        run: bash ferrosa-udf/examples/asc-poc/build-bundle.sh /tmp/asc-host/asc-bundle.mjs

      - name: Run property tests (bounded 30-minute fuzz session)
        # Inner `timeout` (30 min) is the real bound; this step timeout is a
        # cushion above it so the step exits cleanly rather than being cancelled.
        timeout-minutes: 34
        env:
          # 10k cases is sized to finish within the 30-min budget on the runner
          # (so the session reports "all cases passed" rather than relying on the
          # timeout cutoff); the inner `timeout` below is the hard safety bound.
          PROPTEST_CASES: 10000
          FUZZ_BUDGET_SECS: 1800 # 30 min wall-clock fuzz budget (safety cap)
          FERROSA_ASC_BUNDLE: /tmp/asc-host/asc-bundle.mjs
          # Enables libtest's `--report-time` on the stable toolchain so the
          # uploaded test-output.log ranks every test by wall-clock duration
          # (`ok <1.234s>`). Only permits the unstable libtest flag; the code
          # uses no nightly features, so this does not change what is compiled.
          RUSTC_BOOTSTRAP: 1
        run: |
          set +e
          # --all-features so feature-gated property tests (e.g. the whole
          # `repair_fuzz` harness behind `test-generators`) are actually fuzzed
          # — without it they were silently skipped here. The trailing skips
          # mirror ci.yml's heavy/live-infra exclusions (they would never finish
          # at 50000 cases) and exclude the file-IO-heavy repair fuzz
          # (`fuzz-fileio`), which gets its own bounded step below.
          # Crate excludes + skip list mirror ci.yml's proven --all-features run
          # (jepsen/loadgen excluded; live-infra + heavy tests skipped by name);
          # the file-IO repair fuzz is skipped here and run in the step below.
          # Bound the fuzz to a wall-clock budget so the run COMPLETES (exit 0)
          # instead of being cancelled by the GH step/job timeout. `timeout`
          # returns 124 (SIGTERM at the budget) or 137 (SIGKILL after grace) —
          # both mean "fuzzed the full budget without a failing case" = success.
          # Any other non-zero is a real proptest failure and is surfaced.
          timeout --kill-after=30s "${FUZZ_BUDGET_SECS}" \
            cargo test --all-features --workspace --lib --tests \
              --exclude ferrosa-jepsen --exclude ferrosa-loadgen \
              -- -Z unstable-options --report-time \
                 --skip batch_atomicity --skip pause_resume --skip recovery_coordinator \
                 --skip cassandra_reads_compacted --skip compaction_end_to_end_pipeline \
                 --skip dep_wait_ordering --skip disk_fail_no_phantom \
                 --skip packet_reorder_linearizability --skip lwt_batch_atomicity_all \
                 --skip clock_skew_large_preaccept \
                 --skip binary_ \
                 --skip concurrent_write --skip many_flushes \
                 --skip flush_2000 --skip single_writer --skip write_flush_compact \
                 --skip reads_never_panic_on_arbitrary_content \
                 --skip corrupt_sstable_bytes_never_panic_never_oom \
                 --skip peak_resident_readers_within_cap --skip streaming_equals_single_pass \
                 --skip bounded_fetch_reassembles_to_single_pass \
                 --skip read_merge_is_lww_no_data_loss --skip digest_walk_is_deterministic \
            2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" = "124" ] || [ "$status" = "137" ]; then
            echo "::notice::fuzz budget (${FUZZ_BUDGET_SECS}s) elapsed with no failing case — treating as success"
            status=0
          fi
          echo "$status" > cargo-test-status
          exit 0
        continue-on-error: true

      - name: Run file-IO repair fuzz (bounded cases)
        # Inner `timeout` (8 min) is the real bound; this step timeout is a
        # cushion so the whole job stays under the job cap and the verdict runs.
        timeout-minutes: 12
        env:
          # Each case flushes many real on-disk SSTables, so this harness is
          # filesystem-bound — run it at a moderate case count, not 50000.
          PROPTEST_CASES: 512
          FILEIO_FUZZ_BUDGET_SECS: 480 # 8 min wall-clock budget
        run: |
          set +e
          timeout --kill-after=30s "${FILEIO_FUZZ_BUDGET_SECS}" \
            cargo test -p ferrosa-storage --features fuzz-fileio --test repair_fuzz \
            2>&1 | tee -a test-output.log
          status=${PIPESTATUS[0]}
          # Budget elapsed (124/137) = fuzzed without a failing case → success.
          if [ "$status" = "124" ] || [ "$status" = "137" ]; then
            echo "::notice::file-IO fuzz budget (${FILEIO_FUZZ_BUDGET_SECS}s) elapsed with no failing case — treating as success"
            status=0
          fi
          # Fold this run's status into the aggregate so a file-IO regression is
          # not lost; non-zero from either fuzz step marks the session failed.
          prev=$(cat cargo-test-status 2>/dev/null || echo 0)
          if [ "$status" != "0" ]; then echo "$status" > cargo-test-status; else echo "$prev" > cargo-test-status; fi
          exit 0
        continue-on-error: true

      - name: Check for regression files
        id: regressions
        run: |
          REGRESSION_FILES=$(find . -name '*.proptest-regressions' -not -path './target/*' 2>/dev/null)
          if [ -n "$REGRESSION_FILES" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "New regression files:"
            echo "$REGRESSION_FILES"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload regression files
        if: steps.regressions.outputs.found == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: proptest-regressions
          path: |
            **/*.proptest-regressions
            !target/**
          retention-days: 90

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-output
          path: test-output.log
          retention-days: 14

      - name: Create PR with regression files
        if: steps.regressions.outputs.found == 'true'
        continue-on-error: true
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: 'test: add proptest regression cases from nightly fuzz'
          title: 'Nightly fuzz: new proptest regression cases found'
          body: |
            The nightly fuzz session discovered new failing property test inputs.

            Regression files have been committed so these cases are replayed on every
            future `cargo test` run, preventing regressions.

            **Next steps:**
            1. Review the failing test output in the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            2. Fix the underlying bug
            3. Keep the regression files — they guard against the bug returning

            ---
            *Generated by nightly-fuzz workflow*
          branch: nightly-fuzz-regressions
          delete-branch: true
          add-paths: |
            **/*.proptest-regressions
          labels: bug,testing

      - name: Fail if tests failed
        run: |
          status=$(cat cargo-test-status 2>/dev/null || echo 1)
          if [ "$status" -ne 0 ]; then
            echo "::error::Property test command failed with exit status $status — check test-output artifact and regression files"
            exit "$status"
          fi

  smoke-test:
    name: Docker Smoke Test (Pair Mode)
    runs-on: ubuntu-latest
    # Was 10 min and timed out nightly (image build + 2-node bring-up + smoke
    # exceeds 10 min on the runner). Give it headroom to complete.
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install cqlsh
        run: pip install cqlsh

      - name: Run Docker smoke test
        env:
          PAIR_CQL_TIMEOUT: 180
        run: bash tests/docker-smoke.sh

      - name: Collect Docker logs on failure
        if: failure()
        run: |
          docker compose ps > docker-compose-ps.log 2>&1 || true
          for service in node1 node2 node3 rustfs rustfs-init; do
            if [ ! -s "${service}.log" ]; then
              docker compose logs "$service" > "${service}.log" 2>&1 || true
            fi
          done

      - name: Upload Docker logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-smoke-logs
          path: |
            docker-compose-ps.log
            node1.log
            node2.log
            node3.log
            rustfs.log
            rustfs-init.log
          retention-days: 14

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans 2>/dev/null || true

  race-stress-fly:
    name: Read-vs-compaction stress (shared-cpu Fly)
    runs-on: ubuntu-latest
    # The script provisions a throwaway shared-cpu Fly machine, builds with
    # --features race-stress, runs an RACE_SECS storm, and tears the app down.
    # Generous cap = build/boot headroom + the storm; the script self-destroys
    # the app via an EXIT trap even if this job is cancelled.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read-vs-compaction stress on a starved shared-cpu Fly machine
        env:
          # Only NEW secret required. If unset, the step skips cleanly (so the
          # nightly run is green until the secret is provisioned — see t_dfbc14f3).
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          # The repo-scoped job token can clone this private repo on the VM.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLY_ORG: ${{ vars.FLY_ORG || 'personal' }}
          BRANCH: ${{ github.ref_name }}
          # shared-cpu on purpose: the ~6.5% baseline starves the compaction
          # executor — that starvation is what surfaces the read-vs-compaction
          # race. A performance VM would NOT reproduce it.
          VM: shared-cpu-1x
          RACE_KEYS: '2000'
          RACE_READERS: '8'
          RACE_SECS: '600'
          RACE_FLUSH_EVERY: '50'
        run: |
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::notice::FLY_API_TOKEN not set — skipping nightly Fly race-stress (provision it; see board task t_dfbc14f3)"
            exit 0
          fi
          curl -fsSL https://fly.io/install.sh | sh
          export FLYCTL_INSTALL="$HOME/.fly"
          export PATH="$FLYCTL_INSTALL/bin:$PATH"
          bash ci/race-stress-fly.sh
