name: Install Smoke

# User-grade install smoke: builds the release artifact ONCE per OS, then runs
# the REAL install/install.sh exactly as a documented user would — NON-ROOT,
# isolated $HOME, the bundled config, the documented launch — on macOS (arm64)
# AND Linux. Covers fresh install, idempotent re-run, in-place upgrade that
# PRESERVES the data dir, and partial-install recovery; the memory job also
# installs ferrosa-memory and exercises ingest + search.
#
# Build/release/run split (12-factor): the `build` job compiles ferrosa + stages
# the tarball ONCE per OS and uploads it; `smoke` and `memory-smoke` DOWNLOAD that
# tarball and test it (the smoke job needs no Rust toolchain at all). This is the
# gate that was missing when issue #172 shipped.

on:
  # Runs from the trusted default-branch workflow. The author gate below is
  # therefore not editable by the pull request whose code will be tested.
  pull_request_target:
  push:
    branches: [main]
  workflow_call: {}   # so release.yml can gate publish on this

permissions:
  contents: read

concurrency:
  group: install-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SMOKE_VERSION: v0.0.0-smoke
  # Shared compilation cache (GitHub Actions backend) for the jobs that compile
  # (build, memory-smoke). The compile-free `smoke` job inherits these but never
  # invokes cargo, so RUSTC_WRAPPER is unused there.
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  CARGO_INCREMENTAL: "0"

jobs:
  # ── Compile ferrosa + stage the release tarball ONCE per OS ──────────────
  build:
    name: Build ferrosa tarball (${{ matrix.os }})
    # Only the runner owner's PRs may execute code on organization runners.
    if: github.event_name != 'pull_request_target' || github.event.pull_request.user.login == 'bkearns'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
          - os: macos-14
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
      # Kept defensive even though these jobs now run on HOSTED runners.
      #
      # They ran on self-hosted boxes until 2026-09-11, and a bare
      # `sudo apt-get install` failed there in 10 seconds, before any
      # compilation, on every run: that machine has no passwordless sudo and
      # already had the toolchain. On a hosted runner `sudo -n` simply
      # succeeds and this costs nothing — so the guard stays, and pointing
      # these jobs back at a self-hosted box cannot reintroduce that failure.
      #
      # So: use capnp if it is there, install it if we are allowed to, and say
      # exactly what is missing and where if neither is true. Never fail with
      # only apt's output to go on.
      - name: Install capnproto (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if command -v capnp >/dev/null 2>&1; then
            echo "capnp already present: $(capnp --version)"
            exit 0
          fi
          if sudo -n true 2>/dev/null; then
            sudo apt-get update && sudo apt-get install -y capnproto
          else
            echo "::error::capnp is not installed on runner '${RUNNER_NAME:-unknown}' and this"
            echo "::error::runner has no passwordless sudo, so this job cannot install it."
            echo "::error::Install it once on that machine: sudo apt-get install -y capnproto"
            exit 1
          fi
      - name: Install capnproto (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          if command -v capnp >/dev/null 2>&1; then
            echo "capnp already present: $(capnp --version)"
            exit 0
          fi
          brew install capnp
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: false
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Build ferrosa + ferrosa-ctl (release) and stage the tarball
        # Uses the SAME .github/scripts/stage-release-tarball.sh the real release
        # uses, so the smoke exercises the real artifact layout.
        run: |
          case "$(uname -s)/$(uname -m)" in
            Darwin/arm64) TARGET=aarch64-apple-darwin ;;
            Linux/x86_64) TARGET=x86_64-unknown-linux-gnu ;;
            *) echo "unsupported $(uname -s)/$(uname -m)"; exit 1 ;;
          esac
          cargo build --release --bin ferrosa --bin ferrosa-ctl
          # Ask where cargo actually wrote them rather than assuming
          # `target/release`: a `build.target` or `build.target-dir` in any
          # cargo config on the runner moves the output, and hardcoding the
          # path turns a successful build into "missing ferrosa binary".
          BIN_DIR="$(bash .github/scripts/resolve-release-bin-dir.sh "$TARGET")"
          echo "staging release binaries from $BIN_DIR"
          GITHUB_REF_NAME="$SMOKE_VERSION" bash .github/scripts/stage-release-tarball.sh "$TARGET" "$BIN_DIR"
      - name: Upload ferrosa tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ferrosa-tarball-${{ matrix.os }}
          path: dist/ferrosa-${{ env.SMOKE_VERSION }}-*.tar.gz
          retention-days: 7

  # ── Test the prebuilt artifact: ferrosa-only install (NO compile here) ───
  smoke:
    name: Install smoke (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
          - os: macos-14
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
      - name: Download the prebuilt ferrosa tarball
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ferrosa-tarball-${{ matrix.os }}
          path: prebuilt
      - name: Run the user-grade install smoke against the prebuilt tarball
        # Installs the tarball via the real install/install.sh (FERROSA_INSTALL_TARBALL)
        # and asserts the daemon starts / serves / keeps its data across upgrade —
        # failing loud on a panic, an unbound port, or a dropped data dir. No
        # toolchain needed: --ferrosa-tarball skips the in-script build.
        run: |
          TB="$(ls prebuilt/ferrosa-"$SMOKE_VERSION"-*.tar.gz)"
          bash tests/install_smoke.sh --ferrosa-tarball "$TB"

  # ── Test the prebuilt artifact: ferrosa + ferrosa-memory integration ─────
  # Reuses the SAME prebuilt ferrosa tarball; only ferrosa-memory is compiled
  # here. Separate from `smoke` so the critical install gate stays robust even if
  # the cross-repo build hiccups.
  memory-smoke:
    name: Install smoke + ferrosa-memory (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
          - os: macos-14
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
      # memory-public is NOT TO BE USED: this job compiles ferrosa-memory from
      # source, so it builds the real repo, ferrosadb/ferrosa-memory-private.
      # That repo is private and the default github.token cannot read it, so
      # the checkout needs FERROSA_COMPONENTS_TOKEN. Say so by name when it is
      # missing, rather than letting checkout fail with "repository not found".
      - name: Require FERROSA_COMPONENTS_TOKEN
        env:
          COMPONENTS_TOKEN: ${{ secrets.FERROSA_COMPONENTS_TOKEN }}
        run: |
          if [ -z "$COMPONENTS_TOKEN" ]; then
            echo "::error::secret FERROSA_COMPONENTS_TOKEN is not set on ferrosadb/ferrosa (or was not passed to this workflow)."
            echo "::error::It must be a token that can read ferrosadb/ferrosa-memory-private; without it this job cannot check out the memory source."
            exit 1
          fi
      - name: Checkout ferrosa-memory
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ferrosadb/ferrosa-memory-private
          path: ferrosa-memory
          token: ${{ secrets.FERROSA_COMPONENTS_TOKEN }}
          # The build steps that follow run PR code; do not leave the token in
          # ferrosa-memory/.git/config for them to read.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
      # Kept defensive even though these jobs now run on HOSTED runners.
      #
      # They ran on self-hosted boxes until 2026-09-11, and a bare
      # `sudo apt-get install` failed there in 10 seconds, before any
      # compilation, on every run: that machine has no passwordless sudo and
      # already had the toolchain. On a hosted runner `sudo -n` simply
      # succeeds and this costs nothing — so the guard stays, and pointing
      # these jobs back at a self-hosted box cannot reintroduce that failure.
      #
      # So: use capnp if it is there, install it if we are allowed to, and say
      # exactly what is missing and where if neither is true. Never fail with
      # only apt's output to go on.
      - name: Install capnproto (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if command -v capnp >/dev/null 2>&1; then
            echo "capnp already present: $(capnp --version)"
            exit 0
          fi
          if sudo -n true 2>/dev/null; then
            sudo apt-get update && sudo apt-get install -y capnproto
          else
            echo "::error::capnp is not installed on runner '${RUNNER_NAME:-unknown}' and this"
            echo "::error::runner has no passwordless sudo, so this job cannot install it."
            echo "::error::Install it once on that machine: sudo apt-get install -y capnproto"
            exit 1
          fi
      - name: Install capnproto (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          if command -v capnp >/dev/null 2>&1; then
            echo "capnp already present: $(capnp --version)"
            exit 0
          fi
          brew install capnp
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: false
      - name: Download the prebuilt ferrosa tarball
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ferrosa-tarball-${{ matrix.os }}
          path: prebuilt
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Run install smoke with the ferrosa-memory integration
        # Reuses the prebuilt ferrosa tarball (--ferrosa-tarball); only
        # ferrosa-memory-mcp is compiled in this job.
        run: |
          TB="$(ls prebuilt/ferrosa-"$SMOKE_VERSION"-*.tar.gz)"
          bash tests/install_smoke.sh --with-memory --ferrosa-tarball "$TB" \
            --memory-repo "$GITHUB_WORKSPACE/ferrosa-memory"
