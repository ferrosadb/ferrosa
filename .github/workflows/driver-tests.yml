name: Driver Smoke Tests

# Run all multi-language CQL driver tests whenever driver code, the Dockerfile,
# or the CQL layer changes. Builds the Ferrosa image from source, spins up
# RustFS (S3), and runs Python / Go / Node / Java / C# / Rust against it.
#
# Override the container runtime:
#   CONTAINER_RUNTIME=podman ./tests/drivers/run-all.sh

on:
  push:
    branches: [main]
  pull_request:
    # Path filter keeps cheap PRs (docs-only, specs-only) from spending
    # ~15 min of CI on the multi-language driver matrix.
    paths:
      - 'ferrosa-cql/**'
      - 'ferrosa-schema/**'
      - 'ferrosa-net/**'
      - 'ferrosa/**'
      - 'tests/drivers/**'
      - 'Dockerfile'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/driver-tests.yml'
  schedule:
    - cron: '30 3 * * *'  # 3:30 AM UTC daily (after nightly-fuzz at 3:00)
  workflow_dispatch:  # manual trigger

env:
  CARGO_TERM_COLOR: always

jobs:
  driver-smoke:
    name: Driver Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      - name: Reuse prebuilt node image from GHCR if available
        # ci.yml's build-node-image job compiles the release binary once and
        # pushes it by commit SHA. Reuse it instead of recompiling in Docker.
        # The two workflows run in parallel, so poll briefly; fall back to a
        # local build (run-all.sh) if it never appears (e.g. fork PRs).
        continue-on-error: true
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/ferrosa-test-node:${{ github.sha }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || exit 0
          for i in $(seq 1 30); do
            if docker pull "$IMAGE" 2>/dev/null; then
              docker tag "$IMAGE" ferrosa-test-node:latest
              echo "Reusing prebuilt image $IMAGE (skipping in-Docker build)."
              exit 0
            fi
            echo "waiting for prebuilt image ($i/30)..."
            sleep 20
          done
          echo "Prebuilt image not available; run-all.sh will build from source."

      - name: Run all language driver smoke tests
        run: |
          mkdir -p /tmp/driver-logs
          bash tests/drivers/run-all.sh 2>&1 | tee /tmp/driver-logs/run-all.log
          exit ${PIPESTATUS[0]}
        timeout-minutes: 20

      - name: Collect driver test logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/driver-logs
          docker compose -f tests/drivers/docker-compose.drivers.yml logs 2>/dev/null \
            > /tmp/driver-logs/compose.log || true

      - name: Upload driver test logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: driver-test-logs-${{ matrix.os }}
          path: /tmp/driver-logs/
          retention-days: 7
