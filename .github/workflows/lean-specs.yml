name: Lean specs

# The corpus is a specification, so a green build is not the test: `lake exe harness` is. It runs every
# invariant predicate over its enumerated case space and fails when a ledger obligation has no harness
# or a harness has no obligation. Without this job the corpus can drift from the obligations it names
# while still compiling.

on:
  pull_request:
    paths:
      - "specs/lean4/**"
      - "docs/unsafe-*.md"
      - "tests/ci/test_unsafe_ledger.py"
      - ".github/workflows/lean-specs.yml"
  push:
    branches: [main]
    paths:
      - "specs/lean4/**"
  workflow_dispatch:

concurrency:
  group: lean-specs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  specs:
    name: Build and run the harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Toolchain
        working-directory: specs/lean4
        run: |
          cat lean-toolchain
          lean --version

      # No Mathlib and no cache dependency: the corpus is core Lean only, and a cold build is the
      # honest signal that it still is.
      - name: Build the corpus
        working-directory: specs/lean4
        run: lake build

      - name: Run the invariant harness
        working-directory: specs/lean4
        run: lake exe harness

      - name: Check the unsafe ledger matches the source
        run: python3 -m unittest -q tests.ci.test_unsafe_ledger
