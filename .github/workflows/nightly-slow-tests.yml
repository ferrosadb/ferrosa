name: Nightly Slow Tests

# The tests that PR CI skips, plus the cluster-gated tests PR CI runs itself.
#
# Two different categories land here, for two different reasons:
#
# * SLOW tests — randomized external-sort spills, a compaction soak over many
#   seeds, high-volume ingest, a 2k-mutation commit-log replay, wide-partition
#   paging — each take 60-90 seconds. They are worth having and not worth
#   paying for on every push, so they live in a `mod slow` gated behind the
#   `slow-tests` crate feature (never `#[ignore]` — ferrosa/CLAUDE.md forbids
#   ignoring a test for being slow). PR CI compiles them (`--all-features`)
#   but skips running them (`--skip ::slow::`); this workflow is where they run.
# * CLUSTER-GATED tests — genuinely need a live 3-node cluster, not merely
#   slow. They stay `#[ignore]`d and PR CI's `integration` job already runs
#   them against a real cluster; this workflow re-runs the same `--ignored`
#   selection nightly for the same reason it re-runs everything else.
#
# This job is the other half of the slow-tests bargain. Gating a slow test
# without a nightly that runs it does not make it cheap, it deletes it: the
# test still exists, still looks like coverage in the file, and never executes
# again. If this workflow is removed or left red, re-run those tests some
# other way or drop the `slow-tests` gate.
#
# Run one locally with:
#   cargo test -p ferrosa-storage --features slow-tests -- ::slow::e4_slow_pitr_commit_log_replay_1k_plus_1k

on:
  schedule:
    - cron: '0 4 * * *' # 4 AM UTC daily, before the 5 AM sim sweep
  workflow_dispatch: # so a change to a slow test can be checked without waiting a day

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

jobs:
  # Release-shaped build (default features), same as PR CI's build-node-image:
  # the image is the binary the cluster runs, not the test build.
  build-node-image:
    name: Build node image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: node-image
          save-if: ${{ github.ref == 'refs/heads/main' && runner.environment == 'github-hosted' }}
      - name: Install capnproto
        run: sudo apt-get update && sudo apt-get install -y capnproto
      - name: Build the node image
        run: |
          set -euo pipefail
          cargo build --release -p ferrosa -p ferrosa-ctl
          mkdir -p node-bin
          cp target/release/ferrosa target/release/ferrosa-ctl node-bin/
          cat > node-bin/Dockerfile <<'DEOF'
          FROM downloads.ferrosa.ai/debian@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a
          RUN apt-get update && apt-get install -y --no-install-recommends \
                  ca-certificates gdb procps \
              && rm -rf /var/lib/apt/lists/*
          COPY ferrosa /usr/local/bin/ferrosa
          COPY ferrosa-ctl /usr/local/bin/ferrosa-ctl
          EXPOSE 9042 7000 9090 7474 7687
          ENV FERROSA_DATA_DIR=/var/lib/ferrosa
          CMD ["ferrosa"]
          DEOF
          for attempt in 1 2 3 4; do
            docker build -t ferrosa-test-node:latest node-bin && break
            [ "$attempt" = 4 ] && { echo "docker build failed after 4 attempts"; exit 1; }
            echo "docker build attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          docker save ferrosa-test-node:latest | gzip > ferrosa-node-image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ferrosa-node-image
          path: ferrosa-node-image.tar.gz
          retention-days: 1

  slow-tests:
    needs: build-node-image
    name: Ignored (slow) tests
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
      - name: Install capnproto
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y capnproto libunwind-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && runner.environment == 'github-hosted' }}

      # The nightly is the most thorough run there is: everything PR CI runs, plus
      # everything PR CI skips. So it never skips a test and never runs a
      # narrower selection than PR CI does.
      #
      # The cluster-gated `#[ignore]` tests need the 3-node cluster, so this job
      # builds the node image and brings the cluster up exactly as PR CI's
      # `Cluster integration tests` job does. It used to run them with no
      # cluster and failed every night from at least 2026-09-14, on
      # `fts_match_returns_flushed_row_from_each_live_cluster_node`. Skipping
      # them would have hidden that instead of fixing it.
      # tests/ci/test_ignored_test_partition.py pins this: no --skip, cluster up
      # before the tests, teardown always, --no-fail-fast, same package selection.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/.ghcup /usr/local/share/boost \
            /usr/share/swift || true
          df -h /
      - name: Download prebuilt node image
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ferrosa-node-image
          path: .
      - name: Load node image into Docker
        run: docker load < ferrosa-node-image.tar.gz
      - name: Bring up cluster
        run: |
          ./scripts/test-cluster-up-ci.sh > /tmp/cluster-env
          cat /tmp/cluster-env >> "$GITHUB_ENV"

      # The `slow-tests` feature tests are compiled under --all-features in PR
      # CI too, but PR CI's "Run tests" step passes `--skip ::slow::` — this is
      # the only place they actually run. --exclude matches PR CI's package
      # selection so the nightly is at least as thorough, never narrower.
      #
      # --no-fail-fast: without it cargo stops at the first failing test binary
      # and the rest of the run is never reported.
      - name: Run the slow tests
        env:
          FERROSA_TEST_CONTAINERS: "1"
        run: |
          cargo test --workspace --all-targets --all-features --no-fail-fast \
            --exclude ferrosa-jepsen --exclude ferrosa-loadgen \
            -- ::slow::

      # `--ignored` runs ONLY the cluster-gated tests, the same set PR CI's
      # `integration` job runs against its own cluster. Nothing here re-runs
      # the fast suite; that already ran on the commit that produced this tree.
      #
      # jepsen and loadgen are excluded exactly as PR CI excludes them; they run
      # in their own workflows (Elle, Multi-DC Jepsen).
      - name: Run the ignored (cluster-gated) tests
        env:
          FERROSA_TEST_CONTAINERS: "1"
        run: |
          cargo test --workspace --all-targets --all-features --no-fail-fast \
            --exclude ferrosa-jepsen --exclude ferrosa-loadgen \
            -- --ignored

      - name: Collect cluster logs on failure
        if: failure()
        run: |
          docker compose \
            -f tests/docker-compose.cluster.yml \
            --project-name ferrosa-test-ci \
            logs --no-color 2>/dev/null | tail -500 || true
      - name: Tear down cluster
        if: always()
        run: ./scripts/test-cluster-down.sh --ci

      # A nightly that silently stops selecting anything is the failure mode
      # this whole arrangement is exposed to: rename a test, drop the
      # `slow-tests` gate or an `#[ignore]`, and the job goes green having run
      # nothing at all. Each selection is checked separately with the same
      # flags its run used, so either going quiet is caught on its own.
      - name: Fail if no slow or ignored tests were selected
        if: always()
        run: |
          set -euo pipefail
          slow_count=$(cargo test --workspace --all-targets --all-features \
                    --exclude ferrosa-jepsen --exclude ferrosa-loadgen \
                    -- ::slow:: --list 2>/dev/null \
                  | grep -c ': test$' || true)
          echo "slow tests selected: $slow_count"
          if [ "$slow_count" -eq 0 ]; then
            echo "::error::No slow-tests were found. Either the slow-tests feature gate was"
            echo "::error::removed (so PR CI is paying for them again) or this job is"
            echo "::error::selecting nothing and reporting success for doing no work."
            exit 1
          fi

          ignored_count=$(cargo test --workspace --all-targets --all-features \
                    --exclude ferrosa-jepsen --exclude ferrosa-loadgen \
                    -- --ignored --list 2>/dev/null \
                  | grep -c ': test$' || true)
          echo "ignored tests selected: $ignored_count"
          if [ "$ignored_count" -eq 0 ]; then
            echo "::error::No ignored (cluster-gated) tests were found. Either the #[ignore]"
            echo "::error::gates were removed (so PR CI is paying for them again) or this job"
            echo "::error::is selecting nothing and reporting success for doing no work."
            exit 1
          fi
