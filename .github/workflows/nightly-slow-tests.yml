name: Nightly Slow Tests

# The tests that PR CI skips.
#
# A handful of tests take 60-90 seconds each — randomized external-sort spills,
# a compaction soak over many seeds, high-volume ingest, a 2k-mutation
# commit-log replay, wide-partition paging. They are worth having and they are
# not worth paying for on every push, so they carry
# `#[ignore = "slow (...); runs in the nightly --ignored job"]` and run here.
#
# This job is the other half of that bargain. Gating a slow test without a
# nightly that runs it does not make it cheap, it deletes it: the test still
# exists, still looks like coverage in the file, and never executes again.
# If this workflow is removed or left red, re-run those tests some other way
# or drop the `#[ignore]`s.
#
# Run one locally with:
#   cargo test -p ferrosa-storage -- --ignored e4_slow_pitr_commit_log_replay_1k_plus_1k

on:
  schedule:
    - cron: '0 4 * * *' # 4 AM UTC daily, before the 5 AM sim sweep
  workflow_dispatch: # so a change to a slow test can be checked without waiting a day

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

jobs:
  # Release-shaped build (default features), same as PR CI's build-node-image:
  # the image is the binary the cluster runs, not the test build.
  build-node-image:
    name: Build node image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: node-image
          save-if: ${{ github.ref == 'refs/heads/main' && runner.environment == 'github-hosted' }}
      - name: Install capnproto
        run: sudo apt-get update && sudo apt-get install -y capnproto
      - name: Build the node image
        run: |
          set -euo pipefail
          cargo build --release -p ferrosa -p ferrosa-ctl
          mkdir -p node-bin
          cp target/release/ferrosa target/release/ferrosa-ctl node-bin/
          cat > node-bin/Dockerfile <<'DEOF'
          FROM debian:trixie-slim
          RUN apt-get update && apt-get install -y --no-install-recommends \
                  ca-certificates gdb procps \
              && rm -rf /var/lib/apt/lists/*
          COPY ferrosa /usr/local/bin/ferrosa
          COPY ferrosa-ctl /usr/local/bin/ferrosa-ctl
          EXPOSE 9042 7000 9090 7474 7687
          ENV FERROSA_DATA_DIR=/var/lib/ferrosa
          CMD ["ferrosa"]
          DEOF
          for attempt in 1 2 3 4; do
            docker build -t ferrosa-test-node:latest node-bin && break
            [ "$attempt" = 4 ] && { echo "docker build failed after 4 attempts"; exit 1; }
            echo "docker build attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          docker save ferrosa-test-node:latest | gzip > ferrosa-node-image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ferrosa-node-image
          path: ferrosa-node-image.tar.gz
          retention-days: 1

  slow-tests:
    needs: build-node-image
    name: Ignored (slow) tests
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
      - name: Install capnproto
        run: |
          set -euo pipefail
          if command -v capnp >/dev/null 2>&1; then
            echo "capnp already present: $(capnp --version)"
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y capnproto
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && runner.environment == 'github-hosted' }}

      # The nightly is the most thorough run there is: everything PR CI runs, plus
      # everything PR CI skips. So it never skips a test and never runs a
      # narrower selection than PR CI does.
      #
      # The cluster-gated `#[ignore]` tests need the 3-node cluster, so this job
      # builds the node image and brings the cluster up exactly as PR CI's
      # `Cluster integration tests` job does. It used to run them with no
      # cluster and failed every night from at least 2026-09-14, on
      # `fts_match_returns_flushed_row_from_each_live_cluster_node`. Skipping
      # them would have hidden that instead of fixing it.
      # tests/ci/test_ignored_test_partition.py pins this: no --skip, cluster up
      # before the tests, teardown always, --no-fail-fast, same package selection.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/.ghcup /usr/local/share/boost \
            /usr/share/swift || true
          df -h /
      - name: Download prebuilt node image
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ferrosa-node-image
          path: .
      - name: Load node image into Docker
        run: docker load < ferrosa-node-image.tar.gz
      - name: Bring up cluster
        run: |
          ./scripts/test-cluster-up-ci.sh > /tmp/cluster-env
          cat /tmp/cluster-env >> "$GITHUB_ENV"

      # `--ignored` runs ONLY the ignored tests, which is exactly the set PR CI
      # skipped plus the cluster-gated set. Nothing here re-runs the fast suite;
      # that already ran on the commit that produced this tree.
      #
      # jepsen and loadgen are excluded exactly as PR CI excludes them; they run
      # in their own workflows (Elle, Multi-DC Jepsen).
      #
      # --no-fail-fast: without it cargo stops at the first failing test binary
      # and the rest of the run is never reported.
      - name: Run the ignored (slow) tests
        env:
          FERROSA_TEST_CONTAINERS: "1"
        run: |
          cargo test --workspace --all-targets --all-features --no-fail-fast \
            --exclude ferrosa-jepsen --exclude ferrosa-loadgen \
            -- --ignored

      - name: Collect cluster logs on failure
        if: failure()
        run: |
          docker compose \
            -f tests/docker-compose.cluster.yml \
            --project-name ferrosa-test-ci \
            logs --no-color 2>/dev/null | tail -500 || true
      - name: Tear down cluster
        if: always()
        run: ./scripts/test-cluster-down.sh --ci

      # A nightly that silently stops selecting anything is the failure mode
      # this whole arrangement is exposed to: rename a test, drop an
      # `#[ignore]`, and the job goes green having run nothing at all.
      - name: Fail if no ignored tests were selected
        if: always()
        run: |
          set -euo pipefail
          count=$(cargo test --workspace --all-targets --all-features \
                    --exclude ferrosa-jepsen --exclude ferrosa-loadgen \
                    -- --ignored --list 2>/dev/null \
                  | grep -c ': test$' || true)
          echo "ignored tests selected: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::No ignored tests were found. Either the #[ignore] gates were"
            echo "::error::removed (so PR CI is paying for them again) or this job is"
            echo "::error::selecting nothing and reporting success for doing no work."
            exit 1
          fi
