name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter on PRs: run the full suite on EVERY pull request,
  # including stacked PRs whose base is another feature branch (a PR "train").
  # With `branches: [main]` these were skipped entirely — only the
  # path-filtered Driver Smoke ran — so stacked PRs went unexercised.
  pull_request:
  # Run in the merge queue too: when a PR is queued, GitHub builds a temporary
  # `merge_group` ref (the PR rebased on the latest main + entries ahead of it)
  # and these checks must report on it for the queue to merge. Without this
  # trigger the queue's required checks never run and entries would stall.
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Shared compilation cache across all jobs AND runs, via the GitHub Actions
  # cache backend. Each COMPILE job runs the sccache-action step (installs +
  # starts the server); clippy/test/jepsen/musl/node-image otherwise cold-compile
  # ~the same workspace independently. The fmt job inherits these too but never
  # compiles, so RUSTC_WRAPPER is unused there. CARGO_INCREMENTAL=0 because
  # incremental compilation bypasses sccache.
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  CARGO_INCREMENTAL: "0"

jobs:
  # ── Stage 1: Format + Lint (fast feedback) ──────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
        with:
          components: rustfmt
      - run: cargo fmt --check
      - name: Check Cluster Data Loss workflow contract
        run: python3 -m unittest tests.ci.test_cluster_data_loss_workflow

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
        with:
          components: clippy
      - name: Install capnproto
        run: sudo apt-get update && sudo apt-get install -y capnproto
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - run: cargo clippy --all-targets -- -D warnings
      - name: Guard against unbounded materializing reads
        run: python3 scripts/check-unbounded-reads.py
      - name: P0 OOM guard — AST read-path materialization audit
        # AST-based (syn) audit: bans Vec materialization / capped reads on scan
        # paths. Passes today via specs/p0-oom-guard/oom-audit-allow.toml; --today
        # is the run date so expired allow entries (the t_15417b35 migration
        # deadline) start failing the gate and force the streaming fix.
        run: cargo run --quiet -p xtask -- p0-oom-audit --enforce --today "$(date -u +%F)"

  # ── Stage 2: Tests ──────────────────────────────────────────────────
  test:
    name: Test + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
      - name: Install capnproto
        run: sudo apt-get update && sudo apt-get install -y capnproto
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: false
      - name: Free disk space
        # The --all-features debug test build alone exceeds 30GB of target
        # artifacts; the old reclaim (dotnet/android/ghc ≈ 11GB) still left
        # runners hitting ENOSPC and SIGBUS-in-ld (t_9291a8dd — 4 flakes in
        # 2 days). Reclaim the tool cache too and report before/after so any
        # recurrence is diagnosable from the log.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/.ghcup /usr/local/share/boost \
            /usr/share/swift || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h /
      - name: Build AssemblyScript UDF toolchain bundle
        # `--all-features` enables `asc-udf` + `live-infra-tests`, which run the
        # inline-AssemblyScript UDF tests for real against this bundle. Build it
        # (pinned asc version) so those tests run and pass rather than being skipped.
        run: bash ferrosa-udf/examples/asc-poc/build-bundle.sh /tmp/asc-host/asc-bundle.mjs
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Run tests
        env:
          FERROSA_ASC_BUNDLE: /tmp/asc-host/asc-bundle.mjs
          # Line-tables-only debuginfo for test binaries: the dominant disk cost
          # in this job. Keeps usable panic backtraces; halves target size.
          CARGO_PROFILE_DEV_DEBUG: "1"
        run: |
          # The trailing `--skip <fuzz prop>` flags exclude the file-IO-heavy
          # repair fuzz harness (ferrosa-storage `fuzz-fileio` feature, on under
          # --all-features) from the per-PR gate; it runs deeply in
          # nightly-fuzz.yml. Add new tests/repair_fuzz.rs properties to both.
          # `accord::perf_regression` asserts ABSOLUTE wall-clock bounds (e.g.
          # a 1000-message ReorderBuffer drain under 10 ms). On a contended
          # shared runner — especially a merge-group build running several jobs
          # at once — that measures the runner, not the code: it was observed at
          # 52.8 ms and ejected a DOCS-ONLY PR from the merge queue
          # (forge t_430e21f7). The thresholds are UNCHANGED and still enforced,
          # nightly, in nightly-fuzz.yml's `perf-regression` job where the
          # machine is not competing with the rest of the PR gate. Keep the two
          # in sync: a new perf assertion added here must run there.
          cargo test --all-features --workspace --lib --tests \
            --exclude ferrosa-jepsen --exclude ferrosa-loadgen \
            -- --skip accord::perf_regression --skip batch_atomicity --skip pause_resume --skip recovery_coordinator \
               --skip cassandra_reads_compacted --skip compaction_end_to_end_pipeline \
               --skip dep_wait_ordering --skip disk_fail_no_phantom \
               --skip lwt_batch_atomicity_all \
               --skip clock_skew_large_preaccept \
               --skip binary_ \
               --skip concurrent_write --skip many_flushes \
               --skip flush_2000 --skip single_writer --skip write_flush_compact \
               --skip reads_never_panic_on_arbitrary_content \
               --skip corrupt_sstable_bytes_never_panic_never_oom \
               --skip peak_resident_readers_within_cap --skip streaming_equals_single_pass \
               --skip bounded_fetch_reassembles_to_single_pass \
               --skip read_merge_is_lww_no_data_loss --skip digest_walk_is_deterministic \
               --skip differential_oracle \
               --skip fly_multi_node_streaming_scan \
               --skip real_typed_edges_paged_scan_delivers_every_distinct_row \
               --skip count_range_metadata_merger_dedups_real_typed_edges_sstables \

  # ── Stage 2a': Differential oracle vs real PostgreSQL ──────────────
  # The `test` job above skips `differential_oracle` because it has no
  # container runtime; this dedicated job runs it against a real postgres:16
  # (started by the test harness via the runner's docker), comparing the
  # ferrosa Postgres front-end's SELECT/DML semantics to PostgreSQL.
  postgres-oracle:
    name: Differential Oracle (vs PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
      - name: Install capnproto
        run: sudo apt-get update && sudo apt-get install -y capnproto
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: false
      - name: Verify docker is available
        run: docker --version
      - name: Pre-pull postgres:16
        run: docker pull postgres:16
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Run differential oracle (corpus + restricted-query + DML)
        env:
          FERROSA_TEST_CONTAINERS: "1"
          # Pin the runtime: the harness prefers podman when it is on PATH, but
          # this job verifies and pre-pulls with docker. ubuntu-latest runners
          # ship both, and their podman/crun setup is not guaranteed to work.
          FERROSA_CONTAINER_RUNTIME: docker
        run: |
          cargo test -p ferrosa-postgres --features live-infra-tests \
            --test differential_oracle -- --test-threads=1 --nocapture

  # ── Stage 2b: Musl static build ───────────────────────────────────
  musl:
    name: Static Build (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: musl
      - name: Install musl tools and capnproto
        run: sudo apt-get update && sudo apt-get install -y musl-tools capnproto
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Build static binary
        run: cargo build --release --target x86_64-unknown-linux-musl -p ferrosa -p ferrosa-ctl --features ferrosa/full
      - name: Verify statically linked
        run: |
          file target/x86_64-unknown-linux-musl/release/ferrosa
          file target/x86_64-unknown-linux-musl/release/ferrosa | grep -qE "statically linked|static-pie linked|static"
          echo "Binary size: $(du -h target/x86_64-unknown-linux-musl/release/ferrosa | cut -f1)"
      - name: Strip and report
        run: |
          strip target/x86_64-unknown-linux-musl/release/ferrosa
          strip target/x86_64-unknown-linux-musl/release/ferrosa-ctl
          echo "Stripped ferrosa: $(du -h target/x86_64-unknown-linux-musl/release/ferrosa | cut -f1)"
          echo "Stripped ferrosa-ctl: $(du -h target/x86_64-unknown-linux-musl/release/ferrosa-ctl | cut -f1)"
      - name: Upload musl binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ferrosa-musl-static
          path: |
            target/x86_64-unknown-linux-musl/release/ferrosa
            target/x86_64-unknown-linux-musl/release/ferrosa-ctl
          retention-days: 14

  # ── Build the runtime node image ONCE (12-factor build/release/run) ──
  # Compile the glibc release binary exactly once (cached via rust-cache; glibc
  # for allocator performance — musl's allocator is slow, so the static musl
  # binary above is only for distribution, not for the test node). Package it
  # into an immutable `ferrosa-test-node:latest` image saved as an artifact. The
  # cluster-integration and driver-smoke jobs RUN that artifact instead of
  # recompiling the release binary inside Docker (previously done twice/run).
  build-node-image:
    name: Build node image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: node-image
      - name: Install capnproto
        run: sudo apt-get update && sudo apt-get install -y capnproto
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Build glibc release binary (once)
        run: cargo build --release -p ferrosa -p ferrosa-ctl
      - name: Package into a thin runtime image
        run: |
          mkdir -p node-bin
          cp target/release/ferrosa target/release/ferrosa-ctl node-bin/
          cat > node-bin/Dockerfile <<'DEOF'
          FROM debian:trixie-slim
          RUN apt-get update && apt-get install -y --no-install-recommends \
                  ca-certificates gdb procps \
              && rm -rf /var/lib/apt/lists/*
          COPY ferrosa /usr/local/bin/ferrosa
          COPY ferrosa-ctl /usr/local/bin/ferrosa-ctl
          EXPOSE 9042 7000 9090 7474 7687
          ENV FERROSA_DATA_DIR=/var/lib/ferrosa
          CMD ["ferrosa"]
          DEOF
          # Retry: pulling the debian:trixie-slim base from Docker Hub
          # intermittently times out (registry-1.docker.io i/o timeout), which
          # fails the job and DROPS the PR from the merge queue. A bounded retry
          # rides out the transient registry blip (see forge t_75ec87fd).
          for attempt in 1 2 3 4; do
            docker build -t ferrosa-test-node:latest node-bin && break
            [ "$attempt" = 4 ] && { echo "docker build failed after 4 attempts"; exit 1; }
            echo "docker build attempt $attempt failed (likely Docker Hub base-image pull); retrying in $((attempt * 10))s…"
            sleep $((attempt * 10))
          done
          docker save ferrosa-test-node:latest | gzip > ferrosa-node-image.tar.gz
      - name: Push image to GHCR (cross-workflow reuse)
        # Lets the separate, path-filtered driver-smoke workflow and paired
        # repositories pull this image by commit SHA instead of recompiling.
        # Pull-request workflows run on a synthetic merge SHA, while a paired
        # repository resolves this branch's head SHA, so publish both tags.
        # Best-effort: fork PRs lack packages:write, so consumers fall back to
        # building.
        continue-on-error: true
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/ferrosa-test-node"
          MERGE_SHA="${{ github.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for SHA in "$MERGE_SHA" "$HEAD_SHA"; do
            [ -n "$SHA" ] || continue
            docker tag ferrosa-test-node:latest "$IMAGE:$SHA"
            docker push "$IMAGE:$SHA"
          done
      - name: Upload node image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ferrosa-node-image
          path: ferrosa-node-image.tar.gz
          retention-days: 14

  # ── Stage 2.5: Jepsen smoke tier (Sprint 2 W2.13) ──────────────────
  # Lifts the `--exclude ferrosa-jepsen` from this dedicated job so the
  # structural-invariant + topology nemesis suite runs on every PR.
  # Other CI jobs (`test`, `musl`, `examples`) keep the exclusion because
  # they don't have Docker.
  jepsen-smoke:
    name: Jepsen Smoke Tier
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
      - name: Install capnproto
        run: sudo apt-get update && sudo apt-get install -y capnproto
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: false
          key: jepsen-smoke
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /
      - name: Verify docker is available
        run: docker --version && docker compose version
      - name: Pre-pull the Jepsen compose images
        run: |
          docker pull rustfs/rustfs:latest
          docker pull minio/mc
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Run Jepsen smoke tier
        env:
          FERROSA_TEST_CONTAINERS: "1"
        run: |
          # Smoke tier: run the unit-level + structural-invariant +
          # topology-nemesis tests inside ferrosa-jepsen. The container
          # provisioning tests are gated on FERROSA_TEST_CONTAINERS so
          # they panic loudly without the env var instead of silently
          # passing.
          cargo test -p ferrosa-jepsen --lib \
            -- --skip orchestrator_docker_cluster_provision \
               --skip orchestrator_cluster_teardown \
               --skip rust_driver_connects_to_cluster \
               --skip provision_t1_cluster \
               --skip provision_single_vm \
               --skip ssh_execute_command \
               --skip ssh_upload_file
          # Workflow shape assertions live in the integration tests.
          cargo test -p ferrosa-jepsen --test ci_workflow

  # ── Stage 2c: Example CQL tests (reuses musl binary) ───────────────
  examples:
    name: Example CQL Scripts
    runs-on: ubuntu-latest
    needs: musl
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download musl binary
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ferrosa-musl-static
          path: /tmp/ferrosa-bin

      - name: Build lightweight Docker image from musl binary
        run: |
          chmod +x /tmp/ferrosa-bin/ferrosa
          cat > /tmp/Dockerfile.ci <<'DEOF'
          FROM debian:trixie-slim
          RUN apt-get update && apt-get install -y ca-certificates && rm -rf /var/lib/apt/lists/*
          COPY ferrosa /usr/local/bin/
          EXPOSE 9042 17000 9090
          ENV FERROSA_DATA_DIR=/var/lib/ferrosa
          CMD ["ferrosa"]
          DEOF
          # Retry: the debian:trixie-slim base pull from Docker Hub
          # intermittently times out and fails the job (dropping the PR from the
          # merge queue). A bounded retry rides it out (see forge t_75ec87fd).
          for attempt in 1 2 3 4; do
            docker build -t ferrosa-ci:latest -f /tmp/Dockerfile.ci /tmp/ferrosa-bin && break
            [ "$attempt" = 4 ] && { echo "docker build failed after 4 attempts"; exit 1; }
            echo "docker build attempt $attempt failed (likely Docker Hub base-image pull); retrying in $((attempt * 10))s…"
            sleep $((attempt * 10))
          done

      - name: Start single-node Ferrosa with RustFS
        run: |
          # Write a minimal compose file that uses the pre-built image
          # instead of building from source (saves ~8 min)
          cat > /tmp/docker-compose.ci.yml <<'CEOF'
          services:
            rustfs:
              image: rustfs/rustfs:latest
              environment:
                RUSTFS_VOLUMES: /data/rustfs0
                RUSTFS_ADDRESS: "0.0.0.0:9000"
                RUSTFS_ACCESS_KEY: ferrosa_ci_access_key  # pragma: allowlist secret
                RUSTFS_SECRET_KEY: ferrosa_ci_secret_key  # pragma: allowlist secret  # noqa
              healthcheck:
                test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
                interval: 5s
                timeout: 5s
                retries: 10
                start_period: 10s
            rustfs-init:
              image: minio/mc
              depends_on:
                rustfs:
                  condition: service_healthy
              entrypoint: >
                sh -c "mc alias set local http://rustfs:9000 ferrosa_ci_access_key ferrosa_ci_secret_key &&
                       mc mb local/ferrosa-test --ignore-existing &&
                       echo 'bucket ready'"
              restart: "no"
            node1:
              image: ferrosa-ci:latest
              depends_on:
                rustfs-init:
                  condition: service_completed_successfully
              ports:
                - "9042:9042"
                - "9090:9090"
              environment:
                FERROSA_HOST_ID: "11111111-1111-1111-1111-111111111111"
                FERROSA_CQL_BIND: "0.0.0.0:9042"
                FERROSA_WEB_BIND: "0.0.0.0:9090"
                FERROSA_CLUSTER_NAME: "ferrosa-ci"
                FERROSA_DATA_DIR: "/var/lib/ferrosa"
                FERROSA_AUTH_DISABLED: "true"
                FERROSA_S3_ENDPOINT: "http://rustfs:9000"
                FERROSA_S3_BUCKET: "ferrosa-test"
                FERROSA_S3_ALLOW_HTTP: "true"
                FERROSA_S3_ACCESS_KEY_ID: "ferrosa_ci_access_key"
                FERROSA_S3_SECRET_ACCESS_KEY: "ferrosa_ci_secret_key"  # pragma: allowlist secret
          CEOF
          docker compose -f /tmp/docker-compose.ci.yml up -d

      - name: Install cqlsh
        run: pip install cqlsh

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
        with:
          targets: wasm32-unknown-unknown
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Wait for CQL port
        run: |
          echo "Waiting for Ferrosa CQL port (9042)..."
          for i in $(seq 1 180); do
            if cqlsh 127.0.0.1 9042 -e "SELECT cluster_name FROM system.local;" >/dev/null 2>&1; then
              echo "Ferrosa ready after ${i}s"
              break
            fi
            if [ "$i" -eq 180 ]; then
              echo "::error::Ferrosa did not become ready within 180s"
              docker compose -f examples/cluster-setup/docker-compose.yml logs node1 | tail -80
              exit 1
            fi
            sleep 1
          done

      - name: Run example tests
        run: |
          cd examples
          pass=0
          fail=0
          failed=()

          for dir in $(find . -mindepth 1 -maxdepth 1 -type d | sort); do
            name=$(basename "$dir")
            [ "$name" = "theme" ] && continue
            [ "$name" = "cluster-setup" ] && continue
            [ "$name" = "cluster-scaling" ] && continue
            echo ""
            echo "=== $name ==="

            ok=true
            for f in schema.cql data.cql queries.cql; do
              if [ -f "$dir/$f" ]; then
                echo "  Running $f..."
                if ! cqlsh localhost 9042 -f "$dir/$f"; then
                  echo "  FAIL: $dir/$f"
                  ok=false
                  break
                fi
              fi
            done

            if [ -x "$dir/smoke-test.sh" ]; then
              echo "  Running smoke-test.sh..."
              if ! (cd "$dir" && bash "./smoke-test.sh"); then
                echo "  FAIL: $dir/smoke-test.sh"
                ok=false
              fi
            fi

            if $ok; then
              echo "  => $name: PASS"
              pass=$((pass + 1))
            else
              echo "  => $name: FAIL"
              fail=$((fail + 1))
              failed+=("$name")
            fi
          done

          echo ""
          echo "=============================="
          echo "Example tests: $pass passed, $fail failed"
          if [ ${#failed[@]} -gt 0 ]; then
            echo "Failed: ${failed[*]}"
          fi
          echo "=============================="
          [ "$fail" -eq 0 ]

      - name: Collect logs on failure
        if: failure()
        run: docker compose -f /tmp/docker-compose.ci.yml logs node1 | tail -100

      - name: Tear down
        if: always()
        run: docker compose -f /tmp/docker-compose.ci.yml down -v 2>/dev/null || true

  # ── Stage 2d: Cluster integration tests (--ignored, Docker) ────────
  integration:
    name: Cluster integration tests
    runs-on: ubuntu-latest
    needs: build-node-image
    # Run on PRs, on main, AND in the merge queue (`merge_group`). Without the
    # merge_group arm this job is skipped in the queue, so a red integration run
    # could never gate the merge — which is exactly how a red PR slipped through.
    # It must also be added to the ruleset's required status checks.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.ref == 'refs/heads/main'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
      - name: Free disk space
        # Node image + containers + cluster-gated test builds exhaust the
        # runner (SIGBUS-in-ld / ENOSPC, t_9291a8dd). Same reclaim as
        # Test + Coverage; df before/after for diagnosability.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/.ghcup /usr/local/share/boost \
            /usr/share/swift || true
          df -h /
      - name: Install capnproto
        run: sudo apt-get update && sudo apt-get install -y capnproto
      - name: Download prebuilt node image
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ferrosa-node-image
          path: .
      - name: Load node image into Docker
        run: docker load < ferrosa-node-image.tar.gz
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: false
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /
      - name: Bring up cluster
        run: |
          ./scripts/test-cluster-up-ci.sh > /tmp/cluster-env
          cat /tmp/cluster-env >> "$GITHUB_ENV"
      - name: Run ignored (cluster-gated) tests
        env:
          FERROSA_TEST_CONTAINERS: "1"
        run: |
          cargo test --workspace \
            --exclude ferrosa-jepsen --exclude ferrosa-loadgen \
            -- --ignored
      - name: Collect cluster logs on failure
        if: failure()
        run: |
          docker compose \
            -f tests/docker-compose.cluster.yml \
            --project-name ferrosa-test-ci \
            logs --no-color 2>/dev/null | tail -200 || true
      - name: Tear down cluster
        if: always()
        run: ./scripts/test-cluster-down.sh --ci

  # ── Stage 3: Documentation ─────────────────────────────────────────
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
      - name: Install capnproto
        run: sudo apt-get update && sudo apt-get install -y capnproto
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Generate docs
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: "-D warnings"
