name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter on PRs: run the full suite on EVERY pull request,
  # including stacked PRs whose base is another feature branch (a PR "train").
  # With `branches: [main]` these were skipped entirely — only the
  # path-filtered Driver Smoke ran — so stacked PRs went unexercised.
  pull_request:
  # Run in the merge queue too: when a PR is queued, GitHub builds a temporary
  # `merge_group` ref (the PR rebased on the latest main + entries ahead of it)
  # and these checks must report on it for the queue to merge. Without this
  # trigger the queue's required checks never run and entries would stall.
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Build cache policy (tests/ci/test_ci_cache_workflow.py pins it): rust-cache
  # is the only cache layer. Every rust-cache step RESTORES on every ref but
  # SAVES only from main on a hosted runner. GitHub scopes a cache to the ref
  # that saved it, so a PR / merge-queue / tag save can never be restored by
  # main, yet it counts against the 10 GB cap and evicts main's caches.
  # CARGO_INCREMENTAL=0: every run starts from a fresh checkout, so incremental
  # state is never reused and only inflates the target dir and the cache.
  CARGO_INCREMENTAL: "0"

jobs:
  # ── Stage 1: Format + Lint (fast feedback) ──────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
        with:
          components: rustfmt
      - run: cargo fmt --check
      - name: Check Cluster Data Loss workflow contract
        run: python3 -m unittest tests.ci.test_cluster_data_loss_workflow
      - name: Check Install Smoke workflow contract
        run: python3 -m unittest tests.ci.test_install_smoke_workflow
      - name: Check Install Smoke script contract
        run: python3 -m unittest tests.ci.test_install_smoke_script
      - name: Check release binary path resolution
        run: python3 -m unittest tests.ci.test_resolve_release_bin_dir
      - name: Check release workflow contract
        run: python3 -m unittest -q tests/ci/test_release_workflow.py
      # Pins the musl profiling link: both libunwinds (the hand-built one for
      # jemalloc's unw_backtrace, Rust's sysroot one for _Unwind_Resume) must be
      # passed as link args, because `-L` makes one shadow the other and the
      # profiling image silently stops shipping.
      - name: Check musl profiling libunwind link contract
        run: python3 -m unittest -q tests/ci/test_profiling_libunwind_link.py
      - name: Check CI cache workflow contract
        run: python3 -m unittest -q tests/ci/test_ci_cache_workflow.py
      - name: Check the no-new-waivers guard
        run: python3 -m unittest -q tests/ci/test_check_no_new_waivers.py
      # Pins the daily OOM-audit workflow: that it still runs on a schedule,
      # still enforces, and still runs byte-for-byte the same command as the
      # Clippy job's audit step below. A safety control whose nightly can be
      # quietly weakened is not a control.
      - name: Check OOM-audit daily workflow contract
        run: python3 -m unittest tests.ci.test_oom_audit_daily_workflow
      # A node that fails loud (exit 1) must be restarted by launchd, not left
      # down until someone notices (node3, 35 h on 2026-10-06).
      - name: Check the LaunchAgent restarts a failed node
        run: python3 -m unittest tests.ci.test_launchd_template

  no-memory-public:
    name: memory-public is NOT TO BE USED
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: No reference to memory-public
        run: bash scripts/guard-no-memory-public.sh
      - name: Guard tests
        run: bash tests/test_guard_no_memory_public.sh

  # Python must not recover or mutate production data (2026-09-29: a recovery
  # script's markers were indistinguishable from the evictor's). See
  # scripts/README.md.
  no-python-data-writes:
    name: scripts must not write into a data dir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: No script writes into a data directory
        run: python3 scripts/guard-no-python-data-writes.py
      - name: Guard tests
        run: python3 -m unittest -q tests/ci/test_guard_no_python_data_writes.py

  # jsonb guards (T-025): serde_json features are unified workspace-wide, so one
  # dependent enabling arbitrary_precision / preserve_order / unbounded_depth
  # changes number and object semantics everywhere (hazards M8, M12). The value
  # model crates must also stay arrow-free (D5a). The guard-arrow-free.sh crate
  # list includes ferrosa-jsonb (T-100).
  json-guards:
    name: jsonb guards (serde_json features, arrow-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
      - name: Fetch crates (the guard tests resolve offline)
        run: cargo fetch --locked
      - name: serde_json feature guard
        run: bash scripts/ci/guard-serde-json-features.sh
      - name: Arrow-free guard
        run: bash scripts/ci/guard-arrow-free.sh ferrosa-common ferrosa-jsonb
      - name: Guard tests (seeded bad trees must fail)
        run: bash tests/test_guard_ci_json.sh
      - name: Excluded crates must have a CI job
        run: bash scripts/ci/guard-excluded-crates-have-ci.sh

  # ferrosa-jsonb-conformance is a standalone workspace (excluded from the root:
  # its parquet-variant 60 needs a chrono that breaks the root's arrow 53), so no
  # `--workspace` job reaches it. This job runs it by manifest; the
  # guard-excluded-crates-have-ci.sh step in json-guards fails if it is dropped.
  jsonb-conformance:
    name: jsonb conformance oracle (clippy + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ferrosa-jsonb-conformance
          save-if: ${{ github.ref == 'refs/heads/main' && runner.environment == 'github-hosted' }}
      - name: Clippy
        run: cargo clippy --manifest-path ferrosa-jsonb-conformance/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --manifest-path ferrosa-jsonb-conformance/Cargo.toml --all-features --locked

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
        with:
          components: clippy
      - name: Install capnproto
        run: sudo apt-get update && sudo apt-get install -y capnproto
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && runner.environment == 'github-hosted' }}
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Guard against unbounded materializing reads
        run: python3 scripts/check-unbounded-reads.py
      - name: P0 OOM guard — AST read-path materialization audit
        # AST-based (syn) audit: bans Vec materialization / capped reads on scan
        # paths. Passes today via specs/p0-oom-guard/oom-audit-allow.toml; --today
        # is the run date so expired allow entries (the t_15417b35 migration
        # deadline) start failing the gate and force the streaming fix.
        run: cargo run --quiet -p xtask --all-features -- p0-oom-audit --enforce --today "$(date -u +%F)"
      - name: No new waivers (#[ignore] or dated exemptions) without Ben's approval
        # A finding is fixed, never waived. An added #[ignore], or a dated
        # exemption (expires/until/deadline after today, e.g. a p0-oom-audit
        # allowlist entry or renewal), needs a 'Waiver-Approved-By: Ben Kearns'
        # trailer on a commit in the change.
        # The checkout is shallow; deepen it so the merge base is reachable.
        run: |
          base="${{ github.base_ref || 'main' }}"
          git fetch --no-tags --unshallow origin || git fetch --no-tags origin
          git fetch --no-tags origin "$base"
          python3 scripts/check-no-new-waivers.py "origin/$base"

  # ── Stage 2: Tests ──────────────────────────────────────────────────
  test:
    name: Test + Coverage
    runs-on: ubuntu-latest
    env:
      # Line-tables-only debuginfo for test binaries: the dominant disk cost
      # in this job. Keeps usable panic backtraces; halves target size.
      # Job-level (not step-level) so rust-cache hashes it into the cache key:
      # the jobs sharing `workspace-test-all-features-debug1` all set it.
      CARGO_PROFILE_DEV_DEBUG: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
      - name: Install capnproto
        run: sudo apt-get update && sudo apt-get install -y capnproto libunwind-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: false
          # Same workspace, features, profile and debug level as `integration`
          # and nightly-fuzz `fuzz`, so they restore one dependency cache.
          shared-key: workspace-test-all-features-debug1
          save-if: ${{ github.ref == 'refs/heads/main' && runner.environment == 'github-hosted' }}
      - name: Install cargo-nextest
        # nextest runs one process per test and schedules across every core,
        # where libtest runs each test *binary* serially. Combined with the
        # `slow-tests` gating below, this is where the 36-minute job's time
        # went: one 836s test in a two-test binary held 43% of it.
        #
        # `tool:` is required: this action normally picks the tool from its
        # `@<tool>` tag, so a version-SHA pin alone selects nothing. It warns
        # "no tool specified" and installs nothing, and the run then dies at
        # the test step — which is exactly how this first failed (cargo-nextest
        # absent, exit 101). Pin the SHA AND name the tool.
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: nextest
      - name: Free disk space
        # The --all-features debug test build alone exceeds 30GB of target
        # artifacts; the old reclaim (dotnet/android/ghc ≈ 11GB) still left
        # runners hitting ENOSPC and SIGBUS-in-ld (t_9291a8dd — 4 flakes in
        # 2 days). Reclaim the tool cache too and report before/after so any
        # recurrence is diagnosable from the log.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/.ghcup /usr/local/share/boost \
            /usr/share/swift || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h /
      - name: Build AssemblyScript UDF toolchain bundle
        # `--all-features` enables `asc-udf` + `live-infra-tests`, which run the
        # inline-AssemblyScript UDF tests for real against this bundle. Build it
        # (pinned asc version) so those tests run and pass rather than being skipped.
        run: bash ferrosa-udf/examples/asc-poc/build-bundle.sh /tmp/asc-host/asc-bundle.mjs
      - name: Run tests
        env:
          FERROSA_ASC_BUNDLE: /tmp/asc-host/asc-bundle.mjs
        run: |
          # The trailing `--skip <fuzz prop>` flags exclude the file-IO-heavy
          # repair fuzz harness (ferrosa-storage `fuzz-fileio` feature, on under
          # --all-features) from the per-PR gate; it runs deeply in
          # nightly-fuzz.yml. Add new tests/repair_fuzz.rs properties to both.
          # `accord::perf` and `accord::perf_regression` (the `perf-tests` feature,
          # on under --all-features) assert ABSOLUTE wall-clock bounds (e.g.
          # a 1000-message ReorderBuffer drain under 10 ms). On a contended
          # shared runner — especially a merge-group build running several jobs
          # at once — that measures the runner, not the code: it was observed at
          # 52.8 ms and ejected a DOCS-ONLY PR from the merge queue
          # (forge t_430e21f7). The thresholds are UNCHANGED and still enforced,
          # nightly, in nightly-fuzz.yml's `perf-regression` job where the
          # machine is not competing with the rest of the PR gate. Keep the two
          # in sync: a new perf assertion added here must run there.
          # `--skip ::slow::` excludes the tests under the `slow-tests` feature
          # (compiled here under --all-features, but too slow for per-PR CI);
          # they run nightly in nightly-slow-tests.yml.
          # LazyFS crash harness is unimplemented (T-070); in-process durability
          # probes cover ordering until the crash harness exists.
          # nextest, not libtest: it runs one process per test and schedules
          # across every core. libtest runs each test *binary* serially, so the
          # suite's wall clock was the sum of every binary's slowest test and
          # one ~840s test held 43% of this job.
          #
          # `--` matters. Every `--skip` below is a libtest test-name filter, not
          # a nextest flag (`nextest run --skip` takes a pattern and rejects
          # several of these). Putting them before `--` makes nextest exit 2 with
          # "unexpected argument '--skip' found" and run NOTHING — which is how
          # this first failed. They are positional filters and belong after `--`,
          # exactly as they were in the `cargo test` form.
          #
          # `--exclude` / `--lib` / `--tests` / `--all-features` take the same
          # values in both runners. The `--` separator is the only difference.
          cargo nextest run --all-features --workspace --lib --tests \
            --exclude ferrosa-jepsen --exclude ferrosa-loadgen \
            -- --skip ::slow:: --skip accord::perf --skip batch_atomicity --skip pause_resume --skip recovery_coordinator \
               --skip cassandra_reads_compacted --skip compaction_end_to_end_pipeline \
               --skip dep_wait_ordering \
               --skip lwt_batch_atomicity_all \
               --skip clock_skew_large_preaccept \
               --skip binary_ \
               --skip concurrent_write --skip many_flushes \
               --skip flush_2000 --skip single_writer --skip write_flush_compact \
               --skip reads_never_panic_on_arbitrary_content \
               --skip corrupt_sstable_bytes_never_panic_never_oom \
               --skip peak_resident_readers_within_cap --skip streaming_equals_single_pass \
               --skip bounded_fetch_reassembles_to_single_pass \
               --skip read_merge_is_lww_no_data_loss --skip digest_walk_is_deterministic \
               --skip differential_oracle \
               --skip fly_multi_node_streaming_scan \
               --skip replicated_jsonb_index_builds_on_every_node \
               --skip real_typed_edges_paged_scan_delivers_every_distinct_row \
               --skip count_range_metadata_merger_dedups_real_typed_edges_sstables \
               --skip promote_dir_fsync_lazyfs_crash_loses_neither_copy \

  # ── Stage 2a': Differential oracle vs real PostgreSQL ──────────────
  # The `test` job above skips `differential_oracle` because it has no
  # container runtime; this dedicated job runs it against a real PostgreSQL
  # (started by the test harness via the runner's docker), comparing the
  # ferrosa Postgres front-end's SELECT/DML semantics to PostgreSQL.
  postgres-oracle:
    name: Differential Oracle (vs PostgreSQL)
    runs-on: ubuntu-latest
    env:
      # Our digest-pinned mirror, not Docker Hub. Published from
      # ferrosa-installer's service catalog (sources.json; see
      # https://downloads.ferrosa.ai/images/services/index.json). The harness
      # must use the SAME reference the pre-pull warms, or it pulls upstream
      # anyway -- a pre-pull that warms a different ref looks like coverage
      # while still depending on the upstream registry.
      FERROSA_POSTGRES_IMAGE: downloads.ferrosa.ai/postgres@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
      - name: Install capnproto
        run: sudo apt-get update && sudo apt-get install -y capnproto
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: false
          save-if: ${{ github.ref == 'refs/heads/main' && runner.environment == 'github-hosted' }}
      - name: Verify docker is available
        run: docker --version
      - name: Pre-pull the PostgreSQL image
        run: scripts/pull-images.sh "$FERROSA_POSTGRES_IMAGE"
      - name: Run differential oracle (corpus + restricted-query + DML)
        env:
          FERROSA_TEST_CONTAINERS: "1"
          # Pin the runtime: the harness prefers podman when it is on PATH, but
          # this job verifies and pre-pulls with docker. ubuntu-latest runners
          # ship both, and their podman/crun setup is not guaranteed to work.
          FERROSA_CONTAINER_RUNTIME: docker
        run: |
          # --all-features on `-p ferrosa-postgres` turns on its only feature,
          # live-infra-tests, which this job provides the container for.
          cargo test -p ferrosa-postgres --all-features \
            --test differential_oracle -- --test-threads=1 --nocapture

  # ── Stage 2b: Musl static build ───────────────────────────────────
  musl:
    name: Static Build (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: musl
          save-if: ${{ github.ref == 'refs/heads/main' && runner.environment == 'github-hosted' }}
      - name: Install musl tools and capnproto
        run: sudo apt-get update && sudo apt-get install -y musl-tools capnproto
      - name: Build static binary
        # Curated `ferrosa/full`, NOT --all-features: this is the release
        # binary's feature set, and the examples job runs this binary.
        run: cargo build --release --target x86_64-unknown-linux-musl -p ferrosa -p ferrosa-ctl --features ferrosa/full
      - name: Verify statically linked
        run: |
          file target/x86_64-unknown-linux-musl/release/ferrosa
          file target/x86_64-unknown-linux-musl/release/ferrosa | grep -qE "statically linked|static-pie linked|static"
          echo "Binary size: $(du -h target/x86_64-unknown-linux-musl/release/ferrosa | cut -f1)"
      - name: Strip and report
        run: |
          strip target/x86_64-unknown-linux-musl/release/ferrosa
          strip target/x86_64-unknown-linux-musl/release/ferrosa-ctl
          echo "Stripped ferrosa: $(du -h target/x86_64-unknown-linux-musl/release/ferrosa | cut -f1)"
          echo "Stripped ferrosa-ctl: $(du -h target/x86_64-unknown-linux-musl/release/ferrosa-ctl | cut -f1)"
      - name: Upload musl binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ferrosa-musl-static
          path: |
            target/x86_64-unknown-linux-musl/release/ferrosa
            target/x86_64-unknown-linux-musl/release/ferrosa-ctl
          retention-days: 14

  # ── aarch64 musl release target (native arm64) ───────────────────────
  # release.yml builds the aarch64 tarball natively on ubuntu-24.04-arm, but
  # only when a tag is pushed. This checks the same target, packages and
  # features per PR so an aarch64-only break shows up here, not at release
  # time. `cargo check` runs build scripts, so C dependencies are compiled
  # with musl-gcc; the final link is exercised only by the release job.
  aarch64-musl:
    name: aarch64 musl check (native arm)
    runs-on: ubuntu-24.04-arm
    env:
      CC_aarch64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      # Ubuntu's musl-gcc links the distro (glibc) libgcc.a, whose aarch64
      # outline-atomics init calls glibc's private __getauxval. Any C object
      # using atomics then fails to link, so jemalloc's configure finds no
      # atomics and its build stops. Inline LL/SC atomics avoid libgcc's
      # helpers; they are also what the old `cross` toolchain produced.
      CFLAGS_aarch64_unknown_linux_musl: -mno-outline-atomics
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
        with:
          targets: aarch64-unknown-linux-musl
      - name: Install musl tools and capnproto
        run: sudo apt-get update && sudo apt-get install -y musl-tools capnproto
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: aarch64-musl
          save-if: ${{ github.ref == 'refs/heads/main' && runner.environment == 'github-hosted' }}
      - name: Check the release packages for aarch64 musl
        # Curated `ferrosa/full`, NOT --all-features: this is release.yml's
        # aarch64 build, checked without the release profile or the link.
        run: cargo check --target aarch64-unknown-linux-musl -p ferrosa -p ferrosa-ctl --features ferrosa/full

  # ── Build the runtime node image ONCE (12-factor build/release/run) ──
  # Compile the glibc release binary exactly once (cached via rust-cache; glibc
  # for allocator performance — musl's allocator is slow, so the static musl
  # binary above is only for distribution, not for the test node). Package it
  # into an immutable `ferrosa-test-node:latest` image saved as an artifact. The
  # cluster-integration and driver-smoke jobs RUN that artifact instead of
  # recompiling the release binary inside Docker (previously done twice/run).
  build-node-image:
    name: Build node image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: node-image
          save-if: ${{ github.ref == 'refs/heads/main' && runner.environment == 'github-hosted' }}
      - name: Install capnproto
        run: sudo apt-get update && sudo apt-get install -y capnproto
      - name: Build glibc release binary (once)
        # Default features, NOT --all-features: this binary becomes an image
        # pushed to GHCR for paired repositories to run.
        run: cargo build --release -p ferrosa -p ferrosa-ctl
      - name: Package into a thin runtime image
        run: |
          mkdir -p node-bin
          cp target/release/ferrosa target/release/ferrosa-ctl node-bin/
          cat > node-bin/Dockerfile <<'DEOF'
          FROM downloads.ferrosa.ai/debian@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a
          RUN apt-get update && apt-get install -y --no-install-recommends \
                  ca-certificates gdb procps \
              && rm -rf /var/lib/apt/lists/*
          COPY ferrosa /usr/local/bin/ferrosa
          COPY ferrosa-ctl /usr/local/bin/ferrosa-ctl
          EXPOSE 9042 7000 9090 7474 7687
          ENV FERROSA_DATA_DIR=/var/lib/ferrosa
          CMD ["ferrosa"]
          DEOF
          # Retry: pulling the debian:trixie-slim base from Docker Hub
          # intermittently times out (registry-1.docker.io i/o timeout), which
          # fails the job and DROPS the PR from the merge queue. A bounded retry
          # rides out the transient registry blip (see forge t_75ec87fd).
          for attempt in 1 2 3 4; do
            docker build -t ferrosa-test-node:latest node-bin && break
            [ "$attempt" = 4 ] && { echo "docker build failed after 4 attempts"; exit 1; }
            echo "docker build attempt $attempt failed (likely Docker Hub base-image pull); retrying in $((attempt * 10))s…"
            sleep $((attempt * 10))
          done
          docker save ferrosa-test-node:latest | gzip > ferrosa-node-image.tar.gz
      - name: Push image to GHCR (cross-workflow reuse)
        # Lets the separate, path-filtered driver-smoke workflow and paired
        # repositories pull this image by commit SHA instead of recompiling.
        # Pull-request workflows run on a synthetic merge SHA, while a paired
        # repository resolves this branch's head SHA, so publish both tags.
        # Best-effort: fork PRs lack packages:write, so consumers fall back to
        # building.
        continue-on-error: true
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/ferrosa-test-node"
          MERGE_SHA="${{ github.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for SHA in "$MERGE_SHA" "$HEAD_SHA"; do
            [ -n "$SHA" ] || continue
            docker tag ferrosa-test-node:latest "$IMAGE:$SHA"
            docker push "$IMAGE:$SHA"
          done
      - name: Upload node image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ferrosa-node-image
          path: ferrosa-node-image.tar.gz
          retention-days: 14

  # ── Stage 2.5: Jepsen smoke tier (Sprint 2 W2.13) ──────────────────
  # Lifts the `--exclude ferrosa-jepsen` from this dedicated job so the
  # structural-invariant + topology nemesis suite runs on every PR.
  # Other CI jobs (`test`, `musl`, `examples`) keep the exclusion because
  # they don't have Docker.
  jepsen-smoke:
    name: Jepsen Smoke Tier
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
      - name: Install capnproto
        run: sudo apt-get update && sudo apt-get install -y capnproto
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: false
          key: jepsen-smoke
          save-if: ${{ github.ref == 'refs/heads/main' && runner.environment == 'github-hosted' }}
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /
      - name: Verify docker is available
        run: docker --version && docker compose version
      - name: Pre-pull the Jepsen compose images
        run: |
          # These images are ours: mirrored or built by ferrosa-installer
          # (publish-image-catalog.yml, only=service-images), served from
          # downloads.ferrosa.ai and pinned by digest, so an upstream registry
          # cannot take them away (MinIO's images vanished from Docker Hub on
          # 2026-09-11 and from quay.io on 2026-09-24). The digests are in
          # https://downloads.ferrosa.ai/images/services/index.json; to move
          # one, republish it there and change every reference in the repo.
          # Bounded retry lives in scripts/pull-images.sh so a transient failure
          # names the image instead of surfacing later as a confusing failure.
          scripts/pull-images.sh \
            "downloads.ferrosa.ai/rustfs@sha256:58c589bedfab28d001fc6176735872ac84323dddc6c5313cc95260600ed1ae8d" \
            "downloads.ferrosa.ai/aws-cli@sha256:e38214027df83cb6631adcf980a092a98d1d29788789bff2a0f424e87e3da8ed"
      - name: Run Jepsen smoke tier
        env:
          FERROSA_TEST_CONTAINERS: "1"
        run: |
          # Smoke tier: run the unit-level + structural-invariant +
          # topology-nemesis tests inside ferrosa-jepsen. The container
          # provisioning tests are gated on FERROSA_TEST_CONTAINERS so
          # they panic loudly without the env var instead of silently
          # passing. --all-features compiles in the `live-infra-tests` lib
          # tests; every one of them is in the skip list below (the
          # `rust_driver_connects_to_cluster` filter matches both copies).
          cargo test -p ferrosa-jepsen --all-features --lib \
            -- --skip orchestrator_docker_cluster_provision \
               --skip orchestrator_cluster_teardown \
               --skip rust_driver_connects_to_cluster \
               --skip provision_t1_cluster \
               --skip provision_single_vm \
               --skip ssh_execute_command \
               --skip ssh_upload_file
          # Workflow shape assertions live in the integration tests.
          cargo test -p ferrosa-jepsen --all-features --test ci_workflow

  # Reuses the node image artifact from build-node-image so this live
  # PostgreSQL fault schedule does not compile a second server binary.
  postgres-jepsen-fault:
    name: PostgreSQL Jepsen fault schedule
    # Re-enabled by this PR (the CL-23 fix): a doomed transaction now releases
    # its keys instead of holding them for a paused replica's full RPC timeout,
    # which is what made every stale snapshot's barrier dep-wait 5s and fail
    # SQLSTATE 58000. Proven against a real paused node at 5cd4e6b5:
    #   test postgres_transactions_are_strictly_serializable ... ok
    #   test result: ok. 21 passed; 0 failed
    # Merging the base branch back in re-applied the skip and silently turned
    # this job green-by-skipping; this commit restores the re-enable so the
    # gate actually exercises the fix it ships with.
    # If this goes red, fix the Accord path — do not re-add a skip.
    needs: build-node-image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The image `cqlsh` runs from in the two steps below. Our digest-pinned
      # mirror, not Docker Hub -- see
      # https://downloads.ferrosa.ai/images/services/index.json.
      FERROSA_CASSANDRA_IMAGE: downloads.ferrosa.ai/cassandra@sha256:8819d1b7877ee6621751a761cc163332e9c3eaf671c8ef672f7c77a7c5bff05f
      # The volume-permissions helper container in the compose below.
      FERROSA_ALPINE_IMAGE: downloads.ferrosa.ai/alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: postgres-jepsen-fault
          save-if: ${{ github.ref == 'refs/heads/main' && runner.environment == 'github-hosted' }}
      - name: Install capnproto
        run: sudo apt-get update && sudo apt-get install -y capnproto
      - name: Download and load the node image built earlier in CI
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ferrosa-node-image
          path: /tmp/ferrosa-node-image
      - name: Load node image and start the PostgreSQL cluster
        env:
          FERROSA_NIGHTLY_IMAGE: ferrosa-test-node:latest
        run: |
          docker load --input /tmp/ferrosa-node-image/ferrosa-node-image.tar.gz
          docker compose -f ferrosa-jepsen/tests/docker/jepsen-cluster.yml up -d --no-build
      - name: Wait for PostgreSQL cluster formation
        run: |
          set -euo pipefail
          expected_nodes='["11111111-1111-1111-1111-111111111111","22222222-2222-2222-2222-222222222222","33333333-3333-3333-3333-333333333333"]'
          node_specs=(
            "49090|11111111-1111-1111-1111-111111111111"
            "49091|22222222-2222-2222-2222-222222222222"
            "49092|33333333-3333-3333-3333-333333333333"
          )
          deadline=$((SECONDS + 120))
          ready=0
          last_problem='cluster endpoints have not responded yet'
          while (( SECONDS < deadline )); do
            all_ready=1
            for node_spec in "${node_specs[@]}"; do
              IFS='|' read -r web_port expected_host_id <<< "$node_spec"
              base_url="http://127.0.0.1:${web_port}"
              status=$(curl --connect-timeout 2 --max-time 5 -sf \
                "${base_url}/api/cluster/status") || status=''
              # `.mode` flips to "cluster" when formation starts, but DDL stays on
              # the local Direct path until Raft has a leader; `ALTER KEYSPACE
              # system_auth` on that path is refused. Wait for the DDL path too.
              if ! printf '%s' "$status" | jq -e --arg id "$expected_host_id" \
                '.host_id == $id and .mode == "cluster" and .ddl_path == "cluster"' >/dev/null; then
                all_ready=0
                last_problem="node $expected_host_id has not entered cluster mode with cluster-routed DDL (status: ${status:-none})"
                break
              fi
              ring=$(curl --connect-timeout 2 --max-time 5 -sf \
                "${base_url}/api/cluster/ring") || ring=''
              if ! printf '%s' "$ring" | jq -e --argjson expected "$expected_nodes" \
                '([.nodes[] | select(.state == "Normal") | .host_id] | sort) == ($expected | sort)' >/dev/null; then
                all_ready=0
                last_problem="node $expected_host_id does not see all three Normal ring members"
                break
              fi
            done
            if [ "$all_ready" -eq 1 ]; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::PostgreSQL Jepsen cluster did not form within 120s: $last_problem"
            docker compose -f ferrosa-jepsen/tests/docker/jepsen-cluster.yml ps
            exit 1
          fi
          echo "PostgreSQL Jepsen cluster formed: all three nodes report the expected Normal ring"
      - name: Replicate PostgreSQL roles to all nodes
        run: |
          scripts/pull-images.sh "$FERROSA_CASSANDRA_IMAGE"
          docker run --rm --network host "$FERROSA_CASSANDRA_IMAGE" cqlsh 127.0.0.1 49042 \
            -e "ALTER KEYSPACE system_auth WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 3};"
      - name: Create the test CQL role
        run: |
          for attempt in $(seq 1 60); do
            if docker run --rm --network host "$FERROSA_CASSANDRA_IMAGE" cqlsh 127.0.0.1 49042 \
              -e "CREATE ROLE ferrosa_pg_jepsen WITH PASSWORD = 'ferrosa-jepsen-test' AND LOGIN = true AND SUPERUSER = true;"; then
              exit 0
            fi
            sleep 2
          done
          echo "CQL role creation did not succeed after $attempt attempts" >&2
          exit 1
      - name: Run native PostgreSQL history while node 3 is paused
        env:
          FERROSA_NIGHTLY_IMAGE: ferrosa-test-node:latest
          FERROSA_TEST_CQL_URLS: 127.0.0.1:49042;127.0.0.1:49043;127.0.0.1:49044
          FERROSA_TEST_POSTGRES_URLS: postgresql://ferrosa_pg_jepsen:ferrosa-jepsen-test@127.0.0.1:49052/postgres;postgresql://ferrosa_pg_jepsen:ferrosa-jepsen-test@127.0.0.1:49053/postgres;postgresql://ferrosa_pg_jepsen:ferrosa-jepsen-test@127.0.0.1:49054/postgres
          FERROSA_TEST_POSTGRES_CLIENT_NODE_COUNT: "2"
          FERROSA_TEST_POSTGRES_FAULT_READY_FILE: /tmp/pg-fault-ready
          FERROSA_TEST_POSTGRES_FAULT_ACTIVE_FILE: /tmp/pg-fault-active
          FERROSA_TEST_POSTGRES_FAULT_COMPLETE_FILE: /tmp/pg-fault-complete
          FERROSA_TEST_POSTGRES_HISTORY_PATH: /tmp/postgres-jepsen-history.json
        run: |
          set -euo pipefail
          compose="docker compose -f ferrosa-jepsen/tests/docker/jepsen-cluster.yml"
          cleanup() {
            $compose logs --no-color > /tmp/postgres-jepsen-cluster.log 2>&1 || true
            docker unpause ferrosa-jepsen-node3 >/dev/null 2>&1 || true
            $compose down -v || true
          }
          trap cleanup EXIT

          rm -f "$FERROSA_TEST_POSTGRES_FAULT_READY_FILE" \
            "$FERROSA_TEST_POSTGRES_FAULT_ACTIVE_FILE" \
            "$FERROSA_TEST_POSTGRES_FAULT_COMPLETE_FILE"
          cargo test -p ferrosa-jepsen --all-features \
            --test postgres_strict_serializable -- --nocapture \
            > /tmp/postgres-jepsen.log 2>&1 &
          test_pid=$!

          for attempt in $(seq 1 180); do
            if test -e "$FERROSA_TEST_POSTGRES_FAULT_READY_FILE"; then
              break
            fi
            if ! kill -0 "$test_pid" 2>/dev/null; then
              cat /tmp/postgres-jepsen.log
              wait "$test_pid"
            fi
            sleep 1
          done
          if ! test -e "$FERROSA_TEST_POSTGRES_FAULT_READY_FILE"; then
            echo "PostgreSQL test did not finish setup within $attempt seconds" >&2
            cat /tmp/postgres-jepsen.log
            exit 1
          fi

          docker pause ferrosa-jepsen-node3
          touch "$FERROSA_TEST_POSTGRES_FAULT_ACTIVE_FILE"
          for attempt in $(seq 1 600); do
            if test -e "$FERROSA_TEST_POSTGRES_FAULT_COMPLETE_FILE"; then
              break
            fi
            if ! kill -0 "$test_pid" 2>/dev/null; then
              cat /tmp/postgres-jepsen.log
              wait "$test_pid"
            fi
            sleep 1
          done
          if ! test -e "$FERROSA_TEST_POSTGRES_FAULT_COMPLETE_FILE"; then
            echo "PostgreSQL workload did not complete within $attempt seconds of the replica pause" >&2
            cat /tmp/postgres-jepsen.log
            exit 1
          fi

          docker unpause ferrosa-jepsen-node3
          if ! wait "$test_pid"; then
            cat /tmp/postgres-jepsen.log
            exit 1
          fi
          cat /tmp/postgres-jepsen.log
      - name: Upload history and cluster logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgres-jepsen-fault
          path: |
            /tmp/postgres-jepsen.log
            /tmp/postgres-jepsen-history.json
            /tmp/postgres-jepsen-cluster.log

  # The production Compose overlay must actually start (t_3422ae92).
  # docker-compose.secure.yml runs FERROSA_MODE=production, which refuses to
  # start unless auth is on and every listener + internode requires TLS
  # (t_d5d122ba). This job generates throwaway certificates, brings up the
  # 3-node overlay with the node image built earlier in CI, waits for /readyz
  # over HTTPS on every node, runs one authenticated CQL query over TLS, and
  # tears down. Before this job the overlay had no TLS settings at all, so
  # nothing proved it could start.
  # A `flight`-feature release binary for the secure-compose job only. The
  # shared ferrosa-test-node image stays on default features: paired
  # repositories run it, and it must not start binding Arrow Flight for them.
  build-flight-binary:
    name: Build flight release binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: flight-binary
          save-if: ${{ github.ref == 'refs/heads/main' && runner.environment == 'github-hosted' }}
      - name: Install capnproto
        run: sudo apt-get update && sudo apt-get install -y capnproto
      - name: Build glibc release binary with Arrow Flight
        run: cargo build --release -p ferrosa --features flight
      - name: Upload flight binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ferrosa-flight-binary
          path: target/release/ferrosa
          retention-days: 7

  secure-compose:
    name: Production Compose overlay (TLS + auth)
    needs: [build-node-image, build-flight-binary]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pin the runtime: ubuntu-latest ships podman too, and a previous
      # container job silently picked it up from PATH.
      FERROSA_CONTAINER_RUNTIME: docker
      # docker-compose.yml defaults to upstream rustfs:latest (arm64 dev
      # machines); CI uses our digest-pinned amd64 mirror.
      FERROSA_RUSTFS_IMAGE: downloads.ferrosa.ai/rustfs@sha256:58c589bedfab28d001fc6176735872ac84323dddc6c5313cc95260600ed1ae8d
      # The `cqlsh` client this job runs over TLS, and the pair to
      # FERROSA_CASSANDRA_IMAGE used by the pre-pull step. Our digest-pinned
      # mirror, not Docker Hub.
      FERROSA_CQLSH_IMAGE: downloads.ferrosa.ai/cassandra@sha256:8819d1b7877ee6621751a761cc163332e9c3eaf671c8ef672f7c77a7c5bff05f
      FERROSA_CASSANDRA_IMAGE: downloads.ferrosa.ai/cassandra@sha256:8819d1b7877ee6621751a761cc163332e9c3eaf671c8ef672f7c77a7c5bff05f
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download the node image built earlier in CI
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ferrosa-node-image
          path: /tmp/ferrosa-node-image
      - name: Download the flight release binary
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ferrosa-flight-binary
          path: /tmp/secure-smoke-image
      - name: Load the node image, swap in the flight binary, add curl
        run: |
          set -euo pipefail
          docker load --input /tmp/ferrosa-node-image/ferrosa-node-image.tar.gz
          # docker-compose.yml names node images ferrosa-smoke:latest; the
          # healthcheck needs curl, which the thin CI image does not carry,
          # and the Arrow Flight probe needs a binary built with `flight`.
          chmod +x /tmp/secure-smoke-image/ferrosa
          printf '%s\n' \
            'FROM ferrosa-test-node:latest' \
            'RUN apt-get update && apt-get install -y --no-install-recommends curl && rm -rf /var/lib/apt/lists/*' \
            'COPY ferrosa /usr/local/bin/ferrosa' \
            'EXPOSE 8815' \
            > /tmp/secure-smoke-image/Dockerfile
          for attempt in 1 2 3 4; do
            docker build -t ferrosa-smoke:latest /tmp/secure-smoke-image && break
            [ "$attempt" = 4 ] && { echo "::error::image build failed after 4 attempts"; exit 1; }
            echo "image build attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
      - name: Pre-pull service and client images
        run: |
          set -euo pipefail
          # Bounded retry lives in scripts/pull-images.sh so every job's pull
          # behaves the same way and a failure names the image.
          scripts/pull-images.sh "$FERROSA_RUSTFS_IMAGE" "$FERROSA_CASSANDRA_IMAGE" \
            "downloads.ferrosa.ai/alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc" \
            "downloads.ferrosa.ai/aws-cli@sha256:e38214027df83cb6631adcf980a092a98d1d29788789bff2a0f424e87e3da8ed"
      - name: Start the overlay, check HTTPS, CQL and Arrow Flight over TLS, tear down
        run: |
          set -euo pipefail
          FERROSA_SEED_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$FERROSA_SEED_ADMIN_PASSWORD"
          export FERROSA_SEED_ADMIN_PASSWORD
          scripts/secure-compose-smoke.sh

  # ── Stage 2c: Example CQL tests (reuses musl binary) ───────────────
  examples:
    name: Example CQL Scripts
    runs-on: ubuntu-latest
    needs: musl
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download musl binary
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ferrosa-musl-static
          path: /tmp/ferrosa-bin

      - name: Build lightweight Docker image from musl binary
        run: |
          chmod +x /tmp/ferrosa-bin/ferrosa
          cat > /tmp/Dockerfile.ci <<'DEOF'
          FROM downloads.ferrosa.ai/debian@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a
          RUN apt-get update && apt-get install -y ca-certificates && rm -rf /var/lib/apt/lists/*
          COPY ferrosa /usr/local/bin/
          EXPOSE 9042 17000 9090
          ENV FERROSA_DATA_DIR=/var/lib/ferrosa
          CMD ["ferrosa"]
          DEOF
          # Retry: the debian:trixie-slim base pull from Docker Hub
          # intermittently times out and fails the job (dropping the PR from the
          # merge queue). A bounded retry rides it out (see forge t_75ec87fd).
          for attempt in 1 2 3 4; do
            docker build -t ferrosa-ci:latest -f /tmp/Dockerfile.ci /tmp/ferrosa-bin && break
            [ "$attempt" = 4 ] && { echo "docker build failed after 4 attempts"; exit 1; }
            echo "docker build attempt $attempt failed (likely Docker Hub base-image pull); retrying in $((attempt * 10))s…"
            sleep $((attempt * 10))
          done

      - name: Start single-node Ferrosa with RustFS
        run: |
          # Write a minimal compose file that uses the pre-built image
          # instead of building from source (saves ~8 min)
          cat > /tmp/docker-compose.ci.yml <<'CEOF'
          services:
            rustfs:
              image: downloads.ferrosa.ai/rustfs@sha256:58c589bedfab28d001fc6176735872ac84323dddc6c5313cc95260600ed1ae8d
              environment:
                RUSTFS_VOLUMES: /data/rustfs0
                RUSTFS_ADDRESS: "0.0.0.0:9000"
                RUSTFS_ACCESS_KEY: ferrosa_ci_access_key  # pragma: allowlist secret
                RUSTFS_SECRET_KEY: ferrosa_ci_secret_key  # pragma: allowlist secret  # noqa
              healthcheck:
                test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
                interval: 5s
                timeout: 5s
                retries: 10
                start_period: 10s
            rustfs-init:
              image: downloads.ferrosa.ai/aws-cli@sha256:e38214027df83cb6631adcf980a092a98d1d29788789bff2a0f424e87e3da8ed
              depends_on:
                rustfs:
                  condition: service_healthy
              environment:
                AWS_ACCESS_KEY_ID: ferrosa_ci_access_key
                AWS_SECRET_ACCESS_KEY: ferrosa_ci_secret_key  # pragma: allowlist secret
                AWS_DEFAULT_REGION: us-east-1
              entrypoint: >
                sh -c "( aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket ferrosa-test ||
                         aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket ferrosa-test ) &&
                       echo 'bucket ready'"
              restart: "no"
            node1:
              image: ferrosa-ci:latest
              depends_on:
                rustfs-init:
                  condition: service_completed_successfully
              ports:
                - "9042:9042"
                - "9090:9090"
              environment:
                FERROSA_HOST_ID: "11111111-1111-1111-1111-111111111111"
                FERROSA_CQL_BIND: "0.0.0.0:9042"
                FERROSA_WEB_BIND: "0.0.0.0:9090"
                FERROSA_CLUSTER_NAME: "ferrosa-ci"
                FERROSA_DATA_DIR: "/var/lib/ferrosa"
                FERROSA_AUTH_DISABLED: "true"
                FERROSA_S3_ENDPOINT: "http://rustfs:9000"
                FERROSA_S3_BUCKET: "ferrosa-test"
                FERROSA_S3_ALLOW_HTTP: "true"
                FERROSA_S3_ACCESS_KEY_ID: "ferrosa_ci_access_key"
                FERROSA_S3_SECRET_ACCESS_KEY: "ferrosa_ci_secret_key"  # pragma: allowlist secret
          CEOF
          # Bounded retry: `up -d` pulls rustfs and aws-cli from
          # downloads.ferrosa.ai, and our own origin can hiccup -- on
          # 2026-09-29 a manifest read against it was reset mid-transfer and
          # this step failed the job with no retry. Only the pull is flaky,
          # so `up` is re-run rather than the whole step.
          for attempt in 1 2 3 4; do
            if docker compose -f /tmp/docker-compose.ci.yml up -d; then
              break
            fi
            [ "$attempt" = 4 ] && { echo "::error::compose up failed after 4 attempts"; exit 1; }
            echo "compose up attempt $attempt failed (likely an image pull); retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done

      - name: Install cqlsh
        run: pip install cqlsh

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
        with:
          targets: wasm32-unknown-unknown

      - name: Wait for CQL port
        run: |
          echo "Waiting for Ferrosa CQL port (9042)..."
          for i in $(seq 1 180); do
            if cqlsh 127.0.0.1 9042 -e "SELECT cluster_name FROM system.local;" >/dev/null 2>&1; then
              echo "Ferrosa ready after ${i}s"
              break
            fi
            if [ "$i" -eq 180 ]; then
              echo "::error::Ferrosa did not become ready within 180s"
              docker compose -f examples/cluster-setup/docker-compose.yml logs node1 | tail -80
              exit 1
            fi
            sleep 1
          done

      - name: Run example tests
        run: |
          cd examples
          pass=0
          fail=0
          failed=()

          for dir in $(find . -mindepth 1 -maxdepth 1 -type d | sort); do
            name=$(basename "$dir")
            [ "$name" = "theme" ] && continue
            [ "$name" = "cluster-setup" ] && continue
            [ "$name" = "cluster-scaling" ] && continue
            echo ""
            echo "=== $name ==="

            ok=true
            for f in schema.cql data.cql queries.cql; do
              if [ -f "$dir/$f" ]; then
                echo "  Running $f..."
                if ! cqlsh localhost 9042 -f "$dir/$f"; then
                  echo "  FAIL: $dir/$f"
                  ok=false
                  break
                fi
              fi
            done

            if [ -x "$dir/smoke-test.sh" ]; then
              echo "  Running smoke-test.sh..."
              if ! (cd "$dir" && bash "./smoke-test.sh"); then
                echo "  FAIL: $dir/smoke-test.sh"
                ok=false
              fi
            fi

            if $ok; then
              echo "  => $name: PASS"
              pass=$((pass + 1))
            else
              echo "  => $name: FAIL"
              fail=$((fail + 1))
              failed+=("$name")
            fi
          done

          echo ""
          echo "=============================="
          echo "Example tests: $pass passed, $fail failed"
          if [ ${#failed[@]} -gt 0 ]; then
            echo "Failed: ${failed[*]}"
          fi
          echo "=============================="
          [ "$fail" -eq 0 ]

      - name: Collect logs on failure
        if: failure()
        run: docker compose -f /tmp/docker-compose.ci.yml logs node1 | tail -100

      - name: Tear down
        if: always()
        run: docker compose -f /tmp/docker-compose.ci.yml down -v 2>/dev/null || true

  # ── Stage 2d: Cluster integration tests (--ignored, Docker) ────────
  integration:
    name: Cluster integration tests
    runs-on: ubuntu-latest
    needs: build-node-image
    # Run on PRs, on main, AND in the merge queue (`merge_group`). Without the
    # merge_group arm this job is skipped in the queue, so a red integration run
    # could never gate the merge — which is exactly how a red PR slipped through.
    # It must also be added to the ruleset's required status checks.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.ref == 'refs/heads/main'
    timeout-minutes: 45
    env:
      # Matches `test`, so both restore the same dependency cache; line tables
      # still give panic backtraces file:line.
      CARGO_PROFILE_DEV_DEBUG: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
      - name: Free disk space
        # Node image + containers + cluster-gated test builds exhaust the
        # runner (SIGBUS-in-ld / ENOSPC, t_9291a8dd). Same reclaim as
        # Test + Coverage; df before/after for diagnosability.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/.ghcup /usr/local/share/boost \
            /usr/share/swift || true
          df -h /
      - name: Install capnproto
        run: sudo apt-get update && sudo apt-get install -y capnproto libunwind-dev
      - name: Download prebuilt node image
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ferrosa-node-image
          path: .
      - name: Load node image into Docker
        run: docker load < ferrosa-node-image.tar.gz
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: false
          shared-key: workspace-test-all-features-debug1
          save-if: ${{ github.ref == 'refs/heads/main' && runner.environment == 'github-hosted' }}
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /
      - name: Bring up cluster
        run: |
          ./scripts/test-cluster-up-ci.sh > /tmp/cluster-env
          cat /tmp/cluster-env >> "$GITHUB_ENV"
      - name: Run ignored (cluster-gated) tests
        env:
          FERROSA_TEST_CONTAINERS: "1"
        run: |
          # --all-features adds no ignored tests: no #[ignore] test sits behind
          # a feature gate, so --ignored selects the same set as before.
          cargo test --workspace --all-features \
            --exclude ferrosa-jepsen --exclude ferrosa-loadgen \
            -- --ignored
      - name: Put cqlsh on PATH (docker, no host install)
        # The live test shells out to `cqlsh <host> <port> -e <stmt>`. This
        # wrapper forwards to the same cassandra:5.0 image the PostgreSQL
        # Jepsen job uses; --network host reaches the published 9042-9044.
        run: |
          docker pull cassandra:5.0
          printf '#!/bin/sh\nexec docker run --rm --network host cassandra:5.0 cqlsh "$@"\n' > cqlsh
          sudo install -m 0755 cqlsh /usr/local/bin/cqlsh
          rm cqlsh
      - name: Run live-infra cluster test (replicated jsonb index)
        # FERROSA_TEST_CLUSTER_NODES came from "Bring up cluster" via
        # GITHUB_ENV (127.0.0.1:9042-9044). The Test + Coverage job skips this
        # test by name (it has no cluster); this is where it runs. It panics if
        # the variable is unset, so a wiring regression is loud.
        run: |
          # --all-features (not just live-infra-tests) keeps the build shared
          # with the rest of this job's cache; it enables live-infra-tests.
          cargo test --all-features -p ferrosa-cluster \
            --test replicated_jsonb_index_live -- --nocapture
      - name: Collect cluster logs on failure
        if: failure()
        run: |
          docker compose \
            -f tests/docker-compose.cluster.yml \
            --project-name ferrosa-test-ci \
            logs --no-color 2>/dev/null | tail -200 || true
      - name: Tear down cluster
        if: always()
        run: ./scripts/test-cluster-down.sh --ci

  # ── Stage 3: Documentation ─────────────────────────────────────────
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
      - name: Install capnproto
        run: sudo apt-get update && sudo apt-get install -y capnproto
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && runner.environment == 'github-hosted' }}
      - name: Generate docs
        run: cargo doc --no-deps --workspace --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"
