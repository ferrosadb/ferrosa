name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Stage 1: Format + Lint (fast feedback) ──────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  # ── Stage 2: Tests + Coverage ───────────────────────────────────────
  test:
    name: Test + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run tests with coverage (single instrumented run)
        run: |
          cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info \
            --exclude ferrosa-jepsen --exclude ferrosa-loadgen \
            -- --skip batch_atomicity --skip pause_resume --skip recovery_coordinator \
               --skip cassandra_reads_compacted --skip compaction_end_to_end_pipeline \
               --skip dep_wait_ordering --skip disk_fail_no_phantom \
               --skip packet_reorder_linearizability --skip lwt_batch_atomicity_all \
               --skip clock_skew_large_preaccept \
               --skip binary_ \
               --skip concurrent_write_flush_compact \
               --skip many_flushes_no_data --skip flush_2000 --skip single_writer_concurrent \
               --skip write_flush_compact_no_data
          cargo llvm-cov report --html --output-dir coverage-html
          cargo llvm-cov report --summary-only 2>&1 | tee coverage-summary.txt
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-html/
          retention-days: 14
      - name: Upload lcov data
        uses: actions/upload-artifact@v4
        with:
          name: lcov-info
          path: lcov.info
          retention-days: 14
      - name: Check coverage threshold (80% line)
        run: |
          COVERAGE=$(grep 'TOTAL' coverage-summary.txt | awk '{print $10}' | tr -d '%')
          echo "Total line coverage: ${COVERAGE}%"
          if [ -z "$COVERAGE" ]; then
            echo "::warning::Could not parse coverage percentage — skipping gate"
            exit 0
          fi
          THRESHOLD=80
          if [ "$(echo "$COVERAGE < $THRESHOLD" | bc -l)" -eq 1 ]; then
            echo "::error::Line coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
          echo "Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"

  # ── Stage 2b: Musl static build ───────────────────────────────────
  musl:
    name: Static Build (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build static binary
        run: cargo build --release --target x86_64-unknown-linux-musl -p ferrosa -p ferrosa-ctl
      - name: Verify statically linked
        run: |
          file target/x86_64-unknown-linux-musl/release/ferrosa
          file target/x86_64-unknown-linux-musl/release/ferrosa | grep -qE "statically linked|static-pie linked|static"
          echo "Binary size: $(du -h target/x86_64-unknown-linux-musl/release/ferrosa | cut -f1)"
      - name: Strip and report
        run: |
          strip target/x86_64-unknown-linux-musl/release/ferrosa
          strip target/x86_64-unknown-linux-musl/release/ferrosa-ctl
          echo "Stripped ferrosa: $(du -h target/x86_64-unknown-linux-musl/release/ferrosa | cut -f1)"
          echo "Stripped ferrosa-ctl: $(du -h target/x86_64-unknown-linux-musl/release/ferrosa-ctl | cut -f1)"
      - name: Upload musl binaries
        uses: actions/upload-artifact@v4
        with:
          name: ferrosa-musl-static
          path: |
            target/x86_64-unknown-linux-musl/release/ferrosa
            target/x86_64-unknown-linux-musl/release/ferrosa-ctl
          retention-days: 14

  # ── Stage 3: Documentation ─────────────────────────────────────────
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate docs
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: "-D warnings"
