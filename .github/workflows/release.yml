name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # ── Linux x86_64 (glibc + musl) ──────────────────────────────────────
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Run tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # glibc binary (standard Linux)
      - name: Build x86_64 glibc binaries
        run: |
          cargo build --release -p ferrosa -p ferrosa-ctl
          strip target/release/ferrosa
          strip target/release/ferrosa-ctl

      # musl static binary (Alpine, containers, anywhere)
      - name: Build x86_64 musl static binaries
        run: |
          cargo build --release --target x86_64-unknown-linux-musl -p ferrosa -p ferrosa-ctl
          strip target/x86_64-unknown-linux-musl/release/ferrosa
          strip target/x86_64-unknown-linux-musl/release/ferrosa-ctl
          file target/x86_64-unknown-linux-musl/release/ferrosa | grep -q "statically linked"

      - name: Package tarballs
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          tar czf "dist/ferrosa-${VERSION}-x86_64-linux-gnu.tar.gz" \
            -C target/release ferrosa ferrosa-ctl
          tar czf "dist/ferrosa-${VERSION}-x86_64-linux-musl.tar.gz" \
            -C target/x86_64-unknown-linux-musl/release ferrosa ferrosa-ctl

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Debian package
        id: deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="amd64"
          PKG_DIR="dist/ferrosa_${VERSION}_${ARCH}"
          DEB_FILE="dist/ferrosa_${VERSION}_${ARCH}.deb"

          mkdir -p "${PKG_DIR}/DEBIAN"
          cat > "${PKG_DIR}/DEBIAN/control" <<CTRL
          Package: ferrosa
          Version: ${VERSION}
          Section: database
          Priority: optional
          Architecture: ${ARCH}
          Depends: ca-certificates
          Maintainer: Ferrosa Team <ferrosa@ferrosadb.com>
          Homepage: https://ferrosadb.com
          Description: CQL-compatible distributed database with S3-backed storage
           Ferrosa is a Rust reimplementation of Apache Cassandra with S3-backed
           storage, pluggable secondary indexes, built-in graph queries, and
           pair-mode high availability with automatic failover.
          CTRL
          sed -i 's/^          //' "${PKG_DIR}/DEBIAN/control"

          cat > "${PKG_DIR}/DEBIAN/postinst" <<'POSTINST'
          #!/bin/sh
          set -e
          if ! id -u ferrosa >/dev/null 2>&1; then
              useradd --system --no-create-home --shell /usr/sbin/nologin ferrosa
          fi
          mkdir -p /var/lib/ferrosa && chown ferrosa:ferrosa /var/lib/ferrosa
          mkdir -p /var/log/ferrosa && chown ferrosa:ferrosa /var/log/ferrosa
          POSTINST
          sed -i 's/^          //' "${PKG_DIR}/DEBIAN/postinst"
          chmod 755 "${PKG_DIR}/DEBIAN/postinst"

          mkdir -p "${PKG_DIR}/usr/bin"
          cp target/release/ferrosa "${PKG_DIR}/usr/bin/"
          cp target/release/ferrosa-ctl "${PKG_DIR}/usr/bin/"
          strip "${PKG_DIR}/usr/bin/ferrosa"
          strip "${PKG_DIR}/usr/bin/ferrosa-ctl"

          mkdir -p "${PKG_DIR}/lib/systemd/system"
          cat > "${PKG_DIR}/lib/systemd/system/ferrosa.service" <<SERVICE
          [Unit]
          Description=Ferrosa Database Server
          After=network-online.target
          Wants=network-online.target
          Documentation=https://ferrosadb.com

          [Service]
          Type=simple
          User=ferrosa
          Group=ferrosa
          ExecStart=/usr/bin/ferrosa
          Restart=on-failure
          RestartSec=5s
          LimitNOFILE=65536
          LimitMEMLOCK=infinity
          Environment=FERROSA_DATA_DIR=/var/lib/ferrosa
          Environment=FERROSA_LOG_DIR=/var/log/ferrosa
          Environment=RUST_LOG=info

          [Install]
          WantedBy=multi-user.target
          SERVICE
          sed -i 's/^          //' "${PKG_DIR}/lib/systemd/system/ferrosa.service"

          mkdir -p "${PKG_DIR}/etc/ferrosa"
          mkdir -p "${PKG_DIR}/var/lib/ferrosa"
          mkdir -p "${PKG_DIR}/usr/share/doc/ferrosa"
          echo "Copyright 2026 Ferrosa Contributors. All rights reserved." \
              > "${PKG_DIR}/usr/share/doc/ferrosa/copyright"

          dpkg-deb --build --root-owner-group "$PKG_DIR" "$DEB_FILE"
          echo "deb_file=${DEB_FILE}" >> "$GITHUB_OUTPUT"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/ferrosa-*
          retention-days: 90

  # ── macOS Apple Silicon (aarch64) ─────────────────────────────────────
  build-macos:
    name: Build macOS Apple Silicon
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Build aarch64-apple-darwin binaries
        run: |
          cargo build --release --target aarch64-apple-darwin -p ferrosa -p ferrosa-ctl
          strip target/aarch64-apple-darwin/release/ferrosa
          strip target/aarch64-apple-darwin/release/ferrosa-ctl

      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          tar czf "dist/ferrosa-${VERSION}-aarch64-apple-darwin.tar.gz" \
            -C target/aarch64-apple-darwin/release ferrosa ferrosa-ctl

      - name: Package Homebrew bottle (tar.gz)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BOTTLE_DIR="dist/ferrosa/${VERSION}"
          mkdir -p "${BOTTLE_DIR}/bin"
          cp target/aarch64-apple-darwin/release/ferrosa "${BOTTLE_DIR}/bin/"
          cp target/aarch64-apple-darwin/release/ferrosa-ctl "${BOTTLE_DIR}/bin/"

          # Homebrew bottle is a tar.gz rooted at ferrosa/<version>/
          tar czf "dist/ferrosa-${VERSION}.arm64_sonoma.bottle.tar.gz" \
            -C dist ferrosa/${VERSION}
          rm -rf "dist/ferrosa"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: dist/ferrosa-*
          retention-days: 90

  # ── Create GitHub Release (private repo) ──────────────────────────────
  release:
    name: Create Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: dist/

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-aarch64
          path: dist/

      - name: List release artifacts
        run: ls -lh dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          NOTES=$(cat <<'NOTES'
          ## What's Included

          | Artifact | Platform | Description |
          |----------|----------|-------------|
          | `ferrosa-VERSION-x86_64-linux-gnu.tar.gz` | Linux x86_64 (glibc) | Standard Linux binary |
          | `ferrosa-VERSION-x86_64-linux-musl.tar.gz` | Linux x86_64 (musl) | Statically linked, works on Alpine/containers |
          | `ferrosa-VERSION_amd64.deb` | Debian/Ubuntu x86_64 | Package with systemd service |
          | `ferrosa-VERSION-aarch64-apple-darwin.tar.gz` | macOS Apple Silicon | Native ARM64 binary |
          | `ferrosa-VERSION.arm64_sonoma.bottle.tar.gz` | macOS (Homebrew) | Homebrew bottle for tap install |

          ### Quick Start (Linux)

          ```bash
          tar xzf ferrosa-VERSION-x86_64-linux-gnu.tar.gz
          ./ferrosa
          ```

          ### Quick Start (macOS)

          ```bash
          tar xzf ferrosa-VERSION-aarch64-apple-darwin.tar.gz
          ./ferrosa
          ```
          NOTES
          )

          # Replace VERSION placeholder in notes
          NOTES="${NOTES//VERSION/${VERSION}}"

          gh release create "v${VERSION}" dist/* \
            --title "Ferrosa v${VERSION}" \
            --notes "$NOTES" \
            --draft
