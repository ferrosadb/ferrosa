name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: >-
          Mark the GitHub release as a prerelease (the "nightly" channel).
          Stable releases are promoted separately via promote-release.yml.
        required: false
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # ── Linux x86_64 (musl static) ───────────────────────────────────────
  build-linux-x86_64:
    name: Build Linux x86_64 (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install musl tools and capnproto
        run: sudo apt-get update && sudo apt-get install -y musl-tools capnproto


      - name: Clippy
        run: cargo clippy --all-targets --target x86_64-unknown-linux-musl -- -D warnings

      - name: Build x86_64 musl static binaries
        run: |
          cargo build --release --target x86_64-unknown-linux-musl -p ferrosa -p ferrosa-ctl --features ferrosa/full
          strip target/x86_64-unknown-linux-musl/release/ferrosa
          strip target/x86_64-unknown-linux-musl/release/ferrosa-ctl
          file target/x86_64-unknown-linux-musl/release/ferrosa target/x86_64-unknown-linux-musl/release/ferrosa-ctl

      - name: Stage release tarball
        run: |
          bash .github/scripts/stage-release-tarball.sh \
            x86_64-unknown-linux-musl \
            target/x86_64-unknown-linux-musl/release

      - name: Build Debian package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="amd64"
          PKG_DIR="dist/ferrosa_${VERSION}_${ARCH}"
          DEB_FILE="dist/ferrosa_${VERSION}_${ARCH}.deb"

          mkdir -p "${PKG_DIR}/DEBIAN"
          cat > "${PKG_DIR}/DEBIAN/control" <<CTRL
          Package: ferrosa
          Version: ${VERSION}
          Section: database
          Priority: optional
          Architecture: ${ARCH}
          Depends: ca-certificates
          Maintainer: Ferrosa Team <ferrosa@ferrosadb.com>
          Homepage: https://www.ferrosa.ai
          Description: CQL-compatible distributed database with S3-backed storage
           Ferrosa is a Rust reimplementation of Apache Cassandra with S3-backed
           storage, pluggable secondary indexes, built-in graph queries, and
           pair-mode high availability with automatic failover.
          CTRL
          sed -i 's/^          //' "${PKG_DIR}/DEBIAN/control"

          cat > "${PKG_DIR}/DEBIAN/postinst" <<'POSTINST'
          #!/bin/sh
          set -e
          if ! id -u ferrosa >/dev/null 2>&1; then
              useradd --system --no-create-home --shell /usr/sbin/nologin ferrosa
          fi
          mkdir -p /var/lib/ferrosa && chown ferrosa:ferrosa /var/lib/ferrosa
          mkdir -p /var/log/ferrosa && chown ferrosa:ferrosa /var/log/ferrosa
          POSTINST
          sed -i 's/^          //' "${PKG_DIR}/DEBIAN/postinst"
          chmod 755 "${PKG_DIR}/DEBIAN/postinst"

          mkdir -p "${PKG_DIR}/usr/bin"
          cp target/x86_64-unknown-linux-musl/release/ferrosa "${PKG_DIR}/usr/bin/"
          cp target/x86_64-unknown-linux-musl/release/ferrosa-ctl "${PKG_DIR}/usr/bin/"

          mkdir -p "${PKG_DIR}/lib/systemd/system"
          if [ -f systemd/ferrosa.service ]; then
            cp systemd/ferrosa.service "${PKG_DIR}/lib/systemd/system/ferrosa.service"
          else
            cat > "${PKG_DIR}/lib/systemd/system/ferrosa.service" <<SERVICE
          [Unit]
          Description=Ferrosa Database Server
          After=network-online.target
          Wants=network-online.target
          Documentation=https://www.ferrosa.ai

          [Service]
          Type=simple
          User=ferrosa
          Group=ferrosa
          ExecStart=/usr/bin/ferrosa
          Restart=on-failure
          RestartSec=5s
          LimitNOFILE=65536
          LimitMEMLOCK=infinity
          Environment=FERROSA_DATA_DIR=/var/lib/ferrosa
          Environment=FERROSA_LOG_DIR=/var/log/ferrosa
          Environment=RUST_LOG=info

          [Install]
          WantedBy=multi-user.target
          SERVICE
            sed -i 's/^          //' "${PKG_DIR}/lib/systemd/system/ferrosa.service"
          fi

          mkdir -p "${PKG_DIR}/etc/ferrosa"
          mkdir -p "${PKG_DIR}/var/lib/ferrosa"
          mkdir -p "${PKG_DIR}/usr/share/doc/ferrosa"
          echo "Copyright 2026 Ferrosa Contributors. All rights reserved." \
              > "${PKG_DIR}/usr/share/doc/ferrosa/copyright"

          dpkg-deb --build --root-owner-group "$PKG_DIR" "$DEB_FILE"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tarball-x86_64-unknown-linux-musl
          path: |
            dist/ferrosa-*-x86_64-unknown-linux-musl.tar.gz
            dist/ferrosa_*_amd64.deb
          retention-days: 90
          if-no-files-found: error

  # ── Linux aarch64 (musl static, cross-compiled) ──────────────────────
  build-linux-aarch64:
    name: Build Linux aarch64 (musl, cross)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
        with:
          targets: aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: aarch64-musl

      # We use `cross` (https://github.com/cross-rs/cross) for aarch64-musl —
      # simpler than zigbuild for a workspace this size and well-maintained.
      - name: Install cross
        run: cargo install cross --locked --version 0.2.5

      # NOTE: workspace-wide tests are skipped for this target. The runner is
      # x86_64; we cannot natively execute aarch64 binaries here. Clippy still
      # runs as a static-analysis gate.
      - name: Clippy (aarch64-musl)
        run: cross clippy --all-targets --target aarch64-unknown-linux-musl -- -D warnings

      - name: Build aarch64 musl static binaries
        run: |
          cross build --release --target aarch64-unknown-linux-musl -p ferrosa -p ferrosa-ctl --features ferrosa/full
          # `strip` from binutils handles foreign ELF; use the cross toolchain's
          # aarch64 strip if present, fall back to plain strip which on modern
          # binutils is multi-arch capable.
          if command -v aarch64-linux-gnu-strip >/dev/null 2>&1; then
            aarch64-linux-gnu-strip target/aarch64-unknown-linux-musl/release/ferrosa
            aarch64-linux-gnu-strip target/aarch64-unknown-linux-musl/release/ferrosa-ctl
          else
            sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu
            aarch64-linux-gnu-strip target/aarch64-unknown-linux-musl/release/ferrosa
            aarch64-linux-gnu-strip target/aarch64-unknown-linux-musl/release/ferrosa-ctl
          fi

      - name: Stage release tarball
        run: |
          bash .github/scripts/stage-release-tarball.sh \
            aarch64-unknown-linux-musl \
            target/aarch64-unknown-linux-musl/release

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tarball-aarch64-unknown-linux-musl
          path: dist/ferrosa-*-aarch64-unknown-linux-musl.tar.gz
          retention-days: 90
          if-no-files-found: error

  # ── macOS Apple Silicon (aarch64) ─────────────────────────────────────
  build-macos-aarch64:
    name: Build macOS aarch64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install capnproto
        run: brew install capnp

      - name: Clippy
        run: cargo clippy --all-targets --target aarch64-apple-darwin -- -D warnings

      - name: Build aarch64-apple-darwin binaries
        run: |
          cargo build --release --target aarch64-apple-darwin -p ferrosa -p ferrosa-ctl --features ferrosa/full
          strip target/aarch64-apple-darwin/release/ferrosa
          strip target/aarch64-apple-darwin/release/ferrosa-ctl

      - name: Stage release tarball
        run: |
          bash .github/scripts/stage-release-tarball.sh \
            aarch64-apple-darwin \
            target/aarch64-apple-darwin/release

      - name: Package Homebrew bottle (tar.gz)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BOTTLE_DIR="dist/ferrosa/${VERSION}"
          mkdir -p "${BOTTLE_DIR}/bin"
          cp target/aarch64-apple-darwin/release/ferrosa "${BOTTLE_DIR}/bin/"
          cp target/aarch64-apple-darwin/release/ferrosa-ctl "${BOTTLE_DIR}/bin/"

          # Homebrew bottle is a tar.gz rooted at ferrosa/<version>/
          tar czf "dist/ferrosa-${VERSION}.arm64_sonoma.bottle.tar.gz" \
            -C dist ferrosa/${VERSION}
          rm -rf "dist/ferrosa"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tarball-aarch64-apple-darwin
          path: |
            dist/ferrosa-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
            dist/ferrosa-*.arm64_sonoma.bottle.tar.gz
          retention-days: 90
          if-no-files-found: error

  # ── Multi-arch container image (GHCR) ────────────────────────────────
  docker-image:
    name: Build & push container image (GHCR)
    needs:
      - build-linux-x86_64
      - build-linux-aarch64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download Linux musl tarball artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: artifacts

      - name: Extract per-arch binaries into dist/<arch>/
        run: |
          set -euo pipefail
          mkdir -p dist/amd64 dist/arm64
          x86_tar=$(find artifacts -name 'ferrosa-*-x86_64-unknown-linux-musl.tar.gz' | head -n1)
          arm_tar=$(find artifacts -name 'ferrosa-*-aarch64-unknown-linux-musl.tar.gz' | head -n1)
          test -n "$x86_tar" || { echo "ERROR: x86_64 tarball not found" >&2; exit 1; }
          test -n "$arm_tar" || { echo "ERROR: aarch64 tarball not found" >&2; exit 1; }
          tar -xzf "$x86_tar" -C dist/amd64 ./ferrosa ./ferrosa-ctl
          tar -xzf "$arm_tar" -C dist/arm64 ./ferrosa ./ferrosa-ctl
          chmod 0755 dist/amd64/ferrosa dist/amd64/ferrosa-ctl dist/arm64/ferrosa dist/arm64/ferrosa-ctl
          ls -l dist/amd64 dist/arm64

      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository_owner }}/ferrosa"
          REF="${GITHUB_REF_NAME}"          # e.g. v0.13.0 or v2026.06.19.0017
          VERSION="${REF#v}"
          PRERELEASE="${{ github.event.inputs.prerelease }}"
          TAGS=""
          if [ "${PRERELEASE}" = "false" ]; then
            # Stable: latest + full + rolling major.minor + major.
            MAJOR="${VERSION%%.*}"
            MINOR="${VERSION#*.}"; MINOR="${MINOR%%.*}"
            TAGS="${IMAGE}:latest ${IMAGE}:v${VERSION} ${IMAGE}:${MAJOR}.${MINOR} ${IMAGE}:${MAJOR}"
          else
            # Nightly: moving :nightly + the exact CalVer ref.
            TAGS="${IMAGE}:nightly ${IMAGE}:${REF}"
          fi
          echo "Computed tags: ${TAGS}"
          # Emit as space-separated for the build step.
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up buildx (multi-arch)
        run: |
          docker buildx create --name ferrosa-builder --use 2>/dev/null || docker buildx use ferrosa-builder
          docker buildx inspect --bootstrap

      - name: Build and push multi-arch image
        run: |
          set -euo pipefail
          tag_args=()
          for t in ${{ steps.tags.outputs.tags }}; do
            tag_args+=(-t "${t}")
          done
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f Dockerfile.release \
            "${tag_args[@]}" \
            --push \
            .

      - name: Inspect published manifest
        run: |
          first_tag=$(echo "${{ steps.tags.outputs.tags }}" | awk '{print $1}')
          docker buildx imagetools inspect "${first_tag}" || echo "manifest inspect failed (non-fatal; image already pushed)"

  # ── macOS Intel (x86_64) ──────────────────────────────────────────────
  release:
    name: Create Release
    needs:
      - build-linux-x86_64
      - build-linux-aarch64
      - build-macos-aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: artifacts

      - name: Flatten artifacts into dist/
        run: |
          mkdir -p dist
          # Each artifact lives in artifacts/<name>/...; copy everything to dist/
          find artifacts -type f \( -name 'ferrosa-*.tar.gz' -o -name 'ferrosa_*.deb' \) \
            -exec cp -v {} dist/ \;
          ls -lh dist/

      - name: Generate SHA256SUMS
        run: |
          cd dist
          # Deterministic order so the file content is reproducible
          : > SHA256SUMS
          for f in $(ls ferrosa-*.tar.gz ferrosa_*.deb 2>/dev/null | sort); do
            sha256sum "$f" >> SHA256SUMS
          done
          cat SHA256SUMS

      # TODO(human): set up minisign signing.
      # To enable, add the following secrets to the repo:
      #   - MINISIGN_SECRET_KEY: contents of the minisign private key (encrypted)
      #   - MINISIGN_PASSWORD:   passphrase for the key
      # Then uncomment the step below. Public key should be published in the
      # repo (e.g. .github/minisign.pub) and on ferrosadb.com so users can
      # verify with `minisign -V -p minisign.pub -m SHA256SUMS`.
      #
      # - name: Sign SHA256SUMS with minisign
      #   if: env.MINISIGN_SECRET_KEY != ''
      #   env:
      #     MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
      #     MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
      #   run: |
      #     sudo apt-get update && sudo apt-get install -y minisign
      #     printf '%s\n' "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
      #     printf '%s\n%s\n' "$MINISIGN_PASSWORD" "$MINISIGN_PASSWORD" \
      #       | minisign -S -s /tmp/minisign.key -m dist/SHA256SUMS
      #     shred -u /tmp/minisign.key

      - name: List release artifacts
        run: ls -lh dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          NOTES=$(cat <<'NOTES'
          ## What's Included

          Ferrosa is published as compressed tarballs for four target triples:

          | Tarball | Platform |
          |---------|----------|
          | `ferrosa-vVERSION-x86_64-unknown-linux-musl.tar.gz` | Linux x86_64 (static musl) |
          | `ferrosa-vVERSION-aarch64-unknown-linux-musl.tar.gz` | Linux aarch64 (static musl) |
          | `ferrosa-vVERSION-x86_64-apple-darwin.tar.gz` | macOS Intel |
          | `ferrosa-vVERSION-aarch64-apple-darwin.tar.gz` | macOS Apple Silicon |
          | `SHA256SUMS` | Checksums for all tarballs |

          Additional packages:
          - `ferrosa_VERSION_amd64.deb` — Debian/Ubuntu package with systemd unit
          - `ferrosa-VERSION.arm64_sonoma.bottle.tar.gz` — Homebrew bottle for tap install

          ### Verifying downloads

          ```bash
          sha256sum -c SHA256SUMS --ignore-missing
          ```

          ### Quick Start (Linux / macOS)

          ```bash
          tar xzf ferrosa-vVERSION-<target>.tar.gz
          ./ferrosa --help
          ```

          Each tarball contains: `ferrosa`, `ferrosa-ctl`, `LICENSE`, `NOTICE`,
          `README.md`, and platform integration files (`config/`, `launchd/`,
          `systemd/`) where applicable.
          NOTES
          )

          # Replace VERSION placeholder in notes
          NOTES="${NOTES//VERSION/${VERSION}}"

          # Channel policy: every freshly built release is a prerelease (the
          # "nightly" channel). A release becomes "stable" only when a human
          # promotes it (promote-release.yml -> marks it --latest, not pre).
          # Tag-push events carry no input, so they default to prerelease too.
          PRERELEASE="${{ github.event.inputs.prerelease }}"
          if [ "${PRERELEASE}" = "false" ]; then
            REL_FLAGS=(--latest)
          else
            REL_FLAGS=(--prerelease)
          fi

          gh release create "v${VERSION}" dist/* \
            --title "Ferrosa v${VERSION}" \
            --notes "$NOTES" \
            "${REL_FLAGS[@]}"

      - name: Notify Homebrew tap (stable releases only)
        # Fire only for a stable publish (prerelease=false), and only AFTER the
        # release exists above — so the tap's /releases/latest resync sees it.
        if: ${{ github.event.inputs.prerelease == 'false' }}
        env:
          # Fine-grained PAT with contents:write on ferrosadb/homebrew-tap.
          # GITHUB_TOKEN cannot dispatch cross-repo. Absent => skip (hourly cron).
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set; skipping tap notify (hourly cron will sync)."
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${TAP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ferrosadb/homebrew-tap/dispatches \
            -d '{"event_type":"release-promoted"}'
          echo "Dispatched release-promoted to ferrosadb/homebrew-tap."
