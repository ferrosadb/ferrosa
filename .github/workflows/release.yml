name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: >-
          Mark the GitHub release as a prerelease (the "nightly" channel).
          Stable releases are promoted separately via promote-release.yml.
        required: false
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

permissions:
  contents: write

jobs:
  # ── Linux x86_64 (musl static) ───────────────────────────────────────
  build-linux-x86_64:
    name: Build Linux x86_64 (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl tools and capnproto
        run: sudo apt-get update && sudo apt-get install -y musl-tools capnproto


      - name: Clippy
        run: cargo clippy --all-targets --target x86_64-unknown-linux-musl -- -D warnings

      - name: Build x86_64 musl static binaries
        run: |
          cargo build --release --target x86_64-unknown-linux-musl -p ferrosa -p ferrosa-ctl --features ferrosa/full
          strip target/x86_64-unknown-linux-musl/release/ferrosa
          strip target/x86_64-unknown-linux-musl/release/ferrosa-ctl
          file target/x86_64-unknown-linux-musl/release/ferrosa target/x86_64-unknown-linux-musl/release/ferrosa-ctl

      - name: Stage release tarball
        run: |
          VERSION="$(bash .github/scripts/release-version.sh "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER")"
          FERROSA_RELEASE_TAG="v${VERSION}" bash .github/scripts/stage-release-tarball.sh \
            x86_64-unknown-linux-musl \
            target/x86_64-unknown-linux-musl/release

      - name: Build Debian package
        run: |
          VERSION="$(bash .github/scripts/release-version.sh "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER")"
          ARCH="amd64"
          PKG_DIR="dist/ferrosa_${VERSION}_${ARCH}"
          DEB_FILE="dist/ferrosa_${VERSION}_${ARCH}.deb"

          mkdir -p "${PKG_DIR}/DEBIAN"
          cat > "${PKG_DIR}/DEBIAN/control" <<CTRL
          Package: ferrosa
          Version: ${VERSION}
          Section: database
          Priority: optional
          Architecture: ${ARCH}
          Depends: ca-certificates
          Maintainer: Ferrosa Team <ferrosa@ferrosadb.com>
          Homepage: https://www.ferrosa.ai
          Description: CQL-compatible distributed database with S3-backed storage
           Ferrosa is a Rust reimplementation of Apache Cassandra with S3-backed
           storage, pluggable secondary indexes, built-in graph queries, and
           pair-mode high availability with automatic failover.
          CTRL
          sed -i 's/^          //' "${PKG_DIR}/DEBIAN/control"

          cat > "${PKG_DIR}/DEBIAN/postinst" <<'POSTINST'
          #!/bin/sh
          set -e
          if ! id -u ferrosa >/dev/null 2>&1; then
              useradd --system --no-create-home --shell /usr/sbin/nologin ferrosa
          fi
          mkdir -p /var/lib/ferrosa && chown ferrosa:ferrosa /var/lib/ferrosa
          mkdir -p /var/log/ferrosa && chown ferrosa:ferrosa /var/log/ferrosa
          POSTINST
          sed -i 's/^          //' "${PKG_DIR}/DEBIAN/postinst"
          chmod 755 "${PKG_DIR}/DEBIAN/postinst"

          mkdir -p "${PKG_DIR}/usr/bin"
          cp target/x86_64-unknown-linux-musl/release/ferrosa "${PKG_DIR}/usr/bin/"
          cp target/x86_64-unknown-linux-musl/release/ferrosa-ctl "${PKG_DIR}/usr/bin/"

          mkdir -p "${PKG_DIR}/lib/systemd/system"
          if [ -f systemd/ferrosa.service ]; then
            cp systemd/ferrosa.service "${PKG_DIR}/lib/systemd/system/ferrosa.service"
          else
            cat > "${PKG_DIR}/lib/systemd/system/ferrosa.service" <<SERVICE
          [Unit]
          Description=Ferrosa Database Server
          After=network-online.target
          Wants=network-online.target
          Documentation=https://www.ferrosa.ai

          [Service]
          Type=simple
          User=ferrosa
          Group=ferrosa
          ExecStart=/usr/bin/ferrosa
          Restart=on-failure
          RestartSec=5s
          LimitNOFILE=65536
          LimitMEMLOCK=infinity
          Environment=FERROSA_DATA_DIR=/var/lib/ferrosa
          Environment=FERROSA_LOG_DIR=/var/log/ferrosa
          Environment=RUST_LOG=info

          [Install]
          WantedBy=multi-user.target
          SERVICE
            sed -i 's/^          //' "${PKG_DIR}/lib/systemd/system/ferrosa.service"
          fi

          mkdir -p "${PKG_DIR}/etc/ferrosa"
          mkdir -p "${PKG_DIR}/var/lib/ferrosa"
          mkdir -p "${PKG_DIR}/usr/share/doc/ferrosa"
          echo "Copyright 2026 Ferrosa Contributors. All rights reserved." \
              > "${PKG_DIR}/usr/share/doc/ferrosa/copyright"

          dpkg-deb --build --root-owner-group "$PKG_DIR" "$DEB_FILE"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball-x86_64-unknown-linux-musl
          path: |
            dist/ferrosa-*-x86_64-unknown-linux-musl.tar.gz
            dist/ferrosa_*_amd64.deb
          retention-days: 90
          if-no-files-found: error

  # ── Linux aarch64 (musl static, native) ──────────────────────────────
  build-linux-aarch64:
    name: Build Linux aarch64 (musl)
    # Native arm64 hosted runner, free for a public repository. This replaced a
    # `cross` (docker) build on x86_64: no emulation, no cross toolchain, and
    # the binaries can be executed on the machine that built them.
    runs-on: ubuntu-24.04-arm
    env:
      # musl-gcc for C dependencies and the final link, the same as the x86_64
      # musl target in .cargo/config.toml. Without it cc-rs would compile C
      # against the runner's glibc headers.
      CC_aarch64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      # Ubuntu's musl-gcc links the distro (glibc) libgcc.a, whose aarch64
      # outline-atomics init calls glibc's private __getauxval. Any C object
      # using atomics then fails to link, so jemalloc's configure finds no
      # atomics and its build stops. Inline LL/SC atomics avoid libgcc's
      # helpers; they are also what the old `cross` toolchain produced.
      CFLAGS_aarch64_unknown_linux_musl: -mno-outline-atomics
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
        with:
          targets: aarch64-unknown-linux-musl
      - name: Install musl tools and capnproto
        run: sudo apt-get update && sudo apt-get install -y musl-tools capnproto

      - name: Clippy (aarch64-musl)
        run: cargo clippy --all-targets --target aarch64-unknown-linux-musl -- -D warnings

      - name: Build aarch64 musl static binaries
        run: |
          cargo build --release --target aarch64-unknown-linux-musl -p ferrosa -p ferrosa-ctl --features ferrosa/full
          strip target/aarch64-unknown-linux-musl/release/ferrosa
          strip target/aarch64-unknown-linux-musl/release/ferrosa-ctl
          file target/aarch64-unknown-linux-musl/release/ferrosa target/aarch64-unknown-linux-musl/release/ferrosa-ctl
          # Native runner: prove the shipped binaries start before packaging.
          target/aarch64-unknown-linux-musl/release/ferrosa --version
          target/aarch64-unknown-linux-musl/release/ferrosa-ctl --version

      - name: Stage release tarball
        run: |
          VERSION="$(bash .github/scripts/release-version.sh "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER")"
          FERROSA_RELEASE_TAG="v${VERSION}" bash .github/scripts/stage-release-tarball.sh \
            aarch64-unknown-linux-musl \
            target/aarch64-unknown-linux-musl/release

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball-aarch64-unknown-linux-musl
          path: dist/ferrosa-*-aarch64-unknown-linux-musl.tar.gz
          retention-days: 90
          if-no-files-found: error

  # ── macOS Apple Silicon (aarch64) ─────────────────────────────────────
  build-macos-aarch64:
    name: Build macOS aarch64
    # HOSTED, not the self-hosted Mac, and this job is the reason releases
    # stopped producing a macOS artifact.
    #
    # ferrosa is a PUBLIC repository, and GitHub does not offer self-hosted
    # runners to a public repo's workflows at an arbitrary ref — only on the
    # default branch. This workflow is triggered by `push: tags: v*`, so every
    # release run sits at `refs/tags/...` and the job queued forever with no
    # runner assigned. Four releases (v2026.09.10.2254 through
    # v2026.09.11.0545) stalled this way: their Linux jobs finished in minutes
    # on hosted runners while this one never started, so no release published
    # and the installer manifest could not be repinned.
    #
    # The evidence, gathered 2026-09-11:
    #
    #   * ferrosa (public) self-hosted jobs at a MAIN ref — install-smoke,
    #     driver-tests — dispatch and succeed on macbook-m5max.
    #   * ferrosa (public) self-hosted jobs at a TAG ref never dispatch, with
    #     both Mac runners online and idle.
    #   * ferrosa-memory-private (PRIVATE) dispatches the same label set at a
    #     tag ref without trouble.
    #
    # The runner group's `allows_public_repositories=true` admits the repo; it
    # does not lift the ref constraint. Removing the group's workflow
    # restriction changed nothing, and neither did restarting the runner or
    # moving runners between groups — all three were tried first.
    #
    # macOS minutes bill at 10x, which is why the rest of the fleet is
    # self-hosted. This job is the exception because a release cannot be cut
    # any other way while the repo is public: it runs only on a tag push, not
    # per-commit. If ferrosa goes private, or the release moves to a
    # main-ref trigger, put it back on `[self-hosted, macOS, ARM64]`.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
        with:
          targets: aarch64-apple-darwin
      - name: Install capnproto
        run: |
          if brew tap | grep -qx 'aws/tap'; then
            brew untap aws/tap
          fi
          brew install capnp

      - name: Clippy
        run: cargo clippy --all-targets --target aarch64-apple-darwin -- -D warnings

      - name: Build aarch64-apple-darwin binaries
        run: |
          cargo build --release --target aarch64-apple-darwin -p ferrosa -p ferrosa-ctl --features ferrosa/full
          strip target/aarch64-apple-darwin/release/ferrosa
          strip target/aarch64-apple-darwin/release/ferrosa-ctl

      - name: Stage release tarball
        run: |
          VERSION="$(bash .github/scripts/release-version.sh "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER")"
          FERROSA_RELEASE_TAG="v${VERSION}" bash .github/scripts/stage-release-tarball.sh \
            aarch64-apple-darwin \
            target/aarch64-apple-darwin/release

      - name: Package Homebrew bottle (tar.gz)
        run: |
          VERSION="$(bash .github/scripts/release-version.sh "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER")"
          BOTTLE_DIR="dist/ferrosa/${VERSION}"
          mkdir -p "${BOTTLE_DIR}/bin"
          cp target/aarch64-apple-darwin/release/ferrosa "${BOTTLE_DIR}/bin/"
          cp target/aarch64-apple-darwin/release/ferrosa-ctl "${BOTTLE_DIR}/bin/"

          # Homebrew bottle is a tar.gz rooted at ferrosa/<version>/
          tar czf "dist/ferrosa-${VERSION}.arm64_sonoma.bottle.tar.gz" \
            -C dist "ferrosa/${VERSION}"
          rm -rf "dist/ferrosa"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball-aarch64-apple-darwin
          path: |
            dist/ferrosa-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
            dist/ferrosa-*.arm64_sonoma.bottle.tar.gz
          retention-days: 90
          if-no-files-found: error

  # ── Multi-arch container image (GHCR) ────────────────────────────────
  docker-image:
    name: Build & push container image (GHCR)
    needs:
      - build-linux-x86_64
      - build-linux-aarch64
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download Linux musl tarball artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/download-run-artifacts.sh \
            "${GITHUB_RUN_ID}" \
            "${GITHUB_REPOSITORY}" \
            artifacts

      - name: Extract per-arch binaries into dist/<arch>/
        run: |
          set -euo pipefail
          mkdir -p dist/amd64 dist/arm64
          x86_tar=$(find artifacts -name 'ferrosa-*-x86_64-unknown-linux-musl.tar.gz' | head -n1)
          arm_tar=$(find artifacts -name 'ferrosa-*-aarch64-unknown-linux-musl.tar.gz' | head -n1)
          test -n "$x86_tar" || { echo "ERROR: x86_64 tarball not found" >&2; exit 1; }
          test -n "$arm_tar" || { echo "ERROR: aarch64 tarball not found" >&2; exit 1; }
          tar -xzf "$x86_tar" -C dist/amd64 ./ferrosa ./ferrosa-ctl
          tar -xzf "$arm_tar" -C dist/arm64 ./ferrosa ./ferrosa-ctl
          chmod 0755 dist/amd64/ferrosa dist/amd64/ferrosa-ctl dist/arm64/ferrosa dist/arm64/ferrosa-ctl
          ls -l dist/amd64 dist/arm64

      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository_owner }}/ferrosa"
          VERSION="$(bash .github/scripts/release-version.sh "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER")"
          REF="v${VERSION}"                 # e.g. v0.13.0 or v0.0.0-main.123
          PRERELEASE="${{ github.event.inputs.prerelease }}"
          TAGS=""
          if [ "${PRERELEASE}" = "false" ]; then
            # Stable: latest + full + rolling major.minor + major.
            MAJOR="${VERSION%%.*}"
            MINOR="${VERSION#*.}"; MINOR="${MINOR%%.*}"
            TAGS="${IMAGE}:latest ${IMAGE}:v${VERSION} ${IMAGE}:${MAJOR}.${MINOR} ${IMAGE}:${MAJOR}"
          else
            # Nightly: moving :nightly + the exact CalVer ref.
            TAGS="${IMAGE}:nightly ${IMAGE}:${REF}"
          fi
          echo "Computed tags: ${TAGS}"
          # Emit as space-separated for the build step.
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up buildx (multi-arch)
        run: |
          docker buildx create --name ferrosa-builder --use 2>/dev/null || docker buildx use ferrosa-builder
          docker buildx inspect --bootstrap

      - name: Build and push multi-arch image
        run: |
          set -euo pipefail
          tag_args=()
          for t in ${{ steps.tags.outputs.tags }}; do
            tag_args+=(-t "${t}")
          done
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f Dockerfile.release \
            "${tag_args[@]}" \
            --push \
            .

      - name: Inspect published manifest
        run: |
          first_tag=$(echo "${{ steps.tags.outputs.tags }}" | awk '{print $1}')
          docker buildx imagetools inspect "${first_tag}"

  # ── Linux glibc (dynamic) binaries, built once for both glibc images ──
  #
  # Built here rather than inside the image build so the two glibc images share
  # one compilation per arch, the same way Dockerfile.release consumes the musl
  # tarballs instead of compiling. One variant is stripped (production), one
  # deliberately is not (profiling, full DWARF).
  build-linux-gnu:
    name: Build Linux ${{ matrix.arch }} (glibc)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      # The Dockerfile.glibc base is pinned to Debian trixie (glibc 2.41). A glibc
      # binary built against a newer runtime links fine and then fails at RUN
      # time, so the version the binary actually needs is asserted below rather
      # than assumed from the runner. Bump this together with that digest.
      GLIBC_RUNTIME_MAX: "2.41"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
      - name: Install glibc build dependencies
        # libunwind-dev: jemalloc's heap profiler needs unw_backtrace. On glibc
        # the distro headers and library satisfy its configure directly, unlike
        # the musl target which has to hand-build libunwind.
        run: sudo apt-get update && sudo apt-get install -y capnproto libunwind-dev

      - name: Build production binaries (glibc, stripped)
        run: |
          set -euo pipefail
          cargo build --locked --release --target ${{ matrix.target }} \
            -p ferrosa -p ferrosa-ctl --features ferrosa/full
          strip "target/${{ matrix.target }}/release/ferrosa" \
                "target/${{ matrix.target }}/release/ferrosa-ctl"
          file "target/${{ matrix.target }}/release/ferrosa"
          if readelf --sections "target/${{ matrix.target }}/release/ferrosa" | grep -q '\.debug_info'; then
            echo "::error::production binary still carries .debug_info; the strip step did not take" >&2
            exit 1
          fi
          required="$(objdump -T "target/${{ matrix.target }}/release/ferrosa" \
            | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -n1 | sed 's/^GLIBC_//')"
          test -n "$required" || { echo "::error::could not read a GLIBC_ requirement from the binary" >&2; exit 1; }
          echo "binary requires glibc ${required}; pinned runtime provides ${GLIBC_RUNTIME_MAX}"
          if [ "$(printf '%s\n%s\n' "$GLIBC_RUNTIME_MAX" "$required" | sort -V | tail -n1)" != "$GLIBC_RUNTIME_MAX" ]; then
            echo "::error::binary needs glibc ${required} but the pinned runtime base provides ${GLIBC_RUNTIME_MAX}" >&2
            exit 1
          fi

      - name: Build profiling binary (glibc, full DWARF)
        run: |
          set -euo pipefail
          # force-frame-pointers so perf and jemalloc's profiler can walk stacks
          # through optimized code; [profile.profiling] keeps full DWARF while
          # retaining release optimizations, and this binary is NOT stripped.
          export RUSTFLAGS="${RUSTFLAGS:-} -C force-frame-pointers=yes"
          cargo build --locked --profile profiling --target ${{ matrix.target }} \
            -p ferrosa --bin ferrosa --features ferrosa/full,ferrosa/profiling
          profiling_binary="target/${{ matrix.target }}/profiling/ferrosa"
          test -x "$profiling_binary"
          readelf --sections "$profiling_binary" | grep -q '\.debug_info'
          "$profiling_binary" --version
          ldd "$profiling_binary" || true
          # Prove the shipped profiling binary can actually EMIT a heap profile.
          # Symbols are useless if jemalloc's runtime profiler is inert, and on
          # musl that was a live failure mode (wrong backtracer -> segfault on
          # the first sampled allocation). On glibc the distro's libunwind-dev
          # satisfies jemalloc's configure directly, so the musl-only
          # hand-built-libunwind + `ld --start-group` dance is not needed --
          # but the end-to-end probe still is.
          MALLOC_CONF="prof:true,prof_active:true,prof_final:true,lg_prof_sample:0,prof_prefix:$RUNNER_TEMP/ferrosa-profile" \
            "$profiling_binary" --version
          profile_file=$(find "$RUNNER_TEMP" -maxdepth 1 -name 'ferrosa-profile.*.heap' -print -quit)
          test -s "$profile_file"

      - name: Stage both variants for the image build
        run: |
          set -euo pipefail
          mkdir -p "dist/gnu/${{ matrix.arch }}/production" "dist/gnu/${{ matrix.arch }}/profiling"
          install -m 0755 "target/${{ matrix.target }}/release/ferrosa"     "dist/gnu/${{ matrix.arch }}/production/ferrosa"
          install -m 0755 "target/${{ matrix.target }}/release/ferrosa-ctl" "dist/gnu/${{ matrix.arch }}/production/ferrosa-ctl"
          install -m 0755 "target/${{ matrix.target }}/profiling/ferrosa"   "dist/gnu/${{ matrix.arch }}/profiling/ferrosa"
          tar -czf "dist/ferrosa-gnu-${{ matrix.arch }}.tar.gz" \
            -C "dist/gnu/${{ matrix.arch }}" production profiling

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball-gnu-${{ matrix.arch }}
          path: dist/ferrosa-gnu-${{ matrix.arch }}.tar.gz
          retention-days: 90
          if-no-files-found: error

  # ── glibc container images: production and profiling ─────────────────
  docker-image-glibc:
    name: Build & push glibc images (GHCR)
    needs:
      - build-linux-gnu
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download glibc binary artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/download-run-artifacts.sh \
            "${GITHUB_RUN_ID}" \
            "${GITHUB_REPOSITORY}" \
            artifacts

      - name: Extract both variants per arch
        run: |
          set -euo pipefail
          mkdir -p dist/amd64 dist/arm64
          for arch in amd64 arm64; do
            tarball=$(find artifacts -name "ferrosa-gnu-${arch}.tar.gz" -print -quit)
            test -n "$tarball" || { echo "ERROR: glibc tarball for ${arch} not found" >&2; exit 1; }
            tar -xzf "$tarball" -C "dist/${arch}"
          done
          ls -l dist/amd64/production dist/amd64/profiling dist/arm64/production dist/arm64/profiling

      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository_owner }}/ferrosa"
          VERSION="$(bash .github/scripts/release-version.sh "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER")"
          PRERELEASE="${{ github.event.inputs.prerelease }}"
          if [ "${PRERELEASE}" = "false" ]; then
            # Stable: the same tag set the musl image gets, suffixed so neither
            # image can overwrite the other.
            MAJOR="${VERSION%%.*}"
            MINOR="${VERSION#*.}"; MINOR="${MINOR%%.*}"
            PRODUCTION="${IMAGE}:latest-glibc ${IMAGE}:v${VERSION}-glibc ${IMAGE}:${MAJOR}.${MINOR}-glibc ${IMAGE}:${MAJOR}-glibc"
            PROFILING="${IMAGE}:latest-glibc-profiling ${IMAGE}:v${VERSION}-glibc-profiling ${IMAGE}:${MAJOR}.${MINOR}-glibc-profiling ${IMAGE}:${MAJOR}-glibc-profiling"
          else
            # Nightly: moving channel tag plus the exact CalVer ref.
            PRODUCTION="${IMAGE}:nightly-glibc ${IMAGE}:v${VERSION}-glibc"
            PROFILING="${IMAGE}:nightly-glibc-profiling ${IMAGE}:v${VERSION}-glibc-profiling"
          fi
          echo "Production tags: ${PRODUCTION}"
          echo "Profiling tags:  ${PROFILING}"
          echo "production=${PRODUCTION}" >> "$GITHUB_OUTPUT"
          echo "profiling=${PROFILING}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up buildx (multi-arch)
        run: |
          docker buildx create --name ferrosa-glibc-builder --use 2>/dev/null || docker buildx use ferrosa-glibc-builder
          docker buildx inspect --bootstrap

      - name: Build and push production glibc image
        run: |
          set -euo pipefail
          tag_args=()
          for t in ${{ steps.tags.outputs.production }}; do
            tag_args+=(-t "${t}")
          done
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --target production \
            -f Dockerfile.glibc \
            "${tag_args[@]}" \
            --push \
            .

      - name: Build and push profiling glibc image
        run: |
          set -euo pipefail
          tag_args=()
          for t in ${{ steps.tags.outputs.profiling }}; do
            tag_args+=(-t "${t}")
          done
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --target profiling \
            -f Dockerfile.glibc \
            "${tag_args[@]}" \
            --push \
            .

  # ── Downloadable production and profiling OCI archives ───────────────
  publish-oci-downloads:
    name: Publish ${{ matrix.image }} OCI / ${{ matrix.arch }}
    # Consumes the glibc binaries from build-linux-gnu (production + profiling
    # variants, already built once per arch) and packages them with the SAME
    # Dockerfile.glibc targets the GHCR images use. Previously this job consumed
    # the musl tarballs and recompiled the profiling binary from source on the
    # runner to satisfy musl's libunwind requirement -- a second build of the
    # same thing, with its own failure modes. glibc needs no such workaround.
    needs:
      - build-linux-gnu
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            image: ferrosa-minimal
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            image: ferrosa-minimal
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            image: ferrosa-profiling
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            image: ferrosa-profiling
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download the release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/download-run-artifacts.sh \
            "${GITHUB_RUN_ID}" \
            "${GITHUB_REPOSITORY}" \
            artifacts

      - name: Stage the glibc binaries for the image build
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.arch }}"
          tarball=$(find artifacts -name "ferrosa-gnu-${{ matrix.arch }}.tar.gz" -print -quit)
          test -n "$tarball" || { echo "ERROR: glibc tarball for ${{ matrix.arch }} not found" >&2; exit 1; }
          # Contains production/ and profiling/ side by side; Dockerfile.glibc
          # picks the variant by build target.
          tar -xzf "$tarball" -C "dist/${{ matrix.arch }}"
          ls -l "dist/${{ matrix.arch }}/production" "dist/${{ matrix.arch }}/profiling"



      - name: Build a single-architecture OCI archive
        run: |
          set -euo pipefail
          docker buildx create --name ferrosa-oci --use 2>/dev/null || docker buildx use ferrosa-oci
          docker buildx inspect --bootstrap
          mkdir -p "$RUNNER_TEMP/stage/oci"
          # ferrosa-minimal is the stripped production image; ferrosa-profiling
          # is the DWARF + perf/jeprof image. Same targets the GHCR images ship.
          target=production
          [ "${{ matrix.image }}" = "ferrosa-profiling" ] && target=profiling
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --target "$target" \
            -f Dockerfile.glibc \
            --output "type=oci,dest=$RUNNER_TEMP/stage/oci/oci.tar" \
            .
          tar -tf "$RUNNER_TEMP/stage/oci/oci.tar" | grep -qx 'index.json'

      - name: Check out the pinned image publisher
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ferrosadb/ferrosa-installer
          ref: 4f35fbe7c03ef8bcc07b1f2e37736f756046ce69
          path: .image-publisher
          token: ${{ secrets.FERROSA_COMPONENTS_TOKEN }}

      - name: Install the image publisher's upload dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/r2-publisher"
          "$RUNNER_TEMP/r2-publisher/bin/pip" install boto3==1.40.0

      - name: Select immutable publication identity
        id: identity
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA::12}"
          fi
          if [[ "$GITHUB_EVENT_NAME" == push || "${{ github.event.inputs.prerelease }}" == false ]]; then
            channel=stable
          else
            channel=nightly
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Publish immutable OCI archive with manifest and checksum
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          FERROSA_IMAGE_UPLOAD: s3
          FERROSA_IMAGE_PYTHON: ${{ runner.temp }}/r2-publisher/bin/python
          FERROSA_R2_BUCKET: ${{ vars.FERROSA_R2_BUCKET || 'downloads' }}
        run: |
          set -euo pipefail
          prefix="images/${{ matrix.arch }}/${{ steps.identity.outputs.channel }}/${{ matrix.image }}/linux/oci"
          .image-publisher/scripts/publish-images.sh \
            --kind linux --name "${{ steps.identity.outputs.version }}" \
            --prefix "$prefix" --dir "$RUNNER_TEMP/stage/oci" \
            --version "${{ steps.identity.outputs.version }}"
          echo "OCI archive: https://downloads.ferrosa.ai/${prefix}/${{ steps.identity.outputs.version }}/oci.tar" >> "$GITHUB_STEP_SUMMARY"
          echo "Ferrosa source revision: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

  # ── macOS Intel (x86_64) ──────────────────────────────────────────────
  release:
    name: Create Release
    needs:
      - build-linux-x86_64
      - build-linux-aarch64
      - build-macos-aarch64
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/download-run-artifacts.sh \
            "${GITHUB_RUN_ID}" \
            "${GITHUB_REPOSITORY}" \
            artifacts

      - name: Flatten artifacts into dist/
        run: |
          mkdir -p dist
          # Each artifact lives in artifacts/<name>/...; copy everything to dist/
          find artifacts -type f \( -name 'ferrosa-*.tar.gz' -o -name 'ferrosa_*.deb' \) \
            -exec cp -v {} dist/ \;
          ls -lh dist/

      - name: Generate SHA256SUMS
        run: |
          cd dist
          # Deterministic order so the file content is reproducible
          : > SHA256SUMS
          find . -maxdepth 1 -type f \
            \( -name 'ferrosa-*.tar.gz' -o -name 'ferrosa_*.deb' \) \
            -printf '%f\0' \
            | sort -z \
            | while IFS= read -r -d '' f; do
                sha256sum "$f" >> SHA256SUMS
              done
          cat SHA256SUMS

      # TODO(human): set up minisign signing.
      # To enable, add the following secrets to the repo:
      #   - MINISIGN_SECRET_KEY: contents of the minisign private key (encrypted)
      #   - MINISIGN_PASSWORD:   passphrase for the key
      # Then uncomment the step below. Public key should be published in the
      # repo (e.g. .github/minisign.pub) and on ferrosadb.com so users can
      # verify with `minisign -V -p minisign.pub -m SHA256SUMS`.
      #
      # - name: Sign SHA256SUMS with minisign
      #   if: env.MINISIGN_SECRET_KEY != ''
      #   env:
      #     MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
      #     MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
      #   run: |
      #     sudo apt-get update && sudo apt-get install -y minisign
      #     printf '%s\n' "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
      #     printf '%s\n%s\n' "$MINISIGN_PASSWORD" "$MINISIGN_PASSWORD" \
      #       | minisign -S -s /tmp/minisign.key -m dist/SHA256SUMS
      #     shred -u /tmp/minisign.key

      - name: List release artifacts
        run: ls -lh dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(bash .github/scripts/release-version.sh "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER")"

          NOTES=$(cat <<'NOTES'
          ## What's Included

          Ferrosa is published as compressed tarballs for four target triples:

          | Tarball | Platform |
          |---------|----------|
          | `ferrosa-vVERSION-x86_64-unknown-linux-musl.tar.gz` | Linux x86_64 (static musl) |
          | `ferrosa-vVERSION-aarch64-unknown-linux-musl.tar.gz` | Linux aarch64 (static musl) |
          | `ferrosa-vVERSION-x86_64-apple-darwin.tar.gz` | macOS Intel |
          | `ferrosa-vVERSION-aarch64-apple-darwin.tar.gz` | macOS Apple Silicon |
          | `SHA256SUMS` | Checksums for all tarballs |

          Additional packages:
          - `ferrosa_VERSION_amd64.deb` — Debian/Ubuntu package with systemd unit
          - `ferrosa-VERSION.arm64_sonoma.bottle.tar.gz` — Homebrew bottle for tap install

          ### Container images

          `ghcr.io/ferrosadb/ferrosa`, multi-arch (linux/amd64, linux/arm64):

          | Tag | Runtime | Binary |
          |-----|---------|--------|
          | `vVERSION`, `nightly`/`latest` | Alpine (musl) | static, stripped |
          | `vVERSION-glibc` | Debian (glibc 2.41) | dynamic, stripped |
          | `vVERSION-glibc-profiling` | Debian (glibc 2.41) | dynamic, full DWARF, unstripped |

          The `-glibc` images run the same engine on glibc rather than musl. The
          `-glibc-profiling` image exists to make profiles resolvable: it is built
          with `--profile profiling` (full DWARF, frame pointers) and shipped
          unstripped, with `perf` for CPU flame graphs and `jeprof` for jemalloc
          heap profiles. Use the production image for measurement and the
          profiling image when you need to explain what a measurement is made of.

          ### Downloadable OCI archives

          The same two images are published as OCI archives on
          `downloads.ferrosa.ai` for scripted or air-gapped fetches, so a
          performance rig does not need GHCR credentials:

          ```
          https://downloads.ferrosa.ai/images/<arch>/<channel>/<image>/linux/oci/<version>/oci.tar
          ```

          - `<arch>`: `amd64` or `arm64`
          - `<channel>`: `nightly` or `stable`
          - `<image>`: `ferrosa-minimal` (production) or `ferrosa-profiling`
          - `<version>`: the release version without the leading `v`

          Each version directory also carries `MANIFEST` and `SHA256SUMS`.
          Both images carry the glibc binaries; `ferrosa-profiling` adds `perf`,
          `gdb` and `jeprof`. Load and run with:

          ```bash
          curl -fLO https://downloads.ferrosa.ai/images/amd64/nightly/ferrosa-profiling/linux/oci/VERSION/oci.tar
          podman load -i oci.tar
          ```

          ### Verifying downloads

          ```bash
          sha256sum -c SHA256SUMS --ignore-missing
          ```

          ### Quick Start (Linux / macOS)

          ```bash
          tar xzf ferrosa-vVERSION-<target>.tar.gz
          ./ferrosa --help
          ```

          Each tarball contains: `ferrosa`, `ferrosa-ctl`, `LICENSE`, `NOTICE`,
          `README.md`, and platform integration files (`config/`, `launchd/`,
          `systemd/`) where applicable.
          NOTES
          )

          # Replace VERSION placeholder in notes
          NOTES="${NOTES//VERSION/${VERSION}}"

          # Channel policy: every freshly built release is a prerelease (the
          # "nightly" channel). A release becomes "stable" only when a human
          # promotes it (promote-release.yml -> marks it --latest, not pre).
          # Tag-push events carry no input, so they default to prerelease too.
          PRERELEASE="${{ github.event.inputs.prerelease }}"
          if [ "${PRERELEASE}" = "false" ]; then
            REL_FLAGS=(--latest)
          else
            REL_FLAGS=(--prerelease)
          fi

          gh release create "v${VERSION}" dist/* \
            --title "Ferrosa v${VERSION}" \
            --notes "$NOTES" \
            "${REL_FLAGS[@]}"

      - name: Notify Homebrew tap (stable releases only)
        # Fire only for a stable publish (prerelease=false), and only AFTER the
        # release exists above — so the tap's /releases/latest resync sees it.
        if: ${{ github.event.inputs.prerelease == 'false' }}
        env:
          # Fine-grained PAT with contents:write on ferrosadb/homebrew-tap.
          # GITHUB_TOKEN cannot dispatch cross-repo. Absent => skip (hourly cron).
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set; skipping tap notify (hourly cron will sync)."
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${TAP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ferrosadb/homebrew-tap/dispatches \
            -d '{"event_type":"release-promoted"}'
          echo "Dispatched release-promoted to ferrosadb/homebrew-tap."

  # Any failed job here means the release is missing or incomplete; tell the
  # ops channel. Needs every job so a failure anywhere is reported.
  alert-ops:
    name: Alert the ops channel (release failed)
    needs:
      - build-linux-x86_64
      - build-linux-aarch64
      - build-macos-aarch64
      - build-linux-gnu
      - docker-image
      - docker-image-glibc
      - publish-oci-downloads
      - release
    # Only for runs that were meant to release; PR / merge-queue checks report on the PR.
    if: failure() && github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Post to Slack as the ops bot
        env:
          SLACK_TOKEN: ${{ secrets.FERROSA_OPS_SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ vars.FERROSA_OPS_SLACK_CHANNEL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          if [ -z "$SLACK_TOKEN" ] || [ -z "$SLACK_CHANNEL" ]; then
            echo "::error::${WORKFLOW} failed and the ops alert is not configured (FERROSA_OPS_SLACK_BOT_TOKEN / FERROSA_OPS_SLACK_CHANNEL); nobody was told"
            exit 1
          fi
          text=":rotating_light: *${GITHUB_REPOSITORY}*: ${WORKFLOW} failed on \`${GITHUB_SHA::8}\` (${GITHUB_EVENT_NAME}, ${GITHUB_REF_NAME}). No release was produced. ${RUN_URL}"
          body=$(jq -n --arg c "$SLACK_CHANNEL" --arg t "$text" '{channel: $c, text: $t, unfurl_links: false}')
          # The token reaches curl on stdin, never on its command line.
          resp=$(printf 'Authorization: Bearer %s\n' "$SLACK_TOKEN" | curl -sS --max-time 20 -H @- \
            -H 'Content-Type: application/json; charset=utf-8' --data "$body" https://slack.com/api/chat.postMessage)
          if [ "$(jq -r '.ok' <<<"$resp")" != true ]; then
            echo "::error::the ops alert was NOT delivered: $(jq -r '.error // "no error field"' <<<"$resp")"
            exit 1
          fi
          echo "ops alert posted"
