version: 2
updates:
  # SHA-pinned third-party GitHub Actions: dependabot resolves new versions
  # to fresh SHA pins and opens PRs weekly. Without this the pins decay
  # into unmaintained "frozen at vX.Y.Z" forever — itself a supply-chain
  # risk (a CVE in the pinned vX.Y.Z stays in our pipeline).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Cargo: keep Rust deps current to surface CVEs early. The root workspace
  # plus every separately locked workspace (each has its own Cargo.lock;
  # .github/workflows/security.yml audits the same list).
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/ferrosa-jsonb-conformance"
      - "/ferrosa-sstable/fuzz"
      - "/examples/timeseries-rrd/wasm-rust/rms"
      - "/examples/timeseries-rrd/wasm-rust/stddev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Python driver test harnesses and the drop-in driver package.
  - package-ecosystem: "pip"
    directories:
      - "/drivers"
      - "/ferrosa-jepsen/drivers/python"
      - "/tests/drivers/python"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Go driver test harnesses.
  - package-ecosystem: "gomod"
    directories:
      - "/ferrosa-jepsen/drivers/go"
      - "/tests/drivers/go"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    groups:
      gomod-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # The AssemblyScript UDF proof of concept.
  - package-ecosystem: "npm"
    directory: "/ferrosa-udf/examples/asc-poc"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
