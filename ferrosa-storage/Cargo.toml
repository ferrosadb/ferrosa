[package]
name = "ferrosa-storage"
description = "Single-node storage engine for Ferrosa: memtable, flush, merge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ferrosa-common = { path = "../ferrosa-common" }
ferrosa-sched = { path = "../ferrosa-sched" }
ferrosa-cdc = { path = "../ferrosa-cdc" }
ferrosa-index = { path = "../ferrosa-index" }
ferrosa-row-bridge = { path = "../ferrosa-row-bridge" }
ferrosa-schema = { path = "../ferrosa-schema" }
ferrosa-sstable = { path = "../ferrosa-sstable" }
arc-swap = "1.7"
parking_lot = "0.12"
crc32fast = "1"
# CancelToken's closed channel and the compaction executor's task/result
# queues (T-021, decisions.md D7): crossbeam bounded channels + blocking
# select!, no polling.
crossbeam-channel = "0.5"
# Scalar index sidecars are read through a memory map (t_7ac6b0e3); same
# version ferrosa-sstable maps its Partitions/Rows components with.
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
object_store = { version = "0.11", features = ["aws"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "fs", "io-util"] }
futures = "0.3"
async-trait = "0.1"
bytes = "1"
fs2 = "0.4"
rayon = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
crossbeam-skiplist = { version = "0.1", optional = true }
dashmap = "6"
hex = "0.4"
smallvec = "1"
tracing = "0.1"
# Unconditional (not just cfg(target_os = "macos")) so `posix_fadvise` is
# available on Linux too: the flush-publication digest verification (T-012)
# advises the kernel to drop the pages it re-reads to check Data.db's
# Digest.crc32, on whichever OS this crate is actually built for.
libc = "0.2"
ureq = { version = "3", features = ["json"] }
proptest = { version = "1", optional = true }
# Optional normal dep so `self_heal::test_fixtures` (behind `test-support`) can
# build temp data dirs when this crate is consumed as a dependency by sibling
# crates (their dev-deps don't activate our dev-deps). Also a dev-dep below for
# this crate's own tests, mirroring how `proptest` is declared.
tempfile = { version = "3", optional = true }

[features]
# The production write path should avoid the sharded BTree memtable's
# parking_lot::RwLock hot path by default. The skiplist memtable uses
# crossbeam's concurrent map plus per-partition CAS updates instead.
default = ["skiplist-memtable"]
skiplist-memtable = ["crossbeam-skiplist"]
# Live infrastructure tests are intentionally absent from the default test
# target. Opt in with `--features live-infra-tests` plus the documented
# FERROSA_TEST_* environment prerequisites so missing infra cannot be reported
# as a passing test body.
live-infra-tests = []
# Exposes the compaction validator (oracle + differential checks) so other
# crates (ferrosa-loadgen soak) can reuse it. The validator is always available
# to this crate's own tests regardless of this feature.
compaction-validator = []
# Exposes `self_heal::test_fixtures` (table_dir_with_n_generations /
# corrupt_one_generation) so sibling crates — notably ferrosa-ctl's offline
# `sstable` analysis/recovery tests — can build genuine on-disk BTI SSTables via
# the production write path instead of hand-rolling files that could drift from
# the real format. Off by default; pulled in only as a dev-dependency.
test-support = ["dep:tempfile"]
# The macOS commit-log sync call is no longer a cargo feature. It is the
# runtime setting FERROSA_COMMITLOG_SYNC_MODE (full | barrier | fsync, default
# full), logged at startup; see `CommitLogSyncMode`. The old
# `macos-standard-sync` feature switched to `File::sync_data`, which is
# F_FULLFSYNC on Apple targets, so it never weakened anything.
# Shared proptest generators + test-support fixtures for the repair/storage
# fuzz harness (`arb_partition`, `arb_table_content`, `arb_replica_set`,
# `arb_sstable_layout`, `arb_corruption`, `arb_config`). Off by default; enabled
# as a dev-dependency self-reference so the `tests/` harness and consuming
# crates (ferrosa-cluster) can reuse the generators without pulling proptest
# into the production build.
test-generators = ["dep:proptest", "ferrosa-common/test-generators"]
# Gates the file-IO-heavy fuzz properties (`tests/repair_fuzz.rs`): each case
# flushes many real on-disk SSTables, so at a high `PROPTEST_CASES` they run for
# minutes. Off by default so the local default (`cargo test --features
# test-generators`) and the per-PR CI gate stay fast — the deep file-IO fuzz
# runs in the nightly-fuzz workflow (`--features fuzz-fileio`, moderate
# `PROPTEST_CASES`). Pulls in `test-generators` (the harness needs the
# generators). The in-crate, single-case file-IO regressions in `store.rs` are
# NOT gated — only the multi-case proptest harness is.
fuzz-fileio = ["test-generators"]
# Historical no-op alias. Once gated a digest-path (`walk_token_range_for_digest`)
# reader-count bound under full token overlap that was a known RED; that bug was
# fixed by the multi-pass spill cascade (commit ba6eaacd) and the regressions now
# run in the default `test-generators` set. Retained so existing invocations
# (`--features test-generators,repair-fuzz-known-failures`) keep working.
repair-fuzz-known-failures = ["test-generators"]
# Nightly real-concurrency read-vs-compaction stress (engine.rs
# read_compaction_race_stress). Off by default so the per-PR gate stays fast.
# No CI job runs it today — the nightly Fly runner was removed because it leaked
# a Fly app per run. Run it by hand on a CPU-starved host, env-scaled via
# RACE_KEYS / RACE_READERS / RACE_SECS / RACE_FLUSH_EVERY.
race-stress = []
# Removed 2026-09-26: the `known-open-window` feature used to gate
# `cancel_crash_sweep_*` cases the code didn't yet close (windows C, D, E,
# `compaction-cancel-safety.md`). T-022 (durable replacement record with the
# generation choice reserved before it is written, forge t_cb6fa288) + T-023
# (startup reconciliation) close every window that crate's crash-sweep
# exercises, so the feature now gated nothing and was deleted rather than
# kept as permanent dead weight. The remaining T-024 scope (per-component
# retirement atomicity within one generation) needs a finer hook than the
# crash-sweep's per-generation `CancelPoint` provides -- see
# `specs/roadmap.md`. If a future packet needs a new gated case, reintroduce
# a feature rather than resurrecting this one under the same name.
# slow tests; run nightly by nightly-slow-tests.yml; PR CI skips `::slow::`
slow-tests = []

[dev-dependencies]
async-trait = "0.1"
ferrosa-common = { path = "../ferrosa-common", features = ["test-generators"] }
# Builds `CqlValue::Jsonb` values for the external-sort accounting test (T-150).
ferrosa-jsonb = { path = "../ferrosa-jsonb" }
# Builds `CqlValue::Varint`/`Decimal` values for the same accounting tests.
num-bigint = "0.4"
# Plumbing for T-033/T-038 (sstable-write-pump): the write-pump fault-injection
# sinks (RecordingSink, FaultySink, GateSink) are `pub(crate)` in
# ferrosa-sstable today, so this feature does not yet expose anything this
# crate's tests can call — it just keeps the dev-dependency wiring ready for
# when a later packet adds the cross-crate seam.
ferrosa-sstable = { path = "../ferrosa-sstable", features = ["test-support"] }
# Self-reference enables the `test-generators` feature for this crate's own
# `tests/` integration harness (`repair_fuzz.rs`) without exporting the
# generators into the production build.
ferrosa-storage = { path = ".", features = ["test-generators"] }
futures = "0.3"
hex = "0.4"
proptest = "1"
serial_test = "3"
tempfile = "3"
# Tests that assert on what WAS or WAS NOT logged: a degraded index and a
# working one return the same rows, so the log line is the only difference.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
