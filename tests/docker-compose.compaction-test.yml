# UCS compaction load-test infrastructure (Podman).
#
# Isolated from the main cluster compose — all ports in the 2xxxx range
# so it can run alongside docker-compose.cluster.yml without conflicts.
#
# Usage:
#   # Start infrastructure
#   podman compose -f tests/docker-compose.compaction-test.yml up -d --build
#
#   # Run load tests
#   FERROSA_TEST_CONTAINERS=1 \
#   FERROSA_COMPACTION_TEST_NODES="127.0.0.1:29042,127.0.0.1:29043,127.0.0.1:29044" \
#   FERROSA_COMPACTION_TEST_S3_ENDPOINT="http://127.0.0.1:29000" \
#   cargo test -p ferrosa-storage --test ucs_load_s3_test -- --nocapture
#
#   # Tear down
#   podman compose -f tests/docker-compose.compaction-test.yml down -v

services:

  # ---------------------------------------------------------------------------
  # S3-compatible object store (RustFS)
  # ---------------------------------------------------------------------------
  ct-rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "29000:9000"    # S3 API
      - "29001:9001"    # Console
    environment:
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin  # pragma: allowlist secret
    volumes:
      - ct-rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Bucket bootstrap — creates compaction-test bucket
  # ---------------------------------------------------------------------------
  ct-rustfs-init:
    image: minio/mc
    depends_on:
      ct-rustfs:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://ct-rustfs:9000 rustfsadmin rustfsadmin &&
             mc mb local/ferrosa-compaction-test --ignore-existing &&
             echo 'bucket ferrosa-compaction-test ready'"
    restart: "no"

  # ---------------------------------------------------------------------------
  # Node 1 — seed node
  # ---------------------------------------------------------------------------
  ct-node1:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      ct-rustfs-init:
        condition: service_completed_successfully
    ports:
      - "29042:9042"   # CQL
      - "29090:9090"   # Web / observability
    environment:
      FERROSA_HOST_ID: "cc111111-1111-1111-1111-111111111111"
      FERROSA_INTERNODE_BIND: "0.0.0.0:7000"
      FERROSA_INTERNODE_BROADCAST: "ct-node1:7000"
      FERROSA_CQL_BIND: "0.0.0.0:9042"
      FERROSA_WEB_BIND: "0.0.0.0:9090"
      FERROSA_CLUSTER_NAME: "ferrosa-compaction-test"
      FERROSA_DATA_DIR: "/var/lib/ferrosa"
      FERROSA_AUTH_DISABLED: "true"
      FERROSA_FLUSH_THRESHOLD_BYTES: "65536"
      FERROSA_CACHE_MAX_BYTES: "10485760"
      FERROSA_S3_ENDPOINT: "http://ct-rustfs:9000"
      FERROSA_S3_BUCKET: "ferrosa-compaction-test"
      FERROSA_S3_ALLOW_HTTP: "true"
      FERROSA_S3_ACCESS_KEY_ID: "rustfsadmin"
      FERROSA_S3_SECRET_ACCESS_KEY: "rustfsadmin"    # pragma: allowlist secret
    volumes:
      - ct-node1-data:/var/lib/ferrosa

  # ---------------------------------------------------------------------------
  # Node 2
  # ---------------------------------------------------------------------------
  ct-node2:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      ct-rustfs-init:
        condition: service_completed_successfully
    ports:
      - "29043:9042"   # CQL
      - "29091:9090"   # Web / observability
    environment:
      FERROSA_HOST_ID: "cc222222-2222-2222-2222-222222222222"
      FERROSA_INTERNODE_BIND: "0.0.0.0:7000"
      FERROSA_INTERNODE_BROADCAST: "ct-node2:7000"
      FERROSA_SEED: "ct-node1:7000"
      FERROSA_CQL_BIND: "0.0.0.0:9042"
      FERROSA_WEB_BIND: "0.0.0.0:9090"
      FERROSA_CLUSTER_NAME: "ferrosa-compaction-test"
      FERROSA_DATA_DIR: "/var/lib/ferrosa"
      FERROSA_AUTH_DISABLED: "true"
      FERROSA_FLUSH_THRESHOLD_BYTES: "65536"
      FERROSA_CACHE_MAX_BYTES: "10485760"
      FERROSA_S3_ENDPOINT: "http://ct-rustfs:9000"
      FERROSA_S3_BUCKET: "ferrosa-compaction-test"
      FERROSA_S3_ALLOW_HTTP: "true"
      FERROSA_S3_ACCESS_KEY_ID: "rustfsadmin"
      FERROSA_S3_SECRET_ACCESS_KEY: "rustfsadmin"    # pragma: allowlist secret
    volumes:
      - ct-node2-data:/var/lib/ferrosa

  # ---------------------------------------------------------------------------
  # Node 3
  # ---------------------------------------------------------------------------
  ct-node3:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      ct-rustfs-init:
        condition: service_completed_successfully
    ports:
      - "29044:9042"   # CQL
      - "29092:9090"   # Web / observability
    environment:
      FERROSA_HOST_ID: "cc333333-3333-3333-3333-333333333333"
      FERROSA_INTERNODE_BIND: "0.0.0.0:7000"
      FERROSA_INTERNODE_BROADCAST: "ct-node3:7000"
      FERROSA_SEED: "ct-node1:7000"
      FERROSA_CQL_BIND: "0.0.0.0:9042"
      FERROSA_WEB_BIND: "0.0.0.0:9090"
      FERROSA_CLUSTER_NAME: "ferrosa-compaction-test"
      FERROSA_DATA_DIR: "/var/lib/ferrosa"
      FERROSA_AUTH_DISABLED: "true"
      FERROSA_FLUSH_THRESHOLD_BYTES: "65536"
      FERROSA_CACHE_MAX_BYTES: "10485760"
      FERROSA_S3_ENDPOINT: "http://ct-rustfs:9000"
      FERROSA_S3_BUCKET: "ferrosa-compaction-test"
      FERROSA_S3_ALLOW_HTTP: "true"
      FERROSA_S3_ACCESS_KEY_ID: "rustfsadmin"
      FERROSA_S3_SECRET_ACCESS_KEY: "rustfsadmin"    # pragma: allowlist secret
    volumes:
      - ct-node3-data:/var/lib/ferrosa

volumes:
  ct-rustfs-data:
  ct-node1-data:
  ct-node2-data:
  ct-node3-data:
