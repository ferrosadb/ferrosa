# Driver smoke-test infrastructure.
#
# Starts a single Ferrosa node with S3 via RustFS (MinIO-compatible),
# then runs language-specific driver test containers against it.
#
# Usage:
#   ./tests/drivers/run-all.sh
#
# Or manually:
#   docker compose -f tests/drivers/docker-compose.drivers.yml up -d ferrosa
#   docker compose -f tests/drivers/docker-compose.drivers.yml run python-tests
#   docker compose -f tests/drivers/docker-compose.drivers.yml down -v

services:

  # -------------------------------------------------------------------------
  # Volume permissions -- RustFS runs as UID 10001
  # -------------------------------------------------------------------------
  volume-permissions:
    image: alpine
    volumes:
      - rustfs-data:/data
    command: >
      sh -c "chown -R 10001:10001 /data && echo 'permissions fixed'"
    restart: "no"

  # -------------------------------------------------------------------------
  # S3-compatible object store
  # -------------------------------------------------------------------------
  rustfs:
    image: rustfs/rustfs:latest
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin  # pragma: allowlist secret
      RUSTFS_ALLOW_INSECURE_DEFAULT_CREDENTIALS: "true"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # -------------------------------------------------------------------------
  # Bucket bootstrap
  # -------------------------------------------------------------------------
  rustfs-init:
    image: minio/mc
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://rustfs:9000 rustfsadmin rustfsadmin &&
             mc mb local/ferrosa-drivers --ignore-existing &&
             mc mb local/ferrosa-drivers-auth --ignore-existing &&
             echo 'buckets ready'"
    restart: "no"

  # -------------------------------------------------------------------------
  # Single Ferrosa node (auth disabled, graph enabled)
  # -------------------------------------------------------------------------
  ferrosa:
    # Tagged so a pre-built image (e.g. one loaded from the build-once artifact
    # or a prior local build) is reused by `compose up`/`run` without rebuilding.
    image: ferrosa-test-node:latest
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "${FERROSA_CQL_HOST_PORT:-9042}:9042"   # CQL
      - "${FERROSA_METRICS_HOST_PORT:-9090}:9090"   # Web / observability
      - "${FERROSA_CYPHER_HTTP_HOST_PORT:-7474}:7474"   # Graph HTTP
      - "${FERROSA_BOLT_HOST_PORT:-7687}:7687"   # Bolt (graph wire protocol)
    environment:
      FERROSA_HOST_ID: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
      FERROSA_DATA_DIR: /var/lib/ferrosa
      FERROSA_AUTH_DISABLED: "true"
      FERROSA_CQL_BIND: "0.0.0.0:9042"
      FERROSA_WEB_BIND: "0.0.0.0:9090"
      FERROSA_CLUSTER_NAME: "ferrosa-driver-test"
      FERROSA_GRAPH_ENABLED: "true"
      RUST_LOG: "ferrosa_cql=debug,info"
      FERROSA_S3_ENDPOINT: "http://rustfs:9000"
      FERROSA_S3_BUCKET: "ferrosa-drivers"
      FERROSA_S3_ALLOW_HTTP: "true"
      FERROSA_S3_ACCESS_KEY_ID: "rustfsadmin"
      FERROSA_S3_SECRET_ACCESS_KEY: "rustfsadmin"  # pragma: allowlist secret
    volumes:
      - ferrosa-data:/var/lib/ferrosa
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9042'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # -------------------------------------------------------------------------
  # Second Ferrosa node with auth ENABLED — exercises the auth-enforcement
  # path (graph 401 / Bolt invalid-credentials) that the auth-disabled node
  # cannot. No host ports: reached only over the compose network.
  # -------------------------------------------------------------------------
  ferrosa-auth:
    image: ferrosa-test-node:latest
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    environment:
      FERROSA_HOST_ID: "bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb"
      FERROSA_DATA_DIR: /var/lib/ferrosa
      FERROSA_AUTH_ENABLED: "true"
      FERROSA_CQL_BIND: "0.0.0.0:9042"
      FERROSA_WEB_BIND: "0.0.0.0:9090"
      FERROSA_CLUSTER_NAME: "ferrosa-driver-test-auth"
      FERROSA_GRAPH_ENABLED: "true"
      FERROSA_S3_ENDPOINT: "http://rustfs:9000"
      FERROSA_S3_BUCKET: "ferrosa-drivers-auth"
      FERROSA_S3_ALLOW_HTTP: "true"
      FERROSA_S3_ACCESS_KEY_ID: "rustfsadmin"
      FERROSA_S3_SECRET_ACCESS_KEY: "rustfsadmin"  # pragma: allowlist secret
    volumes:
      - ferrosa-data-auth:/var/lib/ferrosa
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9042'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # Auth-enforcement tests: run the graph/Bolt auth tests against the
  # auth-enabled node. FERROSA_AUTH_DISABLED is left false so the auth tests
  # run (rather than skip) and assert 401 / AuthError.
  python-auth-tests:
    build:
      context: ./python
      dockerfile: Dockerfile
    depends_on:
      ferrosa-auth:
        condition: service_healthy
    environment:
      FERROSA_HOST: ferrosa-auth
      FERROSA_CQL_PORT: "9042"
      FERROSA_GRAPH_PORT: "7474"
      FERROSA_BOLT_PORT: "7687"
    command:
      - pytest
      - -v
      - test_graph.py::TestAuth
      - test_bolt_compat.py::TestBoltWireProtocol::test_bolt_auth_invalid_credentials

  # -------------------------------------------------------------------------
  # Python driver tests (CQL + Graph HTTP)
  # -------------------------------------------------------------------------
  python-tests:
    build:
      context: ./python
      dockerfile: Dockerfile
    depends_on:
      ferrosa:
        condition: service_healthy
    environment:
      FERROSA_HOST: ferrosa
      FERROSA_CQL_PORT: "9042"
      FERROSA_GRAPH_PORT: "7474"
      FERROSA_BOLT_PORT: "7687"
      # The smoke node runs with auth disabled (so CQL drivers connect without
      # credentials). Tell the auth-enforcement tests so they skip rather than
      # assert a 401/AuthError the node will never produce.
      FERROSA_AUTH_DISABLED: "true"
    volumes:
      - ../../cassandra/doc/modules/cassandra/examples/CQL:/cassandra-examples:ro

  # -------------------------------------------------------------------------
  # Go driver tests (CQL)
  # -------------------------------------------------------------------------
  go-tests:
    build:
      context: ./go
      dockerfile: Dockerfile
    depends_on:
      ferrosa:
        condition: service_healthy
    environment:
      FERROSA_HOST: ferrosa
      FERROSA_CQL_PORT: "9042"

  # -------------------------------------------------------------------------
  # Node.js driver tests (CQL)
  # -------------------------------------------------------------------------
  node-tests:
    build:
      context: ./node
      dockerfile: Dockerfile
    depends_on:
      ferrosa:
        condition: service_healthy
    environment:
      FERROSA_HOST: ferrosa
      FERROSA_CQL_PORT: "9042"

  # -------------------------------------------------------------------------
  # Java driver tests (CQL)
  # -------------------------------------------------------------------------
  java-tests:
    build:
      context: ./java
      dockerfile: Dockerfile
    depends_on:
      ferrosa:
        condition: service_healthy
    environment:
      FERROSA_HOST: ferrosa
      FERROSA_CQL_PORT: "9042"

  # -------------------------------------------------------------------------
  # C# driver tests (CQL)
  # -------------------------------------------------------------------------
  csharp-tests:
    build:
      context: ./csharp
      dockerfile: Dockerfile
    depends_on:
      ferrosa:
        condition: service_healthy
    environment:
      FERROSA_HOST: ferrosa
      FERROSA_CQL_PORT: "9042"

  # -------------------------------------------------------------------------
  # Rust driver tests (CQL)
  # -------------------------------------------------------------------------
  rust-tests:
    build:
      context: ./rust
      dockerfile: Dockerfile
    depends_on:
      ferrosa:
        condition: service_healthy
    environment:
      FERROSA_HOST: ferrosa
      FERROSA_CQL_PORT: "9042"

volumes:
  rustfs-data:
  ferrosa-data:
  ferrosa-data-auth:
