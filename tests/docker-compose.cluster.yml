# Ferrosa cluster smoke-test infrastructure.
#
# Two profiles control which nodes start:
#
#   --profile trio   — 3-node cluster (CI default, covers QUORUM basics)
#   --profile quint  — 5-node cluster (full production validation)
#
# Usage:
#   # 3-node cluster
#   docker compose -f tests/docker-compose.cluster.yml --profile trio up -d --build
#
#   # 5-node cluster
#   docker compose -f tests/docker-compose.cluster.yml --profile quint up -d --build
#
#   # Tear down
#   docker compose -f tests/docker-compose.cluster.yml down -v --remove-orphans

services:

  # ---------------------------------------------------------------------------
  # Volume permissions — RustFS runs as UID 10001
  # ---------------------------------------------------------------------------
  volume-permissions:
    image: alpine
    volumes:
      - rustfs-data:/data
    command: >
      sh -c "chown -R 10001:10001 /data && echo 'permissions fixed'"
    restart: "no"

  # ---------------------------------------------------------------------------
  # S3-compatible object store (mock for SSTable write-behind)
  # ---------------------------------------------------------------------------
  rustfs:
    image: rustfs/rustfs:latest
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin  # pragma: allowlist secret
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Bucket bootstrap — creates ferrosa-test bucket before any node starts
  # ---------------------------------------------------------------------------
  rustfs-init:
    image: minio/mc
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://rustfs:9000 rustfsadmin rustfsadmin &&
             mc mb local/ferrosa-test --ignore-existing &&
             echo 'bucket ferrosa-test ready'"
    restart: "no"

  # ---------------------------------------------------------------------------
  # Node 1 — first seed; no FERROSA_SEED (it IS the seed)
  # ---------------------------------------------------------------------------
  node1:
    image: ferrosa-test-node:latest
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "9042:9042"   # CQL
      - "9090:9090"   # Web / observability
    environment:
      FERROSA_HOST_ID: "11111111-1111-1111-1111-111111111111"
      FERROSA_INTERNODE_BIND: "0.0.0.0:7000"
      FERROSA_INTERNODE_BROADCAST: "node1:7000"
      FERROSA_CQL_BIND: "0.0.0.0:9042"
      FERROSA_WEB_BIND: "0.0.0.0:9090"
      FERROSA_CLUSTER_NAME: "ferrosa-test"
      FERROSA_DATA_DIR: "/var/lib/ferrosa"
      FERROSA_AUTH_DISABLED: "true"
      FERROSA_S3_ENDPOINT: "http://rustfs:9000"
      FERROSA_S3_BUCKET: "ferrosa-test"
      FERROSA_S3_ALLOW_HTTP: "true"
      FERROSA_S3_ACCESS_KEY_ID: "rustfsadmin"
      FERROSA_S3_SECRET_ACCESS_KEY: "rustfsadmin"  # pragma: allowlist secret
    volumes:
      - node1-data:/var/lib/ferrosa
    profiles: [trio, quint]

  # ---------------------------------------------------------------------------
  # Node 2
  # ---------------------------------------------------------------------------
  node2:
    image: ferrosa-test-node:latest
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
