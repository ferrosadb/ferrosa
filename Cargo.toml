[workspace]
resolver = "2"
members = [
    "ferrosa",
    "ferrosa-common",
    "ferrosa-ctl",
    "ferrosa-cluster",
    "ferrosa-cql",
    "ferrosa-graph",
    "ferrosa-index",
    "ferrosa-net",
    "ferrosa-schema",
    "ferrosa-sstable",
    "ferrosa-storage",
    "ferrosa-udf",
]

[workspace.package]
version = "1.0.0-beta.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/bkearns/ferrosa"
