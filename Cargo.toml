[workspace]
resolver = "2"
members = [
    "ferrosa",
    "ferrosa-common",
    "ferrosa-ctl",
    "ferrosa-cluster",
    "ferrosa-cql",
    "ferrosa-graph",
    "ferrosa-index",
    "ferrosa-net",
    "ferrosa-schema",
    "ferrosa-sstable",
    "ferrosa-storage",
    "ferrosa-udf",
    "ferrosa-worker",
    "ferrosa-jepsen",
    "ferrosa-loadgen",
    "ferrosa-sparql",
    "ferrosa-index-builder",
]

[patch.crates-io]
openraft = { git = "https://github.com/ferrosadb/openraft.git", branch = "fix/separate-replication-timeout" }

# Keep line-table debug info in release builds so container crashes produce a readable backtrace
# without bloating the binary to full DWARF. Required for gdb backtraces inside the runtime image.
[profile.release]
debug = "line-tables-only"
split-debuginfo = "off"
strip = "none"

[workspace.package]
version = "1.0.0-beta.4"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/bkearns/ferrosa"
