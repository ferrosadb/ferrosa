[workspace]
resolver = "2"
members = [
    "ferrosa",
    "ferrosa-common",
    "ferrosa-ctl",
    "ferrosa-cql",
    "ferrosa-graph",
    "ferrosa-index",
    "ferrosa-net",
    "ferrosa-schema",
    "ferrosa-sstable",
    "ferrosa-storage",
