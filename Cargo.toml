[workspace]
resolver = "2"
members = [
    "ferrosa",
    "ferrosa-common",
    "ferrosa-cdc",
    "ferrosa-ctl",
    "ferrosa-cluster",
    "ferrosa-cql",
    "ferrosa-flight",
    "ferrosa-graph",
    "ferrosa-index",
    "ferrosa-jsonb",
    "ferrosa-net",
    "ferrosa-postgres",
    "ferrosa-row-bridge",
    "ferrosa-sched",
    "ferrosa-schema",
    "ferrosa-session",
    "ferrosa-sql",
    "ferrosa-sstable",
    "ferrosa-storage",
    "ferrosa-udf",
    "ferrosa-view",
    "ferrosa-worker",
    "ferrosa-jepsen",
    "ferrosa-loadgen",
    "ferrosa-sparql",
    "ferrosa-index-builder",
    "ferrosa-sim",
    "xtask",
]
# Dev-only oracle with its own [workspace] and Cargo.lock: parquet-variant 60
# needs chrono >= 0.4.40, which breaks arrow-arith 53 (ferrosa-flight) at
# `d.quarter()`. Run it with `--manifest-path ferrosa-jsonb-conformance/Cargo.toml`.
exclude = ["ferrosa-jsonb-conformance"]

[patch.crates-io]
# Sprint 3 (ADR-012): the ferrosadb/openraft fork carries PreVote +
# CheckQuorum + Leadership Transfer + the separate-replication-timeout
# patch on top of upstream 0.9.24. Pinned to an explicit fork commit for
# reproducible builds. `af87fa60` is the commit that fully wires the engine
# PreVote path into the election tick (`run_pre_vote_round` gated behind
# `Config::enable_pre_vote`), closing the runaway-term gap from
# `bug-raft-stale-candidate-runaway-term-no-prevote.md`; the
# `sprint-03-engine-prevote` acceptance tests in ferrosa-cluster depend on
# it. Fork README and rationale:
#   https://github.com/ferrosadb/openraft/blob/main/README-FERROSADB.md
openraft = { git = "https://github.com/ferrosadb/openraft.git", rev = "ecb9efa3" }

# Keep line-table debug info in release builds so container crashes produce a readable backtrace
# without bloating the binary to full DWARF. Required for gdb backtraces inside the runtime image.
[profile.release]
debug = "line-tables-only"
split-debuginfo = "off"
strip = "none"

# Profiling artifacts retain full DWARF while keeping release optimizations.
# Release publishing still strips its binaries explicitly; this profile is for
# diagnostic images and must never be used for the production release path.
[profile.profiling]
inherits = "release"
debug = 2
split-debuginfo = "off"
strip = "none"

# Password KDFs (bcrypt/argon2) compile unoptimised in dev and test builds,
# which made one cost-12 hash cost ~1080 ms instead of ~150 ms. Node boot hashes
# the three seed-role passwords before it reports readiness, so that cost
# dominated a fresh node's boot, and CPU contention (a shared CI runner, the full
# ~9,700-test suite) stretched it past the readiness budget the cluster harnesses
# allow. Optimising the KDF crates changes only their speed: algorithm, cost
# factor and hash format are untouched, and
# `ferrosa-schema/tests/password_hash_boot_cost.rs` asserts exactly that.
[profile.dev.package.bcrypt]
opt-level = 3

[profile.dev.package.blowfish]
opt-level = 3

[profile.dev.package.argon2]
opt-level = 3

# The engines tests run inside, for the same reason: the AssemblyScript UDF
# tests spend nearly all their time in QuickJS (running `asc`) and Cranelift /
# wasmtime (compiling and running its output), and `pump_loom` in loom's model
# checker. Unoptimized, they formed a ~12-minute serial tail in PR CI (nextest's
# `compile-bound` group runs them one at a time). Optimized, the five ferrosa-udf
# asc tests take 8.2 s instead of 52.1 s and pump_loom 15.6 s instead of 45.7 s
# (local debug build), with no measurable compile-time cost. Speed only: the
# code under test and its assertions are unchanged.
# tests/ci/test_dev_profile_optimizes_test_engines.py pins this list.
[profile.dev.package.rquickjs-sys]
opt-level = 3

[profile.dev.package.rquickjs-core]
opt-level = 3

[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.cranelift-frontend]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.dev.package.wasmtime]
opt-level = 3

[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3

[profile.dev.package.wasmtime-environ]
opt-level = 3

[profile.dev.package.wasmparser]
opt-level = 3

[profile.dev.package.wit-component]
opt-level = 3

[profile.dev.package.wasm-encoder]
opt-level = 3

[profile.dev.package.loom]
opt-level = 3

[workspace.package]
version = "0.28.5"
edition = "2021"
license = "Apache-2.0"
# No workspace crate is published to crates.io. Saying so lets cargo-deny
# treat intra-workspace `path = ...` dependencies as what they are (not
# registry wildcards) and keeps an accidental `cargo publish` from leaking one.
publish = false
repository = "https://github.com/ferrosadb/ferrosa"
