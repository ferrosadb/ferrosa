##############################################################################
# SECURE OVERLAY — production mode: auth on, TLS on every listener           #
#                                                                            #
# Usage:                                                                     #
#   scripts/gen-compose-test-certs.sh      # throwaway test CA + node certs  #
#   FERROSA_SEED_ADMIN_PASSWORD='<strong-password>' \                        #
#     docker compose -f docker-compose.yml -f docker-compose.secure.yml up   #
#                                                                            #
# This overlay clears the dev-only FERROSA_AUTH_DISABLED flag, enables       #
# auth, and switches the binary to FERROSA_MODE=production. Production mode  #
# refuses to start unless every enabled client listener (CQL, PostgreSQL,    #
# graph HTTP, Bolt, SPARQL, web console) requires TLS and internode traffic  #
# is TLS (t_d5d122ba), so this overlay also:                                 #
#                                                                            #
#   - mounts .compose-tls/nodeN (from scripts/gen-compose-test-certs.sh)     #
#     read-only at /etc/ferrosa/tls in each node,                            #
#   - sets <listener> TLS cert/key + REQUIRE_TLS for every listener and      #
#     internode TLS cert/key/CA + REQUIRE_TLS,                               #
#   - pins each node to 172.28.77.10N on a fixed subnet: internode TLS        #
#     verifies the peer's IP address, and the test certificates carry those  #
#     IPs as SANs,                                                           #
#   - probes /readyz over HTTPS.                                             #
#                                                                            #
# The certificates are THROWAWAY test certificates. A real deployment        #
# mounts certificates from its own PKI at the same paths.                    #
#                                                                            #
# Credentials:                                                               #
#   - If FERROSA_SEED_ADMIN_PASSWORD is set, ferrosa_admin is seeded with    #
#     that password on first bootstrap.                                      #
#   - If it is unset, a cryptographically random password is generated and   #
#     printed ONCE to the container's stderr in a banner — capture it with   #
#     `docker compose logs node1 | grep -A3 'GENERATED ADMIN PASSWORD'`.     #
#   - Service accounts (graph_engine, app_reader) also receive random        #
#     per-install passwords in production mode.                              #
#                                                                            #
# Seeding only happens when the roles do not exist yet; restarting an        #
# already-bootstrapped cluster never changes or reveals passwords.           #
#                                                                            #
# Clients: cqlsh --ssl with SSL_CERTFILE=.compose-tls/ca.crt, psql with      #
# sslmode=verify-full sslrootcert=.compose-tls/ca.crt, curl --cacert.        #
##############################################################################

x-ferrosa-secure-env: &ferrosa-secure-env
  FERROSA_AUTH_DISABLED: ""     # clear the dev-only flag
  FERROSA_AUTH_ENABLED: "true"
  FERROSA_MODE: "production"
  FERROSA_SEED_ADMIN_PASSWORD: "${FERROSA_SEED_ADMIN_PASSWORD:-}"
  # Client listeners: each requires TLS with the node certificate.
  FERROSA_CQL_TLS_CERT: /etc/ferrosa/tls/node.crt
  FERROSA_CQL_TLS_KEY: /etc/ferrosa/tls/node.key
  FERROSA_CQL_REQUIRE_TLS: "true"
  FERROSA_POSTGRES_TLS_CERT: /etc/ferrosa/tls/node.crt
  FERROSA_POSTGRES_TLS_KEY: /etc/ferrosa/tls/node.key
  FERROSA_POSTGRES_REQUIRE_TLS: "true"
  FERROSA_GRAPH_TLS_CERT: /etc/ferrosa/tls/node.crt     # graph HTTP + Bolt
  FERROSA_GRAPH_TLS_KEY: /etc/ferrosa/tls/node.key
  FERROSA_GRAPH_REQUIRE_TLS: "true"
  FERROSA_SPARQL_TLS_CERT: /etc/ferrosa/tls/node.crt
  FERROSA_SPARQL_TLS_KEY: /etc/ferrosa/tls/node.key
  FERROSA_SPARQL_REQUIRE_TLS: "true"
  FERROSA_WEB_TLS_CERT: /etc/ferrosa/tls/node.crt
  FERROSA_WEB_TLS_KEY: /etc/ferrosa/tls/node.key
  FERROSA_WEB_REQUIRE_TLS: "true"
  # Arrow Flight has no TLS; production refuses it while enabled. Only
  # `flight` builds bind it, and this keeps those builds startable too.
  FERROSA_FLIGHT_ENABLED: "false"
  # Internode: one-way server TLS, peers verified against the test CA.
  FERROSA_INTERNODE_TLS_CERT: /etc/ferrosa/tls/node.crt
  FERROSA_INTERNODE_TLS_KEY: /etc/ferrosa/tls/node.key
  FERROSA_INTERNODE_TLS_CA: /etc/ferrosa/tls/ca.crt
  FERROSA_INTERNODE_REQUIRE_TLS: "true"

x-ferrosa-secure-healthcheck: &ferrosa-secure-healthcheck
  test: ["CMD", "curl", "-sf", "--cacert", "/etc/ferrosa/tls/ca.crt", "https://127.0.0.1:9090/readyz"]
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 30s

services:
  node1:
    environment:
      <<: *ferrosa-secure-env
    volumes:
      - ./.compose-tls/node1:/etc/ferrosa/tls:ro
    networks:
      default:
        ipv4_address: 172.28.77.101
    healthcheck: *ferrosa-secure-healthcheck

  node2:
    environment:
      <<: *ferrosa-secure-env
    volumes:
      - ./.compose-tls/node2:/etc/ferrosa/tls:ro
    networks:
      default:
        ipv4_address: 172.28.77.102
    healthcheck: *ferrosa-secure-healthcheck

  node3:
    environment:
      <<: *ferrosa-secure-env
    volumes:
      - ./.compose-tls/node3:/etc/ferrosa/tls:ro
    networks:
      default:
        ipv4_address: 172.28.77.103
    healthcheck: *ferrosa-secure-healthcheck

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.77.0/24
