[package]
name = "ferrosa-cql"
description = "CQL native protocol v5 for Ferrosa"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arc-swap = "1.7"
bytes = "1"
ferrosa-cluster = { path = "../ferrosa-cluster" }
ferrosa-common = { path = "../ferrosa-common" }
ferrosa-index = { path = "../ferrosa-index" }
ferrosa-schema = { path = "../ferrosa-schema" }
ferrosa-sstable = { path = "../ferrosa-sstable" }
ferrosa-storage = { path = "../ferrosa-storage" }
futures = "0.3"
indexmap = "2"
lz4_flex = "0.11"
md-5 = "0.10"
moka = { version = "0.12", features = ["sync"] }
num-bigint = "0.4"
phf = { version = "0.11", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
tracing = "0.1"
snap = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
