[package]
name = "ferrosa-cql"
description = "CQL native protocol v5 for Ferrosa"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arc-swap = "1.7"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dashmap = "6"
ferrosa-cluster = { path = "../ferrosa-cluster" }
ferrosa-common = { path = "../ferrosa-common" }
ferrosa-net = { path = "../ferrosa-net" }
ferrosa-index = { path = "../ferrosa-index" }
ferrosa-schema = { path = "../ferrosa-schema" }
ferrosa-sstable = { path = "../ferrosa-sstable" }
ferrosa-storage = { path = "../ferrosa-storage" }
ferrosa-udf = { path = "../ferrosa-udf" }
futures = "0.3"
indexmap = "2"
libc = "0.2"
lz4_flex = "0.11"
md-5 = "0.11"
moka = { version = "0.12", features = ["sync"] }
num-bigint = "0.4"
parking_lot = "0.12"
phf = { version = "0.13", features = ["macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
tokio-rustls = "0.26"
tracing = "0.1"
snap = "1"
socket2 = "0.6"
uuid = { version = "1", features = ["v4"] }

[features]
# Inline AssemblyScript UDF compilation (CREATE FUNCTION ... LANGUAGE assemblyscript).
asc-udf = ["ferrosa-udf/asc-udf"]
# Opt-in tests needing external infrastructure (e.g. the asc toolchain bundle).
live-infra-tests = []

[dev-dependencies]
proptest = "1"
rcgen = "0.14"
serial_test = "3"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
