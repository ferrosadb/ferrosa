# =============================================================================
# Ferrosa - Pre-commit Configuration
# =============================================================================
# Auto-generated by /op-init skill
# Detected projects: Rust workspace, Java (Cassandra submodule), Python (tooling)
# Last updated: 2026-03-11
# =============================================================================

default_install_hook_types:
  - pre-commit
  - pre-push
  - commit-msg

default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-byte-order-marker
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: cassandra/
      - id: trailing-whitespace
        exclude: cassandra/
      - id: mixed-line-ending
        exclude: cassandra/
      - id: no-commit-to-branch
        stages: [pre-commit]
        args:
          - --pattern
          - '^(?!((ci|chore|docs|feature|fix|refactor|test)\/[a-zA-Z0-9\-]+)$).*'
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--exclude-files", ".*\\.ipynb", "--exclude-files", ".*\\.lock"]

  # ===========================================================================
  # Rust: ferrosa workspace
  # ===========================================================================
  - repo: local
    hooks:
      - id: cargo-fmt-ferrosa
        name: cargo fmt (ferrosa)
        entry: cargo fmt -- --check
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-clippy-ferrosa
        name: cargo clippy (ferrosa)
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        files: \.rs$
        pass_filenames: false

  # ===========================================================================
  # Python: tooling/scripts
  # ===========================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast
        files: \.py$
        exclude: cassandra/
      - id: debug-statements
        files: \.py$
        exclude: cassandra/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.2
    hooks:
      - id: ruff
        args: [--fix]
        files: \.py$
        exclude: cassandra/
      - id: ruff-format
        files: \.py$
        exclude: cassandra/

  # ===========================================================================
  # Codespell (typo detection)
  # ===========================================================================
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args: ["-L", "crate,edn,ratatui,rouge,ser,trough,wit"]
        exclude: '(node_modules/|package-lock\.json|\.lock$|cassandra/|docs/examples/)'

  # ===========================================================================
  # Markdown linting
  # ===========================================================================
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        args: [--fix, --disable=MD013, --disable=MD040, --disable=MD024, --disable=MD036, --disable=MD041]
        exclude: (node_modules/|cassandra/)

  # ===========================================================================
  # Shell scripts
  # ===========================================================================
  - repo: https://github.com/pecigonzalo/pre-commit-shfmt
    rev: v2.2.0
    hooks:
      - id: shell-fmt-docker
        name: shfmt
        args:
          - --indent=2
          - --binary-next-line
          - --case-indent
          - --space-redirects
        files: \.sh$

  # ===========================================================================
  # Commit message convention
  # ===========================================================================
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # ===========================================================================
  # Pre-push: Smart tests (changed crates + dependents) + examples + docs
  # ===========================================================================
  - repo: local
    hooks:
      - id: cargo-doc-ferrosa
        name: cargo doc (ferrosa)
        stages: [pre-push]
        entry: bash -c 'RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace'
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-musl-build
        name: musl static build + verify + strip
        stages: [pre-push]
        entry: bash scripts/musl-build.sh
        language: system
        files: \.rs$
        pass_filenames: false

      - id: pre-push-tests
        name: cargo test (changed crates + dependents) + example tests
        stages: [pre-push]
        entry: bash scripts/pre-push-tests.sh
        language: system
        always_run: true
        pass_filenames: false
