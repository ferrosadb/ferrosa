# =============================================================================
# Ferrosa - Pre-commit Configuration
# =============================================================================
# Auto-generated by /op-init skill
# Detected projects: Rust workspace, Python (tooling)
# Last updated: 2026-03-11
# =============================================================================

default_install_hook_types:
  - pre-commit
  - pre-push
  - commit-msg

default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-byte-order-marker
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: no-commit-to-branch
        stages: [pre-commit]
        args:
          - --pattern
          - '^(?!((ci|chore|docs|feature|fix|refactor|test)\/[a-zA-Z0-9\-]+)$).*'
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--exclude-files", ".*\\.ipynb", "--exclude-files", ".*\\.lock"]

  # ===========================================================================
  # Rust: ferrosa
  # ===========================================================================
  - repo: local
    hooks:
      - id: cargo-fmt-ferrosa
        name: cargo fmt (ferrosa)
        entry: cargo fmt -- --check
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-clippy-ferrosa
        name: cargo clippy (ferrosa)
        entry: cargo clippy -- -D warnings
        language: system
        files: \.rs$
        pass_filenames: false

  # ===========================================================================
  # Codespell (typo detection)
  # ===========================================================================
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args: ["-L", "crate"]
        exclude: '(node_modules/|package-lock\.json|\.lock$|cassandra/)'

  # ===========================================================================
  # Markdown linting
  # ===========================================================================
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        args: [--fix, --disable=MD013, --disable=MD040, --disable=MD024, --disable=MD036, --disable=MD041]
        exclude: (node_modules/|cassandra/)

  # ===========================================================================
  # Commit message convention
  # ===========================================================================
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # ===========================================================================
  # Pre-push: Rust tests
  # ===========================================================================
  - repo: local
    hooks:
      - id: cargo-test-ferrosa
        name: cargo test (ferrosa)
        stages: [pre-push]
        entry: cargo test
        language: system
        files: \.rs$
        pass_filenames: false
