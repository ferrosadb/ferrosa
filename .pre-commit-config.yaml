# pre-commit + pre-push hooks for the ferrosa workspace.
#
# Install:  pre-commit install --hook-type pre-commit --hook-type pre-push
# Bypass:   FERROSA_SKIP_PREPUSH=1 git push    (or git push --no-verify)
#
# Speed budget:
#   - pre-commit must stay under ~5 seconds (developer commits frequently).
#     fmt is the only thing fast enough — clippy/test moved to pre-push.
#   - pre-push runs the full CI gate: fmt, workspace clippy, workspace
#     tests via cargo-nextest (parallel by binary AND by test, ~30-50%
#     faster than `cargo test`). The integration test step is gated
#     behind FERROSA_PRE_PUSH_INTEGRATION=1 because it builds an image
#     and brings up a 3-node Docker cluster (5-10 min total).

default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: local
    hooks:
      # Pre-commit: format check only. Anything slower belongs on pre-push.
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --check
        language: system
        types: [rust]
        pass_filenames: false

      # Pre-push: run the FULL workspace test suite — same shape as CI.
      # Never push something that will immediately fail CI.
      #
      # Per ferrosa/CLAUDE.md test policy, infrastructure-gated tests
      # panic-loud when their env vars are missing
      # (FERROSA_TEST_CONTAINERS, FERROSA_TEST_FIRECRACKER,
      # FERROSA_TEST_CLUSTER_NODES). Set those before pushing if your
      # changes touch the affected paths; otherwise spin the cluster:
      #   docker compose -f compose.test.yml up -d
      #   FERROSA_TEST_CONTAINERS=1 git push
      # Bypass with FERROSA_SKIP_PREPUSH=1 git push if you genuinely
      # know the failure is unrelated.
      #
      # Tests run via cargo-nextest. Falls back to `cargo test` if nextest
      # isn't installed — install with `cargo install cargo-nextest --locked`.
      - id: cargo-test-workspace
        name: cargo nextest run --workspace (pre-push, full suite)
        stages: [pre-push]
        entry: bash -c 'if command -v cargo-nextest >/dev/null 2>&1; then cargo nextest run --workspace --all-targets --no-fail-fast; else echo "cargo-nextest not installed (cargo install cargo-nextest --locked); falling back to cargo test"; cargo test --workspace --all-targets --no-fail-fast; fi'
        language: system
        pass_filenames: false

      - id: cargo-fmt-prepush
        name: cargo fmt --check (pre-push)
        stages: [pre-push]
        entry: cargo fmt --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy-prepush
        name: cargo clippy (pre-push, all-targets, -D warnings)
        stages: [pre-push]
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      # Pre-push (gated): full integration via the CI cluster script.
      # Run only when FERROSA_PRE_PUSH_INTEGRATION=1 is set, because
      # this builds the node image and spins up a 3-node Docker cluster
      # (~5-10 min). Without the env var, the hook is a no-op.
      - id: integration-tests-gated
        name: scripts/pre-push-integration.sh (gated by FERROSA_PRE_PUSH_INTEGRATION=1)
        stages: [pre-push]
        entry: ./scripts/pre-push-integration.sh
        language: system
        always_run: true
        pass_filenames: false
