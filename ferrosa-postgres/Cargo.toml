[package]
name = "ferrosa-postgres"
description = "Postgres wire-protocol front-end for Ferrosa"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ferrosa-schema = { path = "../ferrosa-schema" }
ferrosa-sql = { path = "../ferrosa-sql" }
ferrosa-storage = { path = "../ferrosa-storage" }
ferrosa-common = { path = "../ferrosa-common" }
# Reuse the canonical SELECT partition->row decomposition
# (`partition_to_rows_with_storage_mapping`, `parse_cql_type_in_keyspace`,
# `encode_value`/`decode_value`) from the neutral row-bridge crate so the column
# ordering matches the CQL read path exactly rather than being reinvented.
# Decision D10: this is the SAME code ferrosa-cql uses (ferrosa-cql re-exports
# from here), so there is no row-ordering divergence AND no dependency on the
# ~54k-LOC ferrosa-cql crate.
ferrosa-row-bridge = { path = "../ferrosa-row-bridge" }
# Names the `Partition` type that `StorageEngine::range_iter` streams.
ferrosa-sstable = { path = "../ferrosa-sstable" }
futures = "0.3"
base64 = "0.22"
bytes = "1"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand = "0.8"
sha2 = "0.10"
tokio = { version = "1", features = ["net", "rt", "io-util", "macros", "sync"] }
# Used by query.rs to render/parse the Postgres `uuid` type (OID 2950) carried
# by `ferrosa_sql::Value::Uuid`, and by storage_provider for CqlValue::Uuid.
uuid = "1"
# Calendar math for the temporal types: render `Value::Timestamp`/`Date`/`Time`
# (Unix-epoch micros/days) into Postgres's exact text forms, and parse them back
# in `decode_param`. `std` only — no wall-clock/`clock` feature needed.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# `Value::Numeric` carries a `num_bigint::BigInt`; query.rs renders/parses the
# Postgres `numeric` text form from it. Workspace dep (ferrosa-common uses it).
num-bigint = "0.4"

[features]
# Opt-in gate for tests that require external infrastructure (a real
# PostgreSQL container via podman/docker). Default `cargo test` does NOT
# enable this, so the differential oracle compiles to nothing and needs no
# container runtime. Enable together with `FERROSA_TEST_CONTAINERS=1`:
#   FERROSA_TEST_CONTAINERS=1 cargo test -p ferrosa-postgres \
#     --features live-infra-tests --test differential_oracle -- --nocapture
live-infra-tests = []

[dev-dependencies]
indexmap = { version = "2", features = ["serde"] }
proptest = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-postgres = "0.7"
tempfile = "3"
