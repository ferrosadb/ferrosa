[package]
name = "ferrosa-cluster"
version.workspace = true
edition = "2021"

[dependencies]
arc-swap = "1.7"
async-trait = "0.1"
bincode = "1"
bytes = "1"
crc32fast = "1"
dashmap = "6"
ferrosa-common = { path = "../ferrosa-common" }
ferrosa-index = { path = "../ferrosa-index" }
ferrosa-net = { path = "../ferrosa-net" }
ferrosa-schema = { path = "../ferrosa-schema" }
ferrosa-sstable = { path = "../ferrosa-sstable" }
ferrosa-storage = { path = "../ferrosa-storage" }
futures = "0.3"
parking_lot = "0.12"
openraft = { version = "0.9", features = ["serde", "storage-v2", "loosen-follower-log-revert"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sled = "0.34"
tokio = { version = "1", features = ["sync", "time", "rt", "rt-multi-thread", "macros", "io-util"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
indexmap = "2"
proptest = "1"
rand = "0.10"
serial_test = "3"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

[features]
default = []
# Sprint 3 (ADR-012): enable W3.12 / W3.13 acceptance tests that depend on
# engine-side PreVote/TimeoutNow handling in the openraft fork. Off by default
# until the corresponding engine wire-up lands (W3.3, W3.7-engine, W3.8-engine,
# W3.9 in `specs/in-process/sprint-03-openraft-patches.md`). When the engine
# work lands, remove this gate and these tests join the default suite.
sprint-03-engine-prevote = []
sprint-03-engine-transfer = []
