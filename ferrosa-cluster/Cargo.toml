[package]
name = "ferrosa-cluster"
version.workspace = true
edition = "2021"

[dependencies]
arc-swap = "1.7"
async-trait = "0.1"
bincode = "1"
bytes = "1"
# Cap'n Proto: this crate is the codec owner for the forwarded Raft
# schema/membership frame (`raft_forward_codec`), the same way ferrosa-postgres
# is for the PostgreSQL MVCC row-version family.
capnp = "0.25"
crc32fast = "1"
dashmap = "6"
ferrosa-cdc = { path = "../ferrosa-cdc" }
ferrosa-common = { path = "../ferrosa-common" }
ferrosa-index = { path = "../ferrosa-index" }
ferrosa-net = { path = "../ferrosa-net" }
ferrosa-schema = { path = "../ferrosa-schema" }
ferrosa-sstable = { path = "../ferrosa-sstable" }
ferrosa-storage = { path = "../ferrosa-storage" }
futures = "0.3"
# `IndexMap`: `TableMetadata::columns` is an insertion-ordered map the capnp
# frame must preserve (`raft_forward_codec`).
indexmap = "2"
parking_lot = "0.12"
openraft = { version = "0.9", features = ["serde", "storage-v2", "loosen-follower-log-revert"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sled = "0.34"
tokio = { version = "1", features = ["sync", "time", "rt", "rt-multi-thread", "macros", "io-util"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[dev-dependencies]
# `test-support` exposes `compaction::cancel_harness`, used to hold a compaction
# in flight deterministically (ddl_path drop-during-compaction test).
ferrosa-storage = { path = "../ferrosa-storage", features = ["test-generators", "test-support"] }
fs2 = "0.4"
proptest = "1"
rand = "0.10"
serial_test = "3"
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full", "test-util"] }

[features]
default = []
# Wall-clock latency benchmarks for the Accord state machine (accord::perf,
# accord::perf_regression). They assert ABSOLUTE time bounds, which measure the host
# as much as the code, so they are not part of the default `cargo test`: a starved CPU
# fails them with nothing wrong. Run them on a quiet machine with
# `cargo test -p ferrosa-cluster --features perf-tests --lib accord::perf`; the nightly
# `perf-regression` job (all features) does. Do not widen a bound that trips.
#
# The same gate covers the test target below, whose bounds are ABSOLUTE resident
# bytes rather than wall clock. Its load-independent replacement
# (`tests/accord_apply_decode_streaming_budget.rs`) is NOT gated: it runs on every PR.
perf-tests = []
# Sprint 3 (ADR-012): the engine-side PreVote wire-up has landed in the openraft
# fork (commit pinned in the workspace Cargo.toml), so the W3.12 PreVote
# acceptance tests now run in the default suite — the `sprint-03-engine-prevote`
# gate has been removed. The leadership-transfer (W3.13) gate remains until that
# engine wire-up's acceptance tests land.
sprint-03-engine-transfer = []
# Live multi-node infrastructure tests (fly.io streaming-scan memory harness).
# Off by default so the merge-blocking CI lane never provisions machines / bills.
# Enable with `--features live-infra-tests` PLUS `FERROSA_TEST_FLY=1`; with the
# feature on and the env unset (or flyctl missing) the test panics loudly with
# setup instructions rather than silently passing (repo test policy).
live-infra-tests = []

# Turns on the allocation-SITE tag seam in `ferrosa_common::mem_probe` (see its
# `enter_site`/`SITE_NAMES`), so the counting allocator in a test binary can charge
# each key-sized allocation to the call site that made it. Off by default: with it
# off every `enter_site` folds away and a production build pays nothing. It only
# unlocks the ATTRIBUTION the `pg_commit_path_key_attribution` test prints; the
# residency RATCHET it feeds lives in `pg_commit_path_consumer_residency`, which is
# NOT gated and runs on every PR.
alloc-probe = ["ferrosa-common/alloc-probe"]

# ── test targets ────────────────────────────────────────────────────────
# Absolute-measurement test binaries. Gated so a plain `cargo test -p
# ferrosa-cluster` never runs a measurement of the host, exactly like the
# `accord::perf` benchmarks the `perf-tests` feature covers above. Under
# `--all-features` the gate is open, so ci.yml's `Run tests` additionally
# excludes each of these: the nextest arm by whole binary (`-E 'not
# binary(<name>)'`), the cargo-test arms by their test names, because a
# positional `--skip` matches the TEST name and never the binary name.
# nightly-fuzz.yml's `perf-regression` job runs them where the machine is not
# competing with the rest of the PR gate. Adding a new absolute assertion to
# this binary: the nextest `-E` already covers it, but add its name to the
# `--skip` lists too so the cargo-test mirrors exclude it.
#
# `tests/accord_apply_decode_residency.rs`: the apply path's peak live bytes
# against a multiple of the input size (input residency, decoded-output
# residency, and their negative controls).
[[test]]
name = "accord_apply_decode_residency"
required-features = ["perf-tests"]

# `tests/pg_commit_path_key_attribution.rs`: for the COMMIT path's key-sized
# buffers, charges each one to the allocation SITE that made it and prints the
# table, so a residency finding names a file:line instead of a hypothesis. It
# needs the `alloc-probe` tag seam, so it is gated rather than skipped — a test
# that silently self-skips when its requirement is absent is not evidence
# (repo test policy; see `reproduction-validity`). Its assertions are counts of
# key-sized allocations, which do not move with host load.
[[test]]
name = "pg_commit_path_key_attribution"
required-features = ["alloc-probe"]
