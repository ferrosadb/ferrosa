[package]
name = "ferrosa-index"
description = "Secondary and vector index implementations for Ferrosa"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ferrosa-common = { path = "../ferrosa-common" }
crc32fast = "1"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
bincode = "1"
tempfile = "3"
