# Ferrosa Configuration
# Config-file values override environment variables.
# Copy to /etc/ferrosa/ferrosa.toml or specify with FERROSA_CONFIG env var.

[cql]
bind = "127.0.0.1:9042"
auth_disabled = false
max_connections = 1024
max_connections_per_ip = 64
# tls_cert = "/etc/ferrosa/tls/server.crt"
# tls_key = "/etc/ferrosa/tls/server.key"
# require_tls = false

[internode]
bind = "127.0.0.1:17000"
# broadcast = "192.168.1.1:17000"
# seed = "192.168.1.2:17000"
cluster_name = "ferrosa"
# psk = "shared-secret-key"

[storage]
data_dir = "/var/lib/ferrosa"
flush_threshold_bytes = 67108864  # 64 MB
flush_interval_secs = 30          # How often to flush memtables + sync to S3
commit_log_segment_size = 33554432  # 32 MB
# Number of sharded memtable buckets. Each bucket has its own RwLock,
# so writes to different shards never contend. Default 64 fits modern
# multi-core servers; raise for higher core counts, lower for very
# small VMs. Honors FERROSA_MEMTABLE_NUM_SHARDS env var.
memtable_num_shards = 64

[s3]
# endpoint = "https://s3.amazonaws.com"
# bucket = "ferrosa-data"
# region = "us-east-1"
# allow_http = false

# ── User-facing endpoints ────────────────────────────────────────────────────
# All standard endpoints are ON by default and bind to localhost. To expose an
# endpoint to a LAN or cluster, explicitly set its bind address to a non-loopback
# value and configure authentication before doing so.

[graph]
enabled = true                    # graph HTTP (7474) + Bolt (7687); set false to disable
bind = "127.0.0.1:7474"

[sparql]
enabled = true                    # SPARQL 1.1 endpoint (8080); set false to disable
bind = "127.0.0.1:8080"

[web]
bind = "127.0.0.1:9090"

[postgres]
bind = "127.0.0.1:5432"

[flight]
bind = "127.0.0.1:8815"
