# Ferrosa Configuration
# Config-file values override environment variables.
# Copy to /etc/ferrosa/ferrosa.toml or specify with FERROSA_CONFIG env var.

# One certificate for every listener and internode (overridden by any
# section's own tls_cert/tls_key/require_tls). Env FERROSA_TLS_CERT / _KEY /
# _CA / FERROSA_TLS_REQUIRE. With require = true (and auth) production mode
# is satisfied.
[tls]
# cert = "/etc/ferrosa/tls/node.crt"
# key = "/etc/ferrosa/tls/node.key"
# ca = "/etc/ferrosa/tls/ca.crt"
# require = false

[cql]
bind = "127.0.0.1:9042"
auth_disabled = false
max_connections = 1024
max_connections_per_ip = 64
# tls_cert = "/etc/ferrosa/tls/server.crt"
# tls_key = "/etc/ferrosa/tls/server.key"
# require_tls = false

[udf]
# Per-Store cap on WASM guest linear memory, in bytes (default 16 MiB).
# Env fallback: FERROSA_UDF_MAX_MEMORY_BYTES (TOML wins). Valid range
# 65536..=4294967296; 0 or out-of-range aborts startup.
# max_memory_bytes = 16777216

[jsonb]
# Ingest limits for the jsonb type (writes and query arguments only).
# TOML wins over the FERROSA_JSONB_<KEY> env fallback (keys with an env
# fallback: max_input_bytes, max_encoded_bytes, max_nesting_depth,
# max_key_list_length, max_index_terms_per_doc). Zero, a value above its hard
# ceiling, or a max_input_bytes/max_encoded_bytes above the commit-log segment
# size aborts startup with a FATAL message naming the key.
# max_input_bytes = 10485760          # default 10 MiB; ceiling 256 MiB
# max_encoded_bytes = 10485760        # default 10 MiB; ceiling 256 MiB
# max_nesting_depth = 1000            # default 1000; ceiling 1000
# max_key_list_length = 1000          # default 1000; ceiling 1000000
# max_index_terms_per_doc = 10000     # default 10000; ceiling 10000000
# max_path_len = 4096                 # default 4096; ceiling 1048576 (TOML only)
# path_step_budget = 1000000          # default 1000000; ceiling 1000000000 (TOML only)
# duplicate_keys = "last_wins"        # or "error"

[internode]
bind = "127.0.0.1:17000"
# broadcast = "192.168.1.1:17000"
# seed = "192.168.1.2:17000"
cluster_name = "ferrosa"
# psk = "shared-secret-key"
# One-way server TLS; required when FERROSA_MODE=production.
# tls_cert = "/etc/ferrosa/tls/node.crt"
# tls_key = "/etc/ferrosa/tls/node.key"
# require_tls = false
# tls_ca = "/etc/ferrosa/tls/ca.crt"

[storage]
data_dir = "/var/lib/ferrosa"
flush_threshold_bytes = 67108864  # 64 MB
flush_interval_secs = 30          # How often to flush memtables + sync to S3
commit_log_segment_size = 33554432  # 32 MB
# Number of sharded memtable buckets. Each bucket has its own RwLock,
# so writes to different shards never contend. Default 64 fits modern
# multi-core servers; raise for higher core counts, lower for very
# small VMs. Honors FERROSA_MEMTABLE_NUM_SHARDS env var.
memtable_num_shards = 64

[s3]
# endpoint = "https://s3.amazonaws.com"
# bucket = "ferrosa-data"
# region = "us-east-1"
# allow_http = false

# ── User-facing endpoints ────────────────────────────────────────────────────
# All standard endpoints are ON by default and bind to localhost. To expose an
# endpoint to a LAN or cluster, explicitly set its bind address to a non-loopback
# value and configure authentication before doing so.
#
# FERROSA_MODE=production refuses to start unless every ENABLED listener and
# internode require TLS — [tls] require = true with cert/key does it once.

[graph]
enabled = true                    # graph HTTP (7474) + Bolt (7687); set false to disable
bind = "127.0.0.1:7474"
# Shared by graph HTTP and Bolt.
# tls_cert = "/etc/ferrosa/tls/server.crt"
# tls_key = "/etc/ferrosa/tls/server.key"
# require_tls = false

[sparql]
enabled = true                    # SPARQL 1.1 endpoint (8080); set false to disable
bind = "127.0.0.1:8080"
# tls_cert = "/etc/ferrosa/tls/server.crt"
# tls_key = "/etc/ferrosa/tls/server.key"
# require_tls = false

[web]
bind = "127.0.0.1:9090"
# tls_cert = "/etc/ferrosa/tls/server.crt"
# tls_key = "/etc/ferrosa/tls/server.key"
# require_tls = false

[postgres]
bind = "127.0.0.1:5432"
# tls_cert = "/etc/ferrosa/tls/server.crt"
# tls_key = "/etc/ferrosa/tls/server.key"
# require_tls = false

[flight]
# Arrow Flight gRPC (8815), only in builds with the `flight` feature (release
# `full` builds). TLS is served with ALPN h2; gRPC clients connect with https://.
bind = "127.0.0.1:8815"
# enabled = true
# tls_cert = "/etc/ferrosa/tls/server.crt"
# tls_key = "/etc/ferrosa/tls/server.key"
# require_tls = false
