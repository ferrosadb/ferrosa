[package]
name = "ferrosa"
version.workspace = true
publish.workspace = true
edition = "2021"
license.workspace = true
description = "Ferrosa — distributed database with CQL and Cypher"

[[bin]]
name = "ferrosa"
path = "src/main.rs"

# PGO training runner. `required-features` keeps it out of the default build
# and out of every shipped artifact: without `pgo-bench`, cargo does not even
# compile it. See src/bin/pgo-workload.rs for why it lives in this package.
[[bin]]
name = "pgo-workload"
path = "src/bin/pgo-workload.rs"
required-features = ["pgo-bench"]

[dependencies]
arc-swap = "1.7"
axum = { version = "0.8", features = ["ws"] }
# HTTPS for the web console (t_d5d122ba). TLS configs come from
# ferrosa-net::tls, so the provider-less feature is used.
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
base64 = "0.22"
ferrosa-cdc = { path = "../ferrosa-cdc" }
ferrosa-cluster = { path = "../ferrosa-cluster" }
ferrosa-common = { path = "../ferrosa-common" }
ferrosa-cql = { path = "../ferrosa-cql" }
ferrosa-flight = { path = "../ferrosa-flight", optional = true }
ferrosa-graph = { path = "../ferrosa-graph" }
ferrosa-sparql = { path = "../ferrosa-sparql" }
ferrosa-net = { path = "../ferrosa-net" }
ferrosa-postgres = { path = "../ferrosa-postgres" }
ferrosa-sched = { path = "../ferrosa-sched" }
ferrosa-schema = { path = "../ferrosa-schema" }
ferrosa-session = { path = "../ferrosa-session" }
ferrosa-sstable = { path = "../ferrosa-sstable" }
ferrosa-storage = { path = "../ferrosa-storage" }
ferrosa-udf = { path = "../ferrosa-udf" }
ferrosa-jsonb = { path = "../ferrosa-jsonb" }
dashmap = "6"
sha2 = "0.10"
futures = "0.3"
inferno = { version = "0.12", default-features = false, features = ["nameattr"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-appender = "0.2"
# Diagnostics. rustls, not native-tls: CI builds this for x86_64-unknown-linux-musl
# and an OpenSSL dependency would break that build. 0.49 rather than an older
# release because 0.34 pins rustls 0.22, which carries four RUSTSEC advisories
# in rustls-webpki 0.102 — a diagnostics dependency must not ship known
# vulnerabilities. default-features off so the SDK installs no panic handler
# without being asked; `panic` is opted into here.
sentry = { version = "0.49", default-features = false, features = [
    "backtrace", "contexts", "panic", "reqwest", "rustls",
] }
sentry-tracing = "0.49"
uuid = { version = "1", features = ["v4"] }

# Replaces glibc malloc to avoid thread-arena retention (27× 64MB arenas ≈ 1.7GB RSS on 3-node cluster).
# Confirmed by live podman testing on 2026-04-19 — cluster memory stays flat vs. climbing to OOM.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.7", features = ["unprefixed_malloc_on_supported_platforms"] }
# Runtime control of the jemalloc options the compile-time `malloc_conf` below
# can only set once, before `main`. Used by `jemalloc_tuning.rs` (mallctl).
tikv-jemalloc-sys = "=0.7.1"

[features]
default = []
# Arrow Flight (gRPC) query endpoint on port 8815 (see ferrosa-flight).
flight = ["dep:ferrosa-flight"]
otel = [
    "tracing-opentelemetry",
    "opentelemetry",
    "opentelemetry-otlp",
    "opentelemetry_sdk",
]
# All shippable optional features. Curated, NOT --all-features: excludes
# `live-infra-tests` (test-only) and `ferrosa-cluster/sprint-03-engine-transfer`
# (in-progress). Used by release artifacts and the published Docker image.
full = ["otel", "flight", "ferrosa-cql/asc-udf", "plpgsql-compile"]

# Everything a database is, and nothing that exists to compile code on the host.
#
# The appliance runs on a 352 MB board, where the full set costs more than it
# buys: asc-udf embeds QuickJS, wasmtime and binaryen to compile AssemblyScript
# on the database host; flight and otel are an endpoint and an exporter stack a
# single-purpose device does not serve; plpgsql-compile does on-device
# compilation for the same reason asc-udf does.
#
# graph, cql and sql are non-optional dependencies and stay compiled — this is
# purely subtractive. It exists as a named feature rather than CI passing
# `--no-default-features` so the intent is reviewable: `default` being empty
# says nothing about which crates are unconditional, and a reader cannot tell
# from a bare flag what was deliberately excluded.
embed = []

# What `embed` does NOT remove, and why — stated so nobody assumes otherwise:
#
#   wasmtime   Not gated on asc-udf. ferrosa-udf uses it as the UDF *runtime*
#              (executor.rs, sandbox.rs, convert.rs), so embedded WebAssembly
#              user functions still work. Only the AssemblyScript *compiler*
#              (rquickjs + wit-*) goes away with asc-udf. Dropping wasmtime would
#              mean dropping UDF execution, which is a product decision, not a
#              feature flag.
#   ring       TLS. rustls's providers are both C; ring is the audited one, and
#              it is already linked by ferrosa-postgres/net/sparql.
#
# So `embed` is "a database without on-host compilation", not "no wasm".
#
# Measured, production graph with --no-dev-dependencies:
#
#   --features ferrosa/full    1812 dependency nodes
#   --features ferrosa/embed   1453   (-359, -20% of the graph)
#   <default>                  1453   (identical: embed adds nothing back)
#
# The 359 are QuickJS, the wit toolchain, flight and the OTLP exporter stack —
# all reachable only through `full`.
# D13: compile PL/pgSQL functions in process (needs FERROSA_ASC_BUNDLE at run time).
plpgsql-compile = ["ferrosa-postgres/plpgsql-compile"]
# Enables jemalloc's heap profiler with libunwind, which avoids the default
# unwinder crash on Linux musl. Profiling remains off until MALLOC_CONF opts in.
profiling = ["tikv-jemallocator/profiling_libunwind"]
# Installs a counting global allocator (see `counting_alloc` in `src/main.rs`)
# so `FERROSA_PG_COMMIT_PROFILE` can attribute a COMMIT's residency peak to the
# phase that caused it. Diagnostic-only; a production build leaves it off.
alloc-probe = ["ferrosa-common/alloc-probe"]
# PGO profiling harness: builds the deterministic `pgo-workload` trainer bin.
#
# Off by default, and inert on the serving path — enabling it adds a bin target
# and nothing else, so the `ferrosa` lib/bin do not link any training code. A
# profiling build (scripts/pgo-build.sh) turns it on for BOTH the instrumented
# and the profile-use build, so their `-C metadata` agree; enabling it on one
# side only is the defect that silently un-optimizes a build.
pgo-bench = []

# Optional OTel dependencies, gated behind the `otel` feature.
[dependencies.tracing-opentelemetry]
version = "0.30"
optional = true

[dependencies.opentelemetry]
version = "0.29"
optional = true

[dependencies.opentelemetry-otlp]
version = "0.29"
optional = true
features = ["grpc-tonic"]

[dependencies.opentelemetry_sdk]
version = "0.29"
optional = true
features = ["rt-tokio"]

[dev-dependencies]
ferrosa-sstable = { path = "../ferrosa-sstable", features = ["test-support"] }
ferrosa-storage = { path = "../ferrosa-storage", features = ["test-support"] }
# Parses the committed docker-compose stacks in
# tests/pair_primary_is_deterministic.rs so the pinned FERROSA_HOST_ID values
# are checked against the ordering choose_pair_role elects on.
# yaml-rust2 rather than the unmaintained serde_yaml (RUSTSEC-2024-0449).
yaml-rust2 = "0.13"
serial_test = "3"
rcgen = "0.14"
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-tungstenite = "0.26"
tower = { version = "0.5", features = ["util"] }
# Real multi-node PROCESS test drives DROP TABLE over the PostgreSQL wire (there
# is no cqlsh on this host), so the test needs a real Postgres client.
tokio-postgres = "0.7"
