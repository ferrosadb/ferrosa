[package]
name = "ferrosa"
version.workspace = true
edition = "2021"
description = "Ferrosa — distributed database with CQL and Cypher"

[[bin]]
name = "ferrosa"
path = "src/main.rs"

[dependencies]
arc-swap = "1.7"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
ferrosa-cdc = { path = "../ferrosa-cdc" }
ferrosa-cluster = { path = "../ferrosa-cluster" }
ferrosa-common = { path = "../ferrosa-common" }
ferrosa-cql = { path = "../ferrosa-cql" }
ferrosa-flight = { path = "../ferrosa-flight", optional = true }
ferrosa-graph = { path = "../ferrosa-graph" }
ferrosa-sparql = { path = "../ferrosa-sparql" }
ferrosa-net = { path = "../ferrosa-net" }
ferrosa-postgres = { path = "../ferrosa-postgres" }
ferrosa-sched = { path = "../ferrosa-sched" }
ferrosa-schema = { path = "../ferrosa-schema" }
ferrosa-session = { path = "../ferrosa-session" }
ferrosa-sstable = { path = "../ferrosa-sstable" }
ferrosa-storage = { path = "../ferrosa-storage" }
ferrosa-udf = { path = "../ferrosa-udf" }
dashmap = "6"
futures = "0.3"
inferno = { version = "0.12", default-features = false, features = ["nameattr"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-appender = "0.2"
# Diagnostics. rustls, not native-tls: CI builds this for x86_64-unknown-linux-musl
# and an OpenSSL dependency would break that build. 0.49 rather than an older
# release because 0.34 pins rustls 0.22, which carries four RUSTSEC advisories
# in rustls-webpki 0.102 — a diagnostics dependency must not ship known
# vulnerabilities. default-features off so the SDK installs no panic handler
# without being asked; `panic` is opted into here.
sentry = { version = "0.49", default-features = false, features = [
    "backtrace", "contexts", "panic", "reqwest", "rustls",
] }
sentry-tracing = "0.49"
uuid = { version = "1", features = ["v4"] }

# Replaces glibc malloc to avoid thread-arena retention (27× 64MB arenas ≈ 1.7GB RSS on 3-node cluster).
# Confirmed by live podman testing on 2026-04-19 — cluster memory stays flat vs. climbing to OOM.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["unprefixed_malloc_on_supported_platforms"] }

[features]
default = []
# Arrow Flight (gRPC) query endpoint on port 8815 (see ferrosa-flight).
flight = ["dep:ferrosa-flight"]
otel = [
    "tracing-opentelemetry",
    "opentelemetry",
    "opentelemetry-otlp",
    "opentelemetry_sdk",
]
# All shippable optional features. Curated, NOT --all-features: excludes
# `live-infra-tests` (test-only) and `ferrosa-cluster/sprint-03-engine-transfer`
# (in-progress). Used by release artifacts and the published Docker image.
full = ["otel", "flight", "ferrosa-cql/asc-udf"]

# Optional OTel dependencies, gated behind the `otel` feature.
[dependencies.tracing-opentelemetry]
version = "0.30"
optional = true

[dependencies.opentelemetry]
version = "0.29"
optional = true

[dependencies.opentelemetry-otlp]
version = "0.29"
optional = true
features = ["grpc-tonic"]

[dependencies.opentelemetry_sdk]
version = "0.29"
optional = true
features = ["rt-tokio"]

[dev-dependencies]
# Parses the committed docker-compose stacks in
# tests/pair_primary_is_deterministic.rs so the pinned FERROSA_HOST_ID values
# are checked against the ordering choose_pair_role elects on.
serde_yaml = "0.9"
serial_test = "3"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-tungstenite = "0.26"
tower = { version = "0.5", features = ["util"] }
