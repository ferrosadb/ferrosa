[package]
name = "ferrosa"
version = "0.1.0"
edition = "2021"
description = "Ferrosa — distributed database with CQL and Cypher"

[[bin]]
name = "ferrosa"
path = "src/main.rs"

[dependencies]
arc-swap = "1.7"
ferrosa-cluster = { path = "../ferrosa-cluster" }
ferrosa-common = { path = "../ferrosa-common" }
ferrosa-net = { path = "../ferrosa-net" }
ferrosa-schema = { path = "../ferrosa-schema" }
ferrosa-storage = { path = "../ferrosa-storage" }
ferrosa-cql = { path = "../ferrosa-cql" }
ferrosa-graph = { path = "../ferrosa-graph" }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
rust-embed = "8"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-tungstenite = "0.26"
