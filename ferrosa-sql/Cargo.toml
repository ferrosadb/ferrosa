[package]
name = "ferrosa-sql"
description = "Bespoke relational query engine for Ferrosa (planner + operators)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ordered-float = { version = "4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
# `Value::Numeric` carries an arbitrary-precision `BigInt` so DECIMAL/VARINT
# round-trip exactly (no float). Already a workspace dep (ferrosa-common uses it).
num-bigint = { version = "0.4", features = ["serde"] }
# Calendar math to parse typed temporal literals (`TIMESTAMP '...'`, `DATE '...'`,
# `TIME '...'`) into the engine's epoch-based integer reprs. `std` only.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Spill-to-disk for the blocking operators (sort / hash aggregate / join build /
# DISTINCT dedup) reuses the storage engine's bounded external merge sort and its
# cancellable temp-table reservation, exactly as ferrosa-graph and ferrosa-cql do
# (forge t_50d99192). Nothing else from ferrosa-storage is used.
ferrosa-storage = { path = "../ferrosa-storage" }
# Spilled runs are length-prefixed JSON records, so `Row`/`Value` are Serde types.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
