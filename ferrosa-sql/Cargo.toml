[package]
name = "ferrosa-sql"
description = "Bespoke relational query engine for Ferrosa (planner + operators)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ordered-float = "4"
uuid = "1"
# `Value::Numeric` carries an arbitrary-precision `BigInt` so DECIMAL/VARINT
# round-trip exactly (no float). Already a workspace dep (ferrosa-common uses it).
num-bigint = "0.4"
# Calendar math to parse typed temporal literals (`TIMESTAMP '...'`, `DATE '...'`,
# `TIME '...'`) into the engine's epoch-based integer reprs. `std` only.
chrono = { version = "0.4", default-features = false, features = ["std"] }
