[package]
name = "ferrosa-jsonb-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ferrosa-jsonb = { path = ".." }

# Own workspace: the fuzz crate is not built by the ferrosa workspace.
[workspace]

[[bin]]
name = "validate"
path = "fuzz_targets/validate.rs"
test = false
doc = false

[[bin]]
name = "parse_text"
path = "fuzz_targets/parse_text.rs"
test = false
doc = false
