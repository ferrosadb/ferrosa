[package]
name = "ferrosa-common"
description = "Shared types for the Ferrosa distributed database"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# `CancelToken`'s `closed` channel (decisions.md D7): the sole mechanism a
# blocked `select!` uses to wake on cancellation without polling. Lives here
# (not ferrosa-storage) so a future ferrosa-sstable write pump can share the
# exact same token as compaction.
crossbeam-channel = "0.5"
# `CqlValue::Jsonb` holds the validated value (T-150, dsm.md F1). ferrosa-jsonb is
# a leaf crate, so this edge cannot form a cycle.
ferrosa-jsonb = { path = "../ferrosa-jsonb" }
num-bigint = "0.4"
proptest = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[features]
test-generators = ["proptest"]

[dev-dependencies]
proptest = "1"
# The deployment-mode tests round-trip the enum; it moved here from
# ferrosa-cluster, which already had serde_json.
serde_json = "1"
# The cluster-membership marker tests write real files.
tempfile = "3"
