[package]
name = "xtask"
version = "0.17.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ferrosadb/ferrosa"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
syn = { version = "2.0.117", features = ["full", "visit", "extra-traits"] }
# `span-locations` is what makes `Span::start().line` resolve in a normal (non
# proc-macro) build — without it spans report line 0. Pinned to the workspace's
# proc-macro2 version.
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0.45"
walkdir = "2.5.0"
toml = "0.8.23"
serde = { version = "1.0.228", features = ["derive"] }
anyhow = "1.0.102"
