[package]
name = "ferrosa-index-builder"
description = "Standalone index builder for Ferrosa: offloads secondary index construction from the engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ferrosa-index-builder"
path = "src/main.rs"

[dependencies]
ferrosa-common = { path = "../ferrosa-common" }
ferrosa-index = { path = "../ferrosa-index" }
ferrosa-sstable = { path = "../ferrosa-sstable" }
ferrosa-storage = { path = "../ferrosa-storage" }
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
object_store = { version = "0.11", features = ["aws"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tower = "0.5"
